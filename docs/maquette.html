<!--
  MAQUETTE DE RÉFÉRENCE · Plan du salon (proposition F1 « bandeau d'icônes »)
  À lire avec floor-plan-copilot.md (même dossier). Fichier autonome : l'ouvrir dans un navigateur.
  Données fictives. Ce n'est PAS du code à copier tel quel : c'est le comportement et le rendu attendus.
  L'implémentation Angular doit réutiliser les composants, icônes et couleurs du projet (voir §1 du .md).

  Où trouver quoi dans ce fichier (rechercher le nom) :
    Modèle et données d'exemple ........ sampleData(), App.s.cfg (réglages), EL (types d'éléments)     → §3
    Géométrie ............................ corners(), overlap() (SAT), inside(), normRot(), aabb()      → §4
    Calage, aimant, rotation ............. snapV(), magnet(), placeAt(), snapAngle()                    → §4
    Conflits ............................. blocks(), conflicts(), mismatch(), issuesOf()                → §5
    Rendu du plan (SVG) .................. planSVG(), frame(), wrap(), px(), fitS()                     → §6
    Stand (bandeau + corps) .............. bandeau(), chipsTech(), App.hooks.standSVG                   → §6.4
    Éléments (escalier, ascenseur…) ...... elShape(), elSVG()                                           → §6.5
    Popin Réglages ....................... openConfig()                                                 → §7
    Interactions ......................... bindPlan(), pick(), arm(), placeArmed(), zoom(), fit(), Act  → §8
    Panneaux ............................. palHTML(), inspectorHTML(), techTiles(), overviewHTML()       → §9
    Mobile ............................... CSS « mobile : plan plein écran + tiroir en bas », grabHTML() → §10
    Format enregistré .................... exportDTO() (bouton « Données »)                             → §3
  Bouton « Annotations » : repères numérotés sur l'écran avec renvoi aux sections du .md.
-->

<style>/* Plan du salon : sol de halle gris-sapin, accent sapin profond ; couleurs de catégories reprises d'Ajoie (getColorStand) */
:root{
  --amber:#9a6400; --amber-soft:#fbefd0;
  --st-ok:#2f7d4f; --st-done:#1d2a26; --st-wait:#a86a00; --st-ver:#3a63a8;
  --bg:#edf1ef; --surface:#ffffff; --surface-2:#e4ebe8; --ink:#16201d; --muted:#596863; --line:#d2dcd8;
  --accent:#24564a; --accent-ink:#ffffff; --accent-soft:#d5e7e0;
  --danger:#b3261e; --danger-soft:#f9dedc; --warn:#8a5d00; --warn-soft:#fbefd0;
  --exit:#1d7a46; --exit-soft:#dcf1e4;
  --floor:#fbfcfb; --grid:#e6ece9; --grid-strong:#c7d3ce; --edge:#71817b;
  --c-ther:#c1d9e1; --c-art:#c1e1c1; --c-ene:#ffddc1; --c-med:#d4c1e1; --c-div:#ffe8b5; --c-none:#dddddd;
  --f-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-sign:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --shadow:0 8px 28px rgba(16,32,28,.16);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1614; --surface:#17201d; --surface-2:#1f2a27; --ink:#e4ece9; --muted:#93a39d; --line:#2b3834;
  --accent:#7cc4ad; --accent-ink:#0b1714; --accent-soft:#1c3a31;
  --danger:#ff8a80; --danger-soft:#3e1d1a; --warn:#e8b84a; --warn-soft:#382d11;
  --exit:#62d495; --exit-soft:#14301f;
  --floor:#141c19; --grid:#1c2622; --grid-strong:#2e3c37; --edge:#7d8d87;
  --c-ther:#2b4a55; --c-art:#2c4d2f; --c-ene:#5a402c; --c-med:#45385a; --c-div:#554725; --c-none:#3a3f3d;
  --amber:#f0bd52; --amber-soft:#3a2f12;
  --st-ok:#6fd398; --st-done:#dfe8e4; --st-wait:#f0bd52; --st-ver:#8fb2f0;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#17201d; --surface-2:#1f2a27; --ink:#e4ece9; --muted:#93a39d; --line:#2b3834;
  --accent:#7cc4ad; --accent-ink:#0b1714; --accent-soft:#1c3a31;
  --danger:#ff8a80; --danger-soft:#3e1d1a; --warn:#e8b84a; --warn-soft:#382d11;
  --exit:#62d495; --exit-soft:#14301f;
  --floor:#141c19; --grid:#1c2622; --grid-strong:#2e3c37; --edge:#7d8d87;
  --c-ther:#2b4a55; --c-art:#2c4d2f; --c-ene:#5a402c; --c-med:#45385a; --c-div:#554725; --c-none:#3a3f3d;
  --amber:#f0bd52; --amber-soft:#3a2f12;
  --st-ok:#6fd398; --st-done:#dfe8e4; --st-wait:#f0bd52; --st-ver:#8fb2f0;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- boutons & puces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--edge)}
.btn.icon{width:34px;padding:0}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:28px;padding:0 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
button.chip{border:0;cursor:pointer}
.dim{font-family:var(--f-sign);font-weight:500;font-size:14px;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.muted{color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--edge);flex:none}
.c-ther{--c:var(--c-ther)}.c-art{--c:var(--c-art)}.c-ene{--c:var(--c-ene)}.c-med{--c:var(--c-med)}.c-div{--c:var(--c-div)}.c-none{--c:var(--c-none)}
.sw{background:var(--c,var(--c-none))}

/* ---------- barre du haut ---------- */
.app{display:flex;flex-direction:column;min-height:100%;height:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{min-width:0}
.brand b{display:block;font-family:var(--f-sign);font-size:23px;font-weight:700;line-height:1.05;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;padding:3px;background:var(--surface-2);border-radius:9px}
.tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab small{font-weight:500;font-size:11px;color:var(--muted)}
.tab .ic{width:15px;height:15px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.zoomv{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.search{position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.search input{height:34px;width:200px;padding-left:32px}

/* ---------- zone de travail ---------- */
.main{flex:1;min-height:0;display:grid}
.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.vp{flex:1;min-height:340px;overflow:auto;position:relative;background:
  radial-gradient(circle at 1px 1px,var(--grid-strong) 1px,transparent 0) 0 0/18px 18px,var(--bg)}
.vp svg{display:block;margin:14px;user-select:none;-webkit-user-select:none;touch-action:pan-x pan-y}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 14px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.panel{background:var(--surface);overflow:auto;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.ph h2{margin:0;font-family:var(--f-sign);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ph .sp{flex:1}
.pb{padding:0 16px 16px;display:grid;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty-note{padding:16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px;text-align:center}

/* cartes exposant (glissables) */
.exl{display:grid;gap:6px}
.exc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:7px 10px 7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.exc:hover{border-color:var(--edge)}
.exc .sw{width:8px;height:30px;border-radius:3px}
.exc b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exc small{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exc.armed,.exc.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.grp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px}

/* formulaires */
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;width:100%;box-sizing:border-box}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:54px}
.actions{display:flex;flex-wrap:wrap;gap:6px}

/* inspecteur */
.insp-h{display:grid;gap:2px;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.insp-h .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.insp-h .t{display:flex;align-items:center;gap:8px;font-family:var(--f-sign);font-size:24px;font-weight:600;line-height:1.1}
.exbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px;border-radius:8px;background:var(--surface-2)}
.exbox .sw{grid-row:span 2;width:8px;height:100%;min-height:30px}
.exbox b{font-size:14px;font-weight:500}
.exbox small{color:var(--muted)}
.alert{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:12.5px}
.alert .ic{width:16px;height:16px;margin-top:1px}
.alert.bad{background:var(--danger-soft);color:var(--danger)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.clist{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.clist button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;font-size:12.5px}
.clist button:hover{border-color:var(--danger)}
.clist .ic{width:15px;height:15px;color:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kv div{padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.kv b{display:block;font-family:var(--f-sign);font-weight:500;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kv small{font-size:11.5px;color:var(--muted)}
.kv .bad b{color:var(--danger)}

/* ---------- plan SVG ---------- */
.floor{fill:var(--floor);stroke:var(--ink);stroke-width:3px;vector-effect:non-scaling-stroke}
.gl{stroke:var(--grid);stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
.gl2{stroke:var(--grid-strong);stroke-width:1px;vector-effect:non-scaling-stroke;fill:none}
.ruler line{stroke:var(--edge);stroke-width:1px;vector-effect:non-scaling-stroke}
.ruler text{fill:var(--muted);font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.ruler text.big{font-weight:500;fill:var(--ink)}
.pdim{fill:var(--muted);font-family:var(--f-sign);font-size:.5px;font-weight:500}
.it{cursor:grab}
.it.lock{cursor:pointer}
.it .b{fill:var(--c-none);stroke:var(--edge);stroke-width:1.2px;vector-effect:non-scaling-stroke}
.it .ov{fill:none;pointer-events:none}
.k-stand.cat-ther .b{fill:var(--c-ther)}.k-stand.cat-art .b{fill:var(--c-art)}.k-stand.cat-ene .b{fill:var(--c-ene)}
.k-stand.cat-med .b{fill:var(--c-med)}.k-stand.cat-div .b{fill:var(--c-div)}
.k-stand.empty .b{fill:var(--surface);stroke:var(--edge);stroke-dasharray:5 3}
.k-stand.pre .ov{fill:url(#hpre)}
.t-num{font-family:var(--f-sign);font-weight:500;fill:var(--ink);letter-spacing:.01em}
.t-name{font-family:var(--f-ui);font-weight:400;fill:var(--ink)}
.t-sub{font-family:var(--f-ui);fill:var(--muted)}
.k-stand.empty .t-num{fill:var(--muted)}
.t-el{font-family:var(--f-sign);font-weight:500;fill:var(--muted);letter-spacing:.09em}
.el-wall .b,.el-pillar .b{fill:var(--ink);stroke:none}
.el-aisle .b{fill:url(#haisle);stroke:var(--grid-strong);stroke-dasharray:6 4}
.el-door .b{fill:var(--accent-soft);stroke:var(--accent);stroke-dasharray:6 3}
.el-door .t-el{fill:var(--accent)}
.el-exit .b{fill:var(--exit-soft);stroke:var(--exit);stroke-width:2px}
.el-exit .t-el{fill:var(--exit)}
.el-stage .b,.el-bar .b,.el-tech .b{fill:var(--surface-2);stroke:var(--edge)}
.el-mark .b{fill:transparent;stroke:var(--muted);stroke-dasharray:2 3}
.it.warn .b{stroke:var(--warn);stroke-width:2.5px}
.it.bad .b{stroke:var(--danger);stroke-width:2.5px}
.it.bad .ov{fill:url(#hbad)}
.it.sel .b{stroke:var(--accent);stroke-width:3px}
.it.sel.bad .b{stroke:var(--danger);stroke-width:3.5px}
.selr{fill:none;stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none}
.rstem{stroke:var(--accent);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.rh{cursor:grab}
.protr circle{fill:var(--accent-soft);fill-opacity:.35;stroke:var(--accent);stroke-width:1px;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.protr line{stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke}
.protr line.ref{stroke:var(--edge);stroke-width:1px}
.protr text{fill:var(--accent);font-family:var(--f-sign);font-weight:500}
.angrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.angrow input{width:64px}
.pill{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.hd{fill:var(--surface);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:nwse-resize}
.it.target .b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3.5px;stroke-dasharray:none}
.it.compat .b{stroke:var(--accent);stroke-width:2.5px;fill:var(--accent-soft);stroke-dasharray:none;animation:pulse 1.4s ease-in-out infinite}
.it.faded{opacity:.32}
.it.tmp{opacity:.88}
@keyframes pulse{50%{stroke-width:5px}}
.p-bad{stroke:var(--danger);stroke-width:.07;opacity:.6}
.p-pre{stroke:var(--accent);stroke-width:.05;opacity:.55}
.p-aisle{stroke:var(--grid-strong);stroke-width:.05}
.gh .b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.gh.bad .b{fill:var(--danger-soft);stroke:var(--danger)}
.gh text{font-family:var(--f-sign);font-weight:500;fill:var(--accent)}
.gh.bad text{fill:var(--danger)}

/* ---------- flottants ---------- */
.dragghost{position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;transform:translate(14px,14px);box-shadow:var(--shadow);white-space:nowrap}
.armedbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 12px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.armedbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.armedbar .btn{height:28px;background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast .btn{height:28px;background:transparent;color:var(--bg);border-color:rgba(127,127,127,.5)}
.dlg-bg{position:fixed;inset:0;z-index:110;background:rgba(10,20,17,.45);display:grid;place-items:center;padding:16px}
.dlg{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:grid;gap:14px;padding:18px}
.dlg h3{margin:0;font-family:var(--f-sign);font-size:22px;font-weight:600}
.dlg pre{margin:0;max-height:46vh;overflow:auto;padding:10px;border-radius:8px;background:var(--surface-2);font-size:11.5px;line-height:1.45}
.dlg .actions{justify-content:flex-end}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- statut & infos techniques ---------- */
.st-ok{--st:var(--st-ok)}.st-done{--st:var(--st-done)}.st-wait{--st:var(--st-wait)}.st-ver{--st:var(--st-ver)}
.stdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--st);margin-right:5px;vertical-align:0;flex:none}
.stp{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:500;color:var(--st);background:var(--surface);border:1px solid var(--st)}
.stp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}
.facts{display:flex;flex-wrap:wrap;gap:5px}
.gly{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink);overflow:visible}
.gly .fillg{fill:currentColor;stroke:none}
symbol .fillg{fill:currentColor;stroke:none}
.sbadge circle{fill:var(--st);stroke:var(--surface);stroke-width:1px;vector-effect:non-scaling-stroke}
.sbadge .gly{color:var(--surface);stroke-width:2.2}
.t-tech{font-family:var(--f-ui);font-weight:400;fill:var(--ink);font-variant-numeric:tabular-nums}
.t-person{font-family:var(--f-ui);fill:var(--ink);opacity:.72}

/* ---------------- géométrie & conflits ---------------- */
/* chaque objet peut porter un angle `rot` (degrés, sens horaire, autour de son centre) */
const rad = d => d * Math.PI / 180;
const r3 = v => Math.round(v * 1000) / 1000;
const ctr = it => ({ x: it.x + it.w / 2, y: it.y + it.h / 2 });
function corners(it) {
  const c = ctr(it), a = rad(it.rot || 0), co = Math.cos(a), si = Math.sin(a), hw = it.w / 2, hh = it.h / 2;
  return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([u, v]) => ({ x: c.x + u * co - v * si, y: c.y + u * si + v * co }));
}
function aabb(it) { const cs = corners(it), xs = cs.map(c => c.x), ys = cs.map(c => c.y); return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) }; }
function overlap(a, b) {
  if (!a.rot && !b.rot) return a.x < b.x + b.w - EPS && b.x < a.x + a.w - EPS && a.y < b.y + b.h - EPS && b.y < a.y + a.h - EPS;
  const ca = corners(a), cb = corners(b);
  for (const d of [a.rot || 0, (a.rot || 0) + 90, b.rot || 0, (b.rot || 0) + 90]) {
    const nx = Math.cos(rad(d)), ny = Math.sin(rad(d));
    const pa = ca.map(c => c.x * nx + c.y * ny), pb = cb.map(c => c.x * nx + c.y * ny);
    if (Math.max(...pa) - Math.min(...pb) < EPS || Math.max(...pb) - Math.min(...pa) < EPS) return false;
  }
  return true;
}
function inside(p, a) {
  const c = ctr(a), t = rad(-(a.rot || 0)), dx = p.x - c.x, dy = p.y - c.y;
  const u = dx * Math.cos(t) - dy * Math.sin(t), v = dx * Math.sin(t) + dy * Math.cos(t);
  return Math.abs(u) <= a.w / 2 && Math.abs(v) <= a.h / 2;
}
/* angle ramené dans [0, 90[ : un rectangle tourné de 120° = le même, côtés échangés, tourné de 30° */
function normRot(it) {
  if (App.v.fullTurn) {

    if (f >= 359.95) f = 0;
    if (f) it.rot = f; else { delete it.rot; it.x = Math.round(it.x * 100) / 100; it.y = Math.round(it.y * 100) / 100; }
    return;
  }
  let r = (((it.rot || 0) % 180) + 180) % 180;

/* glisser depuis une palette (souris) / toucher pour armer (tactile) */
function pick(e, tpl, label) {

  if (e.pointerType === 'touch') { const up = () => { removeEventListener('pointerup', up); arm(tpl, label); }; addEventListener('pointerup', up); return; }
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY, prev = App.snapshot(), plan = App.plan();
  let started = false, ghost = null;
  const drop = () => { const i = plan.items.findIndex(x => x.id === 'tmp'); if (i >= 0) plan.items.splice(i, 1); };
  const move = ev => {
    if (!started && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
    if (!started) { started = true; ghost = document.createElement('div'); ghost.className = 'dragghost'; ghost.innerHTML = label; document.body.appendChild(ghost); }
    ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
    const r = App.vp.getBoundingClientRect();
    const over = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    if (over) {
      const p = toM(ev);
      const t = tpl.exId && emptyAt(p);
      if (t) { drop(); App.v.target = t.id; App.emitPlan(); return; }
      App.v.target = null;
      if (tpl.assignOnly) { App.emitPlan(); return; }
      let it = plan.items.find(x => x.id === 'tmp');
      if (!it) { it = makeItem(tpl); it.id = 'tmp'; plan.items.push(it); }

    const target = App.v.target; App.v.target = null;
    if (target) { drop(); Act.assign(target, tpl.exId); return; }
    if (tpl.assignOnly) { App.emitPlan(); toast('Déposez l\'exposant sur un emplacement libre'); return; }
    const it = plan.items.find(x => x.id === 'tmp');

}

  const bg = dialog(`<h3>Données du plan</h3><p class="hint">Format proposé pour remplacer la grille de cellules : chaque emplacement et chaque élément est stocké en mètres par son centre, sa largeur, sa profondeur et un angle (rotation horaire autour du centre, de 0 à 360°). Le back-end n'a plus à connaître la taille des cases.</p><pre id="dto">${esc(json)}</pre><div class="actions"><button class="btn" data-copy>${ic('copy')}Copier</button><button class="btn primary" data-close>Fermer</button></div>`);
  $('[data-copy]', bg).onclick = async e => {
    try { await navigator.clipboard.writeText(json); e.currentTarget.lastChild.textContent = 'Copié'; }
    catch { const r = document.createRange(); r.selectNodeContents($('#dto', bg)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
}
/* ---------------- popin « Réglages » : grille, pas, plans, éléments ----------------
   Travaille sur un brouillon ; rien ne change avant « Appliquer » (annulable ensuite avec Ctrl+Z). */
const STEPS = { grid: [0.25, 0.5, 1], move: [0.05, 0.1, 0.25, 0.5, 1], rot: [1, 5, 15, 45] };
function openConfig(focus = 'grid', addPlan = false) {
  const c = App.s.cfg;
  const D = {
    grid: c.grid, move: c.move, rot: c.rot, magnet: App.v.magnet, el: JSON.parse(JSON.stringify(c.el)),
    plans: App.s.plans.map(p => ({ ref: p, name: p.name, w: p.w, h: p.h, n: p.items.length, ex: p.items.filter(i => i.exId).length })),
  };
  if (addPlan) D.plans.push({ ref: null, name: '', w: 20, h: 10, n: 0, ex: 0, fresh: true });
  const bg = dialog(`<div class="cfg-h"><h3>Réglages du plan</h3><button class="btn icon ghost" data-close aria-label="Fermer">${ic('close')}</button></div>
    <nav class="cfg-nav" aria-label="Sections"><button data-go="grid">Grille et pas</button><button data-go="plans">Plans <small>${D.plans.length}</small></button><button data-go="els">Éléments</button></nav>
    <div class="cfg-b" id="cfgb"></div>
    <div class="cfg-f"><span class="hint" id="cfgmsg">S'applique à tous les plans · annulable avec Ctrl+Z</span><span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn primary" data-apply>${ic('check')}Appliquer</button></div>`, 'cfgd');
  const body = $('#cfgb', bg);
  const seg = (k, vals, unit) => `<div class="seg" role="radiogroup" data-k="${k}">${vals.map(v => `<button role="radio" aria-checked="${D[k] === v}" class="${D[k] === v ? 'on' : ''}" data-v="${v}">${fmt(v)}${unit}</button>`).join('')}</div>`;
  const unit = (attrs, v, u = 'm') => `<label class="unit"><input type="number" ${attrs} value="${v}"><span>${u}</span></label>`;
  function preview() {
    // 8 m de bande : lignes de grille, positions possibles au pas de déplacement, un stand de 3 m posé vers 1,3 m
    const L = 8, x = D.move ? Math.round(1.3 / D.move) * D.move : 1.3;
    let g = '';
    for (let v = 0; v <= L + 1e-6; v = r3(v + D.grid)) g += `<line class="pv-g ${Math.abs(v % 1) < 1e-6 ? 'm' : ''}" x1="${v}" y1="0" x2="${v}" y2="1.5"/>`;
    let d = '';
    if (D.move >= 0.1) for (let v = 0; v <= L + 1e-6; v = r3(v + D.move)) d += `<circle class="pv-d" cx="${v}" cy="1.72" r="0.035"/>`;
    else d = `<line class="pv-dl" x1="0" y1="1.72" x2="${L}" y2="1.72"/>`;
    const a = D.rot >= 15 ? D.rot : 15;
    return `<svg class="pv" viewBox="-0.2 -0.3 8.4 2.45" role="img" aria-label="Aperçu : grille ${fmt(D.grid)} m, pas ${fmt(D.move)} m">${g}${d}
      <rect class="pv-s" x="${x}" y="0.35" width="3" height="0.9" rx="0.04"/><text class="pv-t" x="${x + 1.5}" y="0.82">x = ${fmt(x)} m</text>
      <g transform="translate(6.6 0.8) rotate(${a})"><rect class="pv-r" x="-0.55" y="-0.35" width="1.1" height="0.7" rx="0.04"/></g><text class="pv-t s" x="6.6" y="0.1">${a}°</text></svg>`;
  }
  function render() {
    const keep = body.scrollTop;
    body.innerHTML = `
    <section class="cfg-s" id="cfg-grid"><h4>Grille et pas</h4>
      <div class="cfg-pv">${preview()}<p class="hint">Traits : grille affichée. Points : positions possibles quand on glisse un objet.</p></div>
      <div class="cfg-row"><div><b>Grille affichée</b><small>Lignes fines du plan, un trait plus marqué chaque mètre et tous les 5 m.</small></div>${seg('grid', STEPS.grid, ' m')}</div>
      <div class="cfg-row"><div><b>Pas de déplacement</b><small>Les objets se calent sur ce pas en glissant et avec les flèches. Avec ${fmt(D.move)} m, un stand peut commencer à ${fmt(r3(D.move * Math.ceil(3.6 / D.move)))} m. Alt + flèche : 5 cm.</small></div>${seg('move', STEPS.move, ' m')}</div>
      <div class="cfg-row"><div><b>Pas de rotation</b><small>Poignée de rotation et touches Q / E. Maj + poignée : degré par degré.</small></div>${seg('rot', STEPS.rot, '°')}</div>
      <div class="cfg-row"><div><b>Aimanter aux bords voisins</b><small>Colle un objet contre le mur ou le stand d'à côté quand il en est à moins de 35 cm.</small></div><label class="tog"><input type="checkbox" role="switch" data-mag ${D.magnet ? 'checked' : ''}><span></span></label></div>
    </section>
    <section class="cfg-s" id="cfg-plans"><h4>Plans</h4>
      <div class="pl-row hd"><span></span><span>Nom</span><span>Largeur</span><span>Profondeur</span><span>Contenu</span><span></span></div>
      ${D.plans.map((p, i) => `<div class="pl-row ${p.confirm ? 'confirm' : ''}" data-i="${i}">
        <span class="mv"><button class="btn icon ghost sm" data-up="${i}" ${i ? '' : 'disabled'} aria-label="Monter">↑</button><button class="btn icon ghost sm" data-down="${i}" ${i < D.plans.length - 1 ? '' : 'disabled'} aria-label="Descendre">↓</button></span>
        <input class="nm" data-p="name" value="${esc(p.name)}" placeholder="Ex. : Salle polyvalente" aria-label="Nom du plan">
        <span class="w">${unit('data-p="w" min="2" step="0.5" aria-label="Largeur"', p.w)}</span>
        <span class="h">${unit('data-p="h" min="2" step="0.5" aria-label="Profondeur"', p.h)}</span>
        <span class="n muted">${p.fresh ? 'nouveau' : `${p.n} objet${p.n > 1 ? 's' : ''}`}</span>
        <span class="del">${p.confirm ? `<span class="cf">${p.ex} exposant${p.ex > 1 ? 's' : ''} à replacer</span><button class="btn sm danger" data-kill="${i}">Supprimer</button><button class="btn sm" data-keep="${i}">Garder</button>`
      : `<button class="btn icon ghost danger" data-rm="${i}" ${D.plans.length > 1 ? '' : 'disabled'} aria-label="Supprimer le plan">${ic('trash')}</button>`}</span></div>`).join('')}
      <div><button class="btn sm" data-addp>${ic('plus')}Ajouter un plan</button></div>
      <p class="hint">Réduire un plan ne supprime rien : les stands qui dépassent passent en conflit pour que vous les déplaciez.</p>
    </section>
    <section class="cfg-s" id="cfg-els"><h4>Éléments</h4>
      <p class="hint">Taille à la pose et comportement par défaut. Un élément bloquant passe en conflit dès qu'un stand le chevauche ; chaque objet posé peut ensuite avoir son propre réglage.</p>
      <div class="el-row hd"><span></span><span>Type</span><span>Largeur</span><span>Profondeur</span><span>Bloquant</span></div>
      ${ELORDER.map(k => { const d = D.el[k], r = Math.min(36 / d.w, 22 / d.h);
      return `<div class="el-row" data-k="${k}"><svg class="ei" viewBox="0 0 40 26"><g class="it k-el el-${k}${d.block ? '' : ' soft'}" transform="translate(${20 - d.w * r / 2} ${13 - d.h * r / 2}) scale(${r})"><rect class="b" width="${d.w}" height="${d.h}" rx="${k === 'power' ? d.w / 2 : 0}"/>${elShape({ type: k, w: d.w, h: d.h })}</g></svg>
          <span class="lb"><b>${EL[k].label}</b><small>${EL[k].hint}</small></span>
          <span class="w">${unit('data-e="w" min="0.1" step="0.1" aria-label="Largeur ' + EL[k].label + '"', d.w)}</span>
          <span class="h">${unit('data-e="h" min="0.1" step="0.1" aria-label="Profondeur ' + EL[k].label + '"', d.h)}</span>
          <label class="tog bl"><input type="checkbox" role="switch" data-e="block" ${d.block ? 'checked' : ''} aria-label="${EL[k].label} bloquant"><span></span></label></div>`; }).join('')}
    </section>`;
    body.scrollTop = keep;
    $('.cfg-nav [data-go="plans"] small', bg).textContent = D.plans.length;
  }
  const go = k => { const t = $('#cfg-' + k, bg); if (t) body.scrollTo({ top: t.offsetTop - body.offsetTop - 4, behavior: 'smooth' }); };
  render();
  requestAnimationFrame(() => { go(focus); if (addPlan) { const i = $$('.pl-row .nm', bg).pop(); i && i.focus(); } });
  bg.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    const ds = t.dataset, segk = t.closest('[data-k]') && t.closest('.seg') ? t.closest('.seg').dataset.k : null;
    if (ds.go) go(ds.go);
    else if (segk && ds.v != null) { D[segk] = +ds.v; render(); }
    else if (ds.up != null) { const i = +ds.up; [D.plans[i - 1], D.plans[i]] = [D.plans[i], D.plans[i - 1]]; render(); }
    else if (ds.down != null) { const i = +ds.down; [D.plans[i + 1], D.plans[i]] = [D.plans[i], D.plans[i + 1]]; render(); }
    else if (ds.rm != null) { const p = D.plans[+ds.rm]; if (p.n) { p.confirm = true; render(); } else { D.plans.splice(+ds.rm, 1); render(); } }
    else if (ds.kill != null) { D.plans.splice(+ds.kill, 1); render(); }
    else if (ds.keep != null) { D.plans[+ds.keep].confirm = false; render(); }
    else if ('addp' in ds) { D.plans.push({ ref: null, name: '', w: 20, h: 10, n: 0, ex: 0, fresh: true }); render(); const i = $$('.pl-row .nm', bg).pop(); i && i.focus(); }
    else if ('apply' in ds) apply();
  });
  bg.addEventListener('input', e => {
    const t = e.target, row = t.closest('[data-i]'), er = t.closest('.el-row[data-k]');
    if (t.dataset.p && row) { const p = D.plans[+row.dataset.i]; p[t.dataset.p] = t.dataset.p === 'name' ? t.value : parseFloat(t.value.replace(',', '.')); }
    if (t.dataset.e && er) { const d = D.el[er.dataset.k]; if (t.dataset.e === 'block') { d.block = t.checked; er.querySelector('.it').classList.toggle('soft', !t.checked); } else d[t.dataset.e] = parseFloat(t.value.replace(',', '.')); }
    if ('mag' in t.dataset) D.magnet = t.checked;
  });
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); bg.remove(); } });
  function apply() {
    const msg = $('#cfgmsg', bg), bad = m => { msg.textContent = m; msg.classList.add('err'); };
    for (const p of D.plans) if (!(p.w >= 2 && p.h >= 2 && p.w <= 400 && p.h <= 400)) return bad(`« ${p.name || 'Nouveau plan'} » : largeur et profondeur entre 2 et 400 m.`), go('plans');
    for (const k of ELORDER) if (!(D.el[k].w >= 0.1 && D.el[k].h >= 0.1)) return bad(`${EL[k].label} : taille d'au moins 10 cm.`), go('els');
    const before = allConflicts().length, placedBefore = App.placed().size;
    const fresh = D.plans.findIndex(p => p.fresh), cur = App.plan();
    App.mut(() => {
      Object.assign(App.s.cfg, { grid: D.grid, move: D.move, rot: D.rot, el: D.el });
      App.s.plans = D.plans.map(p => p.ref ? Object.assign(p.ref, { name: p.name.trim() || 'Sans nom', w: p.w, h: p.h }) : { id: null, name: p.name.trim() || 'Nouveau plan', w: p.w, h: p.h, items: [] });
      const i = App.s.plans.indexOf(cur); App.v.plan = fresh >= 0 ? fresh : i >= 0 ? i : 0;
      App.v.sel = null;
    });
    App.v.magnet = D.magnet;
    bg.remove();
    const more = allConflicts().length - before, lost = placedBefore - App.placed().size;
    toast(['Réglages appliqués', more > 0 ? `${more} conflit${more > 1 ? 's' : ''} à revoir` : '', lost > 0 ? `${lost} exposant${lost > 1 ? 's' : ''} à replacer` : ''].filter(Boolean).join(' · '), true);
    if (fresh >= 0) fit(); else App.emit();
  }
}

/* ---------------- clics & clavier communs ---------------- */
let conflictIdx = 0;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-plan],[data-goto],[data-ang]'); if (!t) return;
  if (t.dataset.ang != null) { App.v.sel && Act.setRot(App.v.sel, +t.dataset.ang); return; }
  if (t.dataset.plan) { App.v.plan = +t.dataset.plan; App.v.sel = null; App.emit(); fit(); return; }
  if (t.dataset.goto) { focusItem(t.dataset.goto); return; }
  const a = t.dataset.a, sel = App.v.sel;
  ({
    undo: () => App.undo(), redo: () => App.redo(),
    snap: () => { App.v.snap = !App.v.snap; App.emit(); }, magnet: () => { App.v.magnet = !App.v.magnet; App.emit(); },
    zin: () => zoom(1.2), zout: () => zoom(1 / 1.2), fit, export: openExport,
    'plan-add': () => openConfig('plans', true), 'plan-cfg': () => openConfig('plans'), cfg: () => openConfig('grid'),
    'block-reset': () => { const it = sel && App.item(sel); if (it) App.mut(() => { delete it.block; }); },
    disarm: () => { App.v.armed = null; App.emit(); },
    rot: () => sel && Act.rotate(sel), dup: () => sel && Act.dup(sel), del: () => sel && Act.del(sel), free: () => sel && Act.free(sel),
    'rot-new': () => { App.v.rot = !App.v.rot; App.emit(); },
    'info-ex': () => { App.v.info = 'ex'; App.emit(); }, 'info-tech': () => { App.v.info = 'tech'; App.emit(); },
    who: () => { App.v.who = App.v.who === 'person' ? 'name' : 'person'; App.emit(); },
    'next-conflict': () => { const l = allConflicts(); if (!l.length) return; const c = l[conflictIdx++ % l.length]; focusItem((c.a.kind === 'stand' ? c.a : c.b || c.a).id); },
  })[a]?.();
});
document.addEventListener('change', e => {
  if (e.target.id === 'q') {
    const v = e.target.value, hit = [...App.placed()].find(([id, { it }]) => v.startsWith(App.ex(id).name + ' · '));
    if (hit) { focusItem(hit[1].it.id); e.target.value = ''; }
    return;
  }
  const f = e.target.closest('[data-f]'); if (!f || !App.v.sel) return;
  const it = App.item(App.v.sel); if (it) applyField(it, f.dataset.f, f.type === 'checkbox' ? f.checked : f.value);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) { if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey, sel = App.v.sel;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? App.redo() : App.undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); App.redo(); return; }
  if (mod && k === 'd' && sel) { e.preventDefault(); Act.dup(sel); return; }
  if (k === 'escape') { if (App.hooks.esc && App.hooks.esc()) return; App.v.armed = null; App.v.sel = null; App.emit(); return; }
  if (App.hooks.key && App.hooks.key(e)) return;
  if (!mod && k === 't') { App.v.info = App.v.info === 'tech' ? 'ex' : 'tech'; App.emit(); return; }
  if (!sel || mod) return;
  const it = App.item(sel); if (!it || (App.hooks.locked && App.hooks.locked(it))) return;
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); Act.del(sel); }
  else if (k === 'r') Act.rotate(sel);
  else if (k === 'q' || k === 'e') Act.turn(sel, (k === 'q' ? -1 : 1) * (e.altKey ? 1 : App.s.cfg.rot));
  else if (k.startsWith('arrow')) {
    e.preventDefault(); const st = e.altKey ? 0.05 : App.s.cfg.move;
    App.mut(() => { if (k === 'arrowleft') it.x -= st; if (k === 'arrowright') it.x += st; if (k === 'arrowup') it.y -= st; if (k === 'arrowdown') it.y += st; it.x = r3(it.x); it.y = r3(it.y); });
  }
});
addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(() => App.emitPlan(), 120); });

<script>/* F1 · Bandeau d'icônes
   En tête de chaque stand : une barre teintée avec le n° à gauche et, à droite, la pastille de statut
   puis les alertes (chevauchement, dimension, pré-réservation, stand partagé).
   Mode technique : petites étiquettes arrondies ⚡ · chaises · tables. */
function bandeau(it, x0, y0, W, hh) {
  const fs = hh * 0.58, pad = Math.min(hh * 0.42, W * 0.06), mid = y0 + hh / 2, e = it.exId && App.ex(it.exId);
  const num = String(it.num ?? '–');
  let t = `<rect class="hb" x="${x0}" y="${y0}" width="${W}" height="${hh}"/><line class="hl" x1="${x0}" y1="${y0 + hh}" x2="${x0 + W}" y2="${y0 + hh}"/>`;
  t += `<text class="h-num" x="${x0 + pad}" y="${mid}" font-size="${fs}" dominant-baseline="central">${esc(num)}</text>`;
  const marks = [];
  if (e) marks.push(['st', stOf(e)]);
  issuesOf(it).forEach(i => marks.push(i));
  let x = x0 + W - pad, room = W - 2 * pad - num.length * fs * 0.55 - fs * 0.5;
  for (const k of marks) {
    const s = fs * 1.08, gap = fs * 0.32;
    if (s > room) break;
    if (k[0] === 'st') {
      const r = s * 0.52, c = x - r;
      t += `<g class="sdot st-${k[1].c}"><circle cx="${c}" cy="${mid}" r="${r}"/>${glyph(k[1].g, c - r * 0.72, mid - r * 0.72, r * 1.44)}</g>`;
      x -= 2 * r + gap; room -= 2 * r + gap;
    } else {
      t += glyph(k[0], x - s, mid - s / 2, s, 'hi ' + k[1]);
      x -= s + gap; room -= s + gap;
    }
  }
  return t;
}
function chipsTech(e, cx, x0, W, by0, bh, pad) {
  const items = [['bolt', '', e.elec ? 'on elec' : 'off'], ['chair', e.chairs, e.chairs ? '' : 'off'], ['table', e.tables, e.tables ? '' : 'off']];
  const ch = Math.min(fitS(px(18), 0.2, 0.46), bh * 0.4), g = ch * 0.62, tf = ch * 0.58, gap = ch * 0.24, inner = ch * 0.28;
  const wOf = ([, v]) => inner * 2 + g + (v !== '' ? g * 0.18 + String(v).length * tf * 0.62 : 0);
  const maxW = W - 2 * pad, rows = [[]];
  let lw = 0;
  for (const it of items) {
    const w = wOf(it);
    if (rows[rows.length - 1].length && lw + gap + w > maxW) { rows.push([]); lw = 0; }
    lw += (rows[rows.length - 1].length ? gap : 0) + w; rows[rows.length - 1].push(it);
  }
  const totalH = rows.length * ch + (rows.length - 1) * gap;
  if (totalH > bh - pad) return '';
  let y = by0 + (bh - totalH) / 2, t = '';
  for (const row of rows) {
    const rw = row.reduce((a, it) => a + wOf(it), 0) + gap * (row.length - 1);
    let x = cx - rw / 2;
    for (const it of row) {
      const [k, v, c] = it, w = wOf(it);
      t += `<g class="tchip ${c}"><rect x="${x}" y="${y}" width="${w}" height="${ch}" rx="${ch / 2}"/>${glyph(k === 'bolt' && !e.elec ? 'nobolt' : k, x + inner, y + (ch - g) / 2, g, 'tg')}${v !== '' ? `<text x="${x + inner + g * 1.18}" y="${y + ch / 2}" font-size="${tf}" dominant-baseline="central">${v}</text>` : ''}</g>`;
      x += w + gap;
    }
    y += ch + gap;
  }
  return t;
}
App.hooks.standSVG = (it, f) => {
  const W = f.W, H = f.H, cx = it.w / 2, cy = it.h / 2, x0 = cx - W / 2, y0 = cy - H / 2, m = Math.min(W, H);
  const e = it.exId && App.ex(it.exId);
  const hh = Math.min(fitS(px(20), 0.24, 0.62), H * 0.38), pad = Math.min(hh * 0.42, W * 0.06);
  let t = bandeau(it, x0, y0, W, hh);
  const by0 = y0 + hh, bh = H - hh, bc = by0 + bh / 2;
  if (!e) {
    const s2 = fitS(px(11), m * 0.1, Math.min(0.36, bh * 0.3));
    t += txt(cx, bc - s2 * 0.5, s2 * 1.05, 't-num', `${fmt(it.w)} × ${fmt(it.h)}`);
    t += txt(cx, bc + s2 * 0.75, s2 * 0.82, 't-sub', it.pre ? 'pré-réservé' : 'libre');
    return t;
  }
  if (App.v.info === 'tech') return t + chipsTech(e, cx, x0, W, by0, bh, pad);
  const ts = fitS(px(12.5), m * 0.11, Math.min(0.42, bh * 0.3)), ss = ts * 0.8, lh = ts * 1.18;
  const lines = wrap(shownName(e), W - 2 * pad, ts, bh > ts * 3.6 ? 2 : 1);
  const second = bh > lines.length * lh + ss * 1.9 + pad;
  const blockH = lines.length * lh + (second ? ss * 1.3 : 0);
  let y = bc - blockH / 2 + lh / 2;
  lines.forEach(l => { t += `<text x="${cx}" y="${y}" font-size="${ts}" class="t-name" text-anchor="middle" dominant-baseline="central">${esc(l)}</text>`; y += lh; });
  if (second) t += `<text x="${cx}" y="${y - lh / 2 + ss * 0.85}" font-size="${ss}" class="t-sub2" text-anchor="middle" dominant-baseline="central">${esc(cut(App.v.who === 'person' ? e.name : e.contact, W - 2 * pad, ss))}</text>`;
  return t;
};

<script>
  let tab = 'ex', q = '';
  const pal = $('#pal'), insp = $('#insp');

  function palHTML() {
    const un = App.unplaced();
    const head = `<div class="ptabs" role="tablist">
    <button class="tab ${tab === 'ex' ? 'on' : ''}" data-tab="ex">${ic('user')}Exposants <small>${un.length}</small></button>
    <button class="tab ${tab === 'slot' ? 'on' : ''}" data-tab="slot">${ic('box')}Vides</button>
    <button class="tab ${tab === 'el' ? 'on' : ''}" data-tab="el">${ic('wall')}Éléments</button>
    <button class="tab mobile-only ${tab === 'sum' ? 'on' : ''}" data-tab="sum">Bilan${allConflicts().length ? ` <span class="chip bad">${allConflicts().length}</span>` : ''}</button></div>`;
    if (tab === 'sum') return head + overviewHTML();
    const nr = App.v.newRot || 0;
    const orient = `<div class="orient"><span>Angle des prochains posés</span>${[[0, '↓'], [90, '←'], [180, '↑'], [270, '→'], [315, '↘']].map(([a, l]) => `<button class="pill ${nr === a ? 'on' : ''}" data-newrot="${a}" title="${a}°" aria-label="Angle ${a}°">${l}</button>`).join('')}</div>`;
    if (tab === 'ex') {
      const list = un.filter(e => !q || (e.name + ' ' + e.contact).toLowerCase().includes(q.toLowerCase()));
      const groups = Object.keys(CAT).map(k => [k, list.filter(e => e.cat === k)]).filter(g => g[1].length);
      return head + `<div class="pb" style="padding-top:10px">
      <p class="hint">Glissez un exposant sur un emplacement libre pour l'attribuer, ou ailleurs sur le plan pour créer son stand à sa dimension.</p>
      <div class="filter">${ic('search')}<input id="fq" value="${esc(q)}" placeholder="Filtrer les exposants à placer"></div>${orient}
      ${groups.length ? groups.map(([k, es]) => `<div class="grp"><i class="sw c-${CAT[k].c}"></i>${CAT[k].label} · ${es.length}</div><div class="exl">${es.map(e => exCard(e)).join('')}</div>`).join('')
        : `<div class="empty-note">${un.length ? 'Aucun exposant ne correspond au filtre.' : 'Tous les exposants sont placés.'}</div>`}</div>`;
    }
    if (tab === 'slot') {
      const st = App.stands();
      return head + `<div class="pb" style="padding-top:10px">
      <p class="hint">Posez des emplacements vides aux dimensions vendues ; vous les attribuerez plus tard. Un clic arme l'outil pour en poser plusieurs à la suite.</p>${orient}
      <div class="dims">${App.s.dims.map(d => {
        const n = st.filter(s => s.dimId === d.id).length, need = App.s.ex.filter(e => e.dimId === d.id).length, sc = 40 / 6;
        const w = d.w, h = d.h, armed = App.v.armed && !App.v.armed.exId && App.v.armed.dimId === d.id;
        return `<div class="dimc ${armed ? 'armed' : ''}" data-dim="${d.id}" tabindex="0" role="button"><div class="pv"><i style="width:${w * sc}px;height:${h * sc}px;transform:rotate(${App.v.newRot || 0}deg)"></i></div>
          <div><span class="dim">${dimLabel(d.id)}</span><small>${n} posé${n > 1 ? 's' : ''} · ${need} demandé${need > 1 ? 's' : ''}</small><div class="bar"><i style="width:${need ? Math.min(100, n / need * 100) : 100}%"></i></div></div>
          ${n < need ? `<span class="chip warn">−${need - n}</span>` : `<span class="chip ok">${ic('check')}</span>`}</div>`;
      }).join('')}</div></div>`;
    }
    return head + `<div class="pb" style="padding-top:10px">
    <p class="hint">Un élément bloquant passe en conflit dès qu'un stand le chevauche. Ce réglage se change objet par objet dans l'inspecteur, et par type dans Réglages.</p>
    <div class="els">${ELORDER.map(k => {
      const d = elDef(k), r = Math.min(56 / d.w, 30 / d.h), armed = App.v.armed && App.v.armed.type === k;
      return `<div class="elc ${armed ? 'armed' : ''}" data-el="${k}" tabindex="0" role="button"><svg class="pv" viewBox="0 0 64 34"><g class="it k-el el-${k}${d.block ? '' : ' soft'}" transform="translate(${32 - d.w * r / 2} ${17 - d.h * r / 2}) scale(${r})"><rect class="b" width="${d.w}" height="${d.h}" rx="${k === 'power' ? d.w / 2 : 0}"/>${elShape({ type: k, w: d.w, h: d.h })}</g></svg><b>${EL[k].label}</b><small>${EL[k].hint}</small><span class="bk ${d.block ? 'on' : ''}">${d.block ? 'Bloquant' : 'Non bloquant'}</span></div>`;
    }).join('')}</div></div>`;
  }

  /* tuile : n° en haut à gauche, pastille de statut en haut à droite, nom au centre ; mode technique : pictos à la place du nom */
  App.v.fullTurn = true;
  // orientation d'exemple : rangées tournées vers leur allée
  for (const it of App.s.plans[0].items) if (it.kind === 'stand') {
    if ((it.y === 4.5 && it.x >= 6) || it.y === 13) it.rot = 180;
    else if (it.x === 0 && (it.y === 4.5 || it.y === 6.5)) it.rot = 270;
  }
  /* boussole d'orientation dans l'inspecteur */
  const DIRS = [[135, '↖'], [180, '↑'], [225, '↗'], [90, '←'], null, [270, '→'], [45, '↙'], [0, '↓'], [315, '↘']];
  App.hooks.angleUI = it => {
    const r = angleOf(it);
    return `<div class="fld"><span>Orientation</span><div class="angbox"><div class="compass" role="group" aria-label="Orientation">${DIRS.map(d => d ? `<button class="${Math.abs(r - d[0]) < 0.05 ? 'on' : ''}" data-ang="${d[0]}" title="${d[0]}°">${d[1]}</button>` : `<span class="mid">${fmt(r)}°</span>`).join('')}</div>
    <div class="fld"><span>Angle précis</span><div class="angrow"><input type="number" step="1" data-f="rot" value="${r}" aria-label="Angle en degrés"><span class="muted">°</span></div><p class="hint">Angle de rotation de l'objet. Poignée au-dessus de l'objet, ou Q / E par ${App.s.cfg.rot}°.</p></div></div></div>`;
  };
  function statusBars() {
    const es = App.stands().filter(s => s.exId).map(s => App.ex(s.exId)), n = es.length || 1;
    return `<div class="stbars">${Object.entries(STATUS).map(([k, st]) => { const c = es.filter(e => e.status === k).length; return `<div class="st-${st.c}"><span><i class="stdot"></i>${st.label}</span><b>${c}</b><i class="bar"><b style="width:${c / n * 100}%"></b></i></div>`; }).join('')}</div>`;
  }
  function techTotals() {
    const es = App.stands(App.plan()).filter(s => s.exId).map(s => App.ex(s.exId));
    const sum = k => es.reduce((a, e) => a + (typeof e[k] === 'number' ? e[k] : e[k] ? 1 : 0), 0);
    return `<div class="grp">Logistique · ${esc(App.plan().name)}</div><div class="kv"><div><b>${sum('elec')}</b><small class="kt">${gi('bolt')}prises</small></div><div><b>${sum('chairs')}</b><small class="kt">${gi('chair')}chaises</small></div><div><b>${sum('tables')}</b><small class="kt">${gi('table')}tables</small></div></div>`;
  }
  function overviewHTML() {
    const all = App.stands(), filled = all.filter(s => s.exId).length, confl = allConflicts(), un = App.unplaced();
    const mis = all.filter(mismatch);
    return `<div class="ph"><h2>Vue d'ensemble</h2></div><div class="pb">
    <div class="kv"><div><b>${filled}<small style="font-size:14px">/${App.s.ex.length}</small></b><small>exposants placés</small></div>
      <div><b>${all.length - filled}</b><small>emplacements libres</small></div>
      <div class="${confl.length ? 'bad' : ''}"><b>${confl.length}</b><small>conflit${confl.length > 1 ? 's' : ''}</small></div></div>
    ${confl.length ? `<div class="grp">${ic('alert')}À corriger</div><ul class="clist">${confl.map(c => `<li><button data-goto="${(c.a.kind === 'stand' ? c.a : c.b || c.a).id}">${ic('alert')}<span>${esc(conflictText(c))}${App.s.plans.length > 1 ? ` <span class="muted">· ${esc(App.s.plans[c.pi].name)}</span>` : ''}</span></button></li>`).join('')}</ul>` : ''}
    ${mis.length ? `<div class="grp">Dimensions différentes</div><ul class="clist">${mis.map(s => `<li><button data-goto="${s.id}" style="border-color:var(--warn-soft)"><span>Stand ${s.num} · ${esc(App.ex(s.exId).name)}<br><span class="muted">${esc(mismatch(s))}</span></span></button></li>`).join('')}</ul>` : ''}
    <div class="grp">Catégories</div>${legendHTML()}
    <div class="grp">Statuts · stands placés</div>${statusBars()}
    ${techTotals()}
    <p class="hint">Sélectionnez un stand ou un élément sur le plan pour le modifier. ${un.length} exposant${un.length > 1 ? 's' : ''} reste${un.length > 1 ? 'nt' : ''} à placer.</p></div>`;
  }

  const svg = $('#plan'), vp = $('#vp');
  function placeCtx() {
    const box = $('#ctx'), id = App.v.sel, it = id && App.item(id), g = id && svg.querySelector(`[data-id="${id}"] .b`);
    if (!it || !g || App.v.turning || App.v.armed || pinch) { box.innerHTML = ''; return; }
    const sr = $('.stage').getBoundingClientRect(), r = g.getBoundingClientRect(), vr = vp.getBoundingClientRect();
    const top = r.top - sr.top - 56 - clamp(30 / App.v.ppm, 0.6, 1.6) * App.v.ppm;
    if (r.bottom < vr.top || r.top > vr.bottom) { box.innerHTML = ''; return; }
    const a = angleOf(it);
    box.innerHTML = `<div class="ctx" style="left:${clamp(r.left + r.width / 2 - sr.left, 170, sr.width - 170)}px;top:${Math.max(8, top)}px">
    <button class="btn icon" data-turn="-${App.s.cfg.rot}" title="−${App.s.cfg.rot}° (Q)" aria-label="Tourner de −${App.s.cfg.rot}°">${ic('undo')}</button>
    <input type="number" id="ctxa" value="${a}" step="1" aria-label="Angle en degrés"><span class="deg">°</span>
    <button class="btn icon" data-turn="${App.s.cfg.rot}" title="+${App.s.cfg.rot}° (E)" aria-label="Tourner de +${App.s.cfg.rot}°">${ic('redo')}</button>
    <button class="btn sm" data-turn="90" title="Quart de tour (R)">${ic('rotate')}90°</button>
    <span class="sep"></span>
    <button class="btn icon" data-a="dup" title="Prolonger (Ctrl+D)" aria-label="Dupliquer">${ic('copy')}</button>
    <button class="btn icon danger" data-a="del" title="Supprimer" aria-label="Supprimer">${ic('trash')}</button></div>`;
  }
  bindPlan(svg, vp, () => { planSVG(svg); $('#status').innerHTML = statusHTML(); placeCtx(); });
  vp.addEventListener('scroll', placeCtx);
  $('#ctx').addEventListener('click', e => { const t = e.target.closest('[data-turn]'); if (t && App.v.sel) Act.turn(App.v.sel, +t.dataset.turn); });
  $('#ctx').addEventListener('change', e => { if (e.target.id === 'ctxa' && App.v.sel) Act.setRot(App.v.sel, parseFloat(e.target.value.replace(',', '.')) || 0); });
  ICON.chev = '<path d="m6 15 6-6 6 6"/>';
  const app = $('.app'), mobile = () => matchMedia('(max-width:900px)').matches;
  function grabHTML(it) {
    const t = it.kind === 'el' ? (it.label || EL[it.type].label) : `Stand ${it.num ?? '–'}${it.exId ? ' · ' + App.ex(it.exId).name : it.pre ? ' · pré-réservé' : ' · libre'}`;
    const bad = (conflicts(App.plan()).map.get(it.id) || []).length;
    return `<div class="sheet-grab" data-sheet role="button" tabindex="0" aria-label="Afficher ou masquer le détail">${bad ? `<span class="chip bad">${ic('alert')}${bad}</span>` : ''}<b>${esc(t)}</b><span class="chev">${ic('chev')}</span><button class="btn icon ghost sm" data-a="desel" aria-label="Fermer le détail">${ic('close')}</button></div>`;
  }
  let lastSel = null;
  App.on(() => {
    $('#tabs').innerHTML = tabsHTML();
    $('#tools').innerHTML = toolsHTML(infoToggleHTML() + '<span class="sep"></span>');
    const st = pal.scrollTop; pal.innerHTML = palHTML(); pal.scrollTop = st;
    const it = App.v.sel && App.item(App.v.sel);
    const si = insp.scrollTop;
    insp.innerHTML = it ? grabHTML(it) + inspectorHTML(it) : overviewHTML();
    if (it && it.id === lastSel) insp.scrollTop = si;
    if (App.v.sel !== lastSel && mobile()) app.classList.remove('sheet-open');
    lastSel = App.v.sel;
    app.classList.toggle('has-sel', !!it);
    if (App.v.armed && mobile()) app.classList.remove('sheet-open');
    $('#armed').innerHTML = armedHTML();
  });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-a="desel"]')) { e.stopPropagation(); App.v.sel = null; App.emit(); return; }
    if (e.target.closest('[data-sheet]')) app.classList.toggle('sheet-open');
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[data-sheet]')) { e.preventDefault(); app.classList.toggle('sheet-open'); } });
  pal.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; if (mobile()) app.classList.add('sheet-open'); App.emit(); }
    const r = e.target.closest('[data-newrot]'); if (r) { App.v.newRot = +r.dataset.newrot; App.emit(); }
  });
  pal.addEventListener('input', e => { if (e.target.id === 'fq') { q = e.target.value; const pos = e.target.selectionStart; App.emit(); const f = $('#fq'); f.focus(); f.setSelectionRange(pos, pos); } });
  pal.addEventListener('pointerdown', e => {
    const x = e.target.closest('[data-ex]'), d = e.target.closest('[data-dim]'), l = e.target.closest('[data-el]');
    if (x) { const ex = App.ex(x.dataset.ex); pick(e, { kind: 'stand', dimId: ex.dimId, exId: ex.id }, exGhost(ex)); }
    else if (d) pick(e, { kind: 'stand', dimId: d.dataset.dim }, `Emplacement ${dimLabel(d.dataset.dim)}`);
    else if (l) pick(e, { kind: 'el', type: l.dataset.el }, EL[l.dataset.el].label);
  });
  pal.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const x = e.target.closest('[data-ex]'), d = e.target.closest('[data-dim]'), l = e.target.closest('[data-el]');
    if (x) { const ex = App.ex(x.dataset.ex); arm({ kind: 'stand', dimId: ex.dimId, exId: ex.id }, exGhost(ex)); }
    else if (d) arm({ kind: 'stand', dimId: d.dataset.dim }, `Emplacement ${dimLabel(d.dataset.dim)}`);
    else if (l) arm({ kind: 'el', type: l.dataset.el }, EL[l.dataset.el].label);
    else return; e.preventDefault();
  });
  App.emit(); fit();
</script>

<script>/* ====================================================================
   Mode « Annotations » de la maquette : pastilles numérotées posées sur chaque zone,
   avec un renvoi vers la section correspondante de floor-plan-copilot.md.
   Ce script ne sert qu'à la maquette ; il n'est pas à reproduire dans l'application.
   ==================================================================== */
(() => {
  const NOTES = [
    { n: 1, sel: '#tabs', t: 'Onglets des plans', d: 'Un onglet par plan, compteur rouge de conflits, « + » ouvre Réglages sur un nouveau plan.', s: '§2, §7' },
    { n: 2, sel: '#tools .seg', t: 'Exposant / Technique', d: 'Remplace displayTechnical. Touche T. Le bouton à côté bascule nom du stand / nom de la personne (displayFullname).', s: '§9.3' },
    { n: 3, sel: '#tools [data-a="snap"]', t: 'Calage et aimant', d: 'Calage au pas de déplacement (on/off) et aimant aux bords voisins.', s: '§4, §9.3' },
    { n: 4, sel: '#tools [data-a="cfg"]', t: 'Popin Réglages', d: 'Grille, pas de déplacement, pas de rotation, plans, éléments par défaut. Brouillon + Appliquer.', s: '§7' },
    { n: 5, sel: '.pal .ptabs', t: 'Palette', d: 'Exposants à placer, emplacements vides par dimension, éléments. Glisser ou toucher pour armer.', s: '§9.1, §8' },
    { n: 6, sel: '.pal .orient', t: 'Angle des prochains posés', d: 'Angle appliqué aux objets créés depuis la palette.', s: '§9.1' },
    { n: 7, sel: () => standHeader(), t: 'Bandeau du stand', d: 'N° à gauche ; à droite pastille de statut puis alertes (chevauchement, dimension, pré-réservé, partagé).', s: '§6.4' },
    { n: 8, sel: () => standBody(), t: 'Corps du stand', d: 'Nom (+ personne si place). En mode Technique : étiquettes ⚡ / chaises / tables.', s: '§6.4' },
    { n: 9, sel: '#plan .it.bad', t: 'Conflit', d: 'Bord et hachures rouges. On peut toujours poser : rien n’est déplacé automatiquement.', s: '§5' },
    { n: 10, sel: '#plan .it.warn', t: 'Dimension différente', d: 'Avertissement orange, pas un conflit.', s: '§5' },
    { n: 11, sel: '#plan .el-aisle', t: 'Éléments', d: 'Allée, entrée, sortie, escalier (marches seules), ascenseur, WC, borne… Non bloquant = pointillés.', s: '§6.5' },
    { n: 12, sel: '#plan .ruler', t: 'Grille et règles', d: 'Tout est en mètres. Grille au pas affiché, trait marqué tous les 5 m.', s: '§6.1, §6.2' },
    { n: 13, sel: '#insp', t: 'Inspecteur / Vue d’ensemble', d: 'Sans sélection : indicateurs, conflits cliquables, statuts, logistique. Avec sélection : fiche du stand ou de l’élément.', s: '§9.2' },
    { n: 14, sel: '#status', t: 'Barre d’état', d: 'Coordonnées, compteurs, conflit suivant, pastille grille / pas qui ouvre Réglages.', s: '§9.3' },
    { n: 15, sel: '#ctx .ctx', t: 'Barre flottante', d: 'Sur l’objet sélectionné : ∓ pas de rotation, angle, 90°, dupliquer, supprimer.', s: '§8' },
  ];
  const firstStand = () => document.querySelector('#plan .k-stand:not(.empty):not(.bad):not(.warn)');
  function standHeader() { const g = firstStand(); return g && (g.querySelector('.hb') || g); }
  function standBody() { const g = firstStand(); return g && g.querySelector('.t-name, .tchip'); }

  const css = document.createElement('style');
  css.textContent = `
  .an-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .an-layer{position:fixed;inset:0;pointer-events:none;z-index:40}
  .an-box{position:fixed;border:1.5px dashed var(--accent);border-radius:6px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
  .an-pin{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px/22px var(--f-ui);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
  .an-pin.on{outline:3px solid var(--accent-soft)}
  .an-legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:41;width:min(360px,calc(100% - 32px));max-height:min(60vh,520px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);pointer-events:auto}
  .an-legend header{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px;position:sticky;top:0;background:var(--surface)}
  .an-legend header b{flex:1;font-family:var(--f-sign);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .an-legend ol{list-style:none;margin:0;padding:0 8px 10px}
  .an-legend li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
  .an-legend li:hover,.an-legend li.on{background:var(--surface-2)}
  .an-legend li i{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 12px/22px var(--f-ui);text-align:center;font-style:normal}
  .an-legend li.off i{background:var(--grid-strong)}
  .an-legend li b{font-weight:500;font-size:13px}
  .an-legend li small{display:block;font-size:12px;color:var(--muted)}
  .an-legend li em{font-style:normal;color:var(--accent);font-size:11.5px;margin-left:4px}
  @media (max-width:900px){.an-legend{bottom:calc(var(--peek) + 10px);max-height:40vh}}`;
  document.head.appendChild(css);

  let on = true, active = null;
  const layer = document.createElement('div'); layer.className = 'an-layer'; layer.setAttribute('aria-hidden', 'true');
  const legend = document.createElement('aside'); legend.className = 'an-legend'; legend.setAttribute('aria-label', 'Annotations');
  document.body.append(layer, legend);
  const btn = document.createElement('button');
  btn.className = 'btn sm an-btn on'; btn.type = 'button'; btn.textContent = 'Annotations';
  btn.title = 'Afficher ou masquer les repères numérotés (renvois vers floor-plan-copilot.md)';
  document.querySelector('.brand').after(btn);

  const find = n => typeof n.sel === 'function' ? n.sel() : document.querySelector(n.sel);
  function draw() {
    btn.classList.toggle('on', on);
    layer.hidden = legend.hidden = !on;
    if (!on) return;
    let h = '';
    const vis = new Set();
    for (const n of NOTES) {
      const el = find(n); if (!el) continue;
      const r = el.getBoundingClientRect();
      if (!r.width || r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) continue;
      vis.add(n.n);
      if (active === n.n) h += `<div class="an-box" style="left:${r.left - 3}px;top:${r.top - 3}px;width:${r.width + 6}px;height:${r.height + 6}px"></div>`;
      const x = Math.min(Math.max(r.left + 2, 12), innerWidth - 12), y = Math.min(Math.max(r.top + 2, 12), innerHeight - 12);
      h += `<span class="an-pin ${active === n.n ? 'on' : ''}" data-n="${n.n}" style="left:${x}px;top:${y}px" title="${n.t}">${n.n}</span>`;
    }
    layer.innerHTML = h;
    legend.innerHTML = `<header><b>Annotations</b><button class="btn icon ghost sm" data-hide aria-label="Masquer les annotations">${ic('close')}</button></header>
      <ol>${NOTES.map(n => `<li class="${active === n.n ? 'on' : ''} ${vis.has(n.n) ? '' : 'off'}" data-n="${n.n}"><i>${n.n}</i><span><b>${n.t}</b><em>${n.s}</em><small>${n.d}${vis.has(n.n) ? '' : ' (visible après une action : sélection, mode Technique…)'}</small></span></li>`).join('')}</ol>`;
  }
  const pick = n => { active = active === n ? null : n; draw(); };
  layer.addEventListener('click', e => { const p = e.target.closest('[data-n]'); if (p) pick(+p.dataset.n); });
  legend.addEventListener('click', e => {
    if (e.target.closest('[data-hide]')) { on = false; draw(); return; }
    const li = e.target.closest('[data-n]'); if (li) pick(+li.dataset.n);
  });
  btn.addEventListener('click', () => { on = !on; draw(); });
