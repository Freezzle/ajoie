    <div class="kpi"><small>Heures de programme</small><b>${hrs.toLocaleString('fr-CH', { maximumFractionDigits: 1 })} h</b></div></div></div>`;
  }

  /* ---- bac « À planifier » ---- */
  function trayHTML({ horizontal = false } = {}) {
    const un = App.s.talks.filter(t => !isPlaced(t));
    const list = un.filter(t => (V.filter === 'ALL' || t.type === V.filter) && (!V.q || (t.title + ' ' + t.therapist).toLowerCase().includes(V.q)));
    const c = ty => un.filter(t => t.type === ty).length;
    const cards = list.length ? list.map(t => { const ty = TYPE[t.type];
        return `<button class="qcard ${ty.cls} ${App.armed === keyOf(t) ? 'on' : ''}" data-drag="${keyOf(t)}" data-card="${keyOf(t)}" ${horizontal ? `style="width:${Math.max(170, t.total * 2.4)}px"` : ''}>
      <span class="t">${esc(t.title)}</span><span class="w">${esc(t.therapist)} · ${ty.label.toLowerCase()} ${t.talkMin} min${t.status === 'PENDING' ? ' · <span style="color:var(--over)">à confirmer</span>' : ''}</span></button>`; }).join('')
      : `<p class="note" style="margin:6px 2px">${un.length ? 'Aucun résultat pour ce filtre.' : 'Toutes les interventions sont placées.'}</p>`;
    return `<div class="tray-head"><div class="tray-title"><h2>À planifier</h2><span class="note">${un.length} sur ${App.s.talks.length}</span></div>
      <div class="seg" id="filters">${[['ALL', 'Toutes', un.length], ['CONFERENCE', 'Conférences', c('CONFERENCE')], ['WORKSHOP', 'Ateliers', c('WORKSHOP')]].map(([v, l, n]) => `<button data-f="${v}" class="${V.filter === v ? 'on' : ''}">${l}<b>${n}</b></button>`).join('')}</div>
      <label class="search">${pi('search')}<input id="q" type="search" value="${esc(V.q)}" placeholder="Titre ou intervenant·e" aria-label="Rechercher"></label></div>
    <div class="tray-list">${cards}</div>
    <p class="note tray-hint">${App.editing ? 'Glissez une carte sur le planning, ou cliquez-la puis cliquez un emplacement. Redéposez un bloc ici pour le retirer.' : 'Passez en mode édition pour placer les interventions.'}</p>`;
  }

  /* ---- blocs ---- */
  function blockV(t, a, ppm) {
    const ty = TYPE[t.type], iss = issuesOf(t), h = t.talkMin * ppm;
    return `<article class="tk ${ty.cls}${iss.length ? ' bad' : ''}${focusCls(t)}" data-drag="${keyOf(t)}" data-open="${keyOf(t)}" tabindex="0" style="left:5px;right:5px;top:${(occA(t, t.start) - a) * ppm}px;height:${t.total * ppm}px;display:grid;grid-template-rows:${t.prep * ppm}px ${h}px 1fr" aria-label="${esc(t.title)}, ${hhmm(t.start)}">
    <div class="bf pre" title="Préparation ${t.prep} min">${t.prep * ppm >= 14 ? '<span>Préparation</span>' : ''}</div><div class="in"><span class="tm">${hhmm(t.start)} – ${hhmm(t.start + t.talkMin)}</span><span class="ti" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(t.title)}</span><span class="wh">${avatar(t.therapist, 'sm')}${esc(t.therapist)}</span></div>
    <div class="bf post" title="Rangement ${t.clean} min">${t.clean * ppm >= 14 ? '<span>Rangement</span>' : ''}</div>${iss.length ? `<span class="flag" title="${esc(iss.join(' · '))}">${pi('exclamation-triangle')}</span>` : ''}</article>`;
  }
  function blockH(t, a, ppm, { roomTag = false, top = 6, bottom = 6, draggable = true } = {}) {
    const ty = TYPE[t.type], iss = issuesOf(t);
    return `<article class="tk ${ty.cls}${iss.length ? ' bad' : ''}${focusCls(t)}" ${draggable ? `data-drag="${keyOf(t)}"` : ''} data-open="${keyOf(t)}" tabindex="0" style="left:${(occA(t, t.start) - a) * ppm}px;width:${t.total * ppm}px;top:${top}px;bottom:${bottom}px;display:flex" aria-label="${esc(t.title)}, ${hhmm(t.start)}">
    ${t.prep ? `<div class="bf" style="width:${t.prep * ppm}px;flex:none"></div>` : ''}<div class="in" style="width:${t.talkMin * ppm}px;flex:none;align-content:center"><span class="tm">${hhmm(t.start)}<span class="te"> – ${hhmm(t.start + t.talkMin)}</span></span><span class="ti" style="white-space:nowrap;text-overflow:ellipsis" title="${esc(t.title)}">${esc(roomTag ? (App.room(t.roomId)?.label || '') : t.title)}</span>${roomTag ? '' : `<span class="wh">${avatar(t.therapist, 'sm')}${esc(t.therapist)}</span>`}</div>
    <div class="bf" style="flex:1"></div>${iss.length ? `<span class="flag" title="${esc(iss.join(' · '))}">${pi('exclamation-triangle')}</span>` : ''}</article>`;
  }

  /* ---- grille verticale d'un jour (salles en colonnes) ---- */
  function gridHTML(day, { slotSel = null, rooms = App.s.rooms, colMin = 170, timeW = 56, hl = null } = {}) {
    const ppm = V.ppmV, iv = App.s.interval, [a, b] = bounds(day.rooms), H = (b - a) * ppm;
    let lbls = '';
    for (let m = a; m <= b; m += iv) lbls += `<span class="lbl ${m % 60 ? '' : 'h'}" style="top:${(m - a) * ppm}px">${hhmm(m)}</span>`;
    const cols = rooms.map(room => {
      const dr = day.rooms.find(r => r.roomId === room.id), ts = placedIn(day.id, room.id);
      let closed = '';
      if (!dr) closed = `<div class="closed" style="left:0;right:0;top:0;height:${H}px"><span>Fermée ce jour</span></div>`;
      else {
        if (dr.start > a) closed += `<div class="closed" style="left:0;right:0;top:0;height:${(dr.start - a) * ppm}px"></div>`;
        if (dr.end < b) closed += `<div class="closed" style="left:0;right:0;top:${(dr.end - a) * ppm}px;height:${(b - dr.end) * ppm}px"></div>`;
      }
      let okz = '';
      if (hl && dr) { const fs = freeStarts(hl, day.id, room.id); let i = 0;
        while (i < fs.length) { let j = i; while (j + 1 < fs.length && fs[j + 1] === fs[j] + iv) j++;
          okz += `<div class="okz" style="top:${(fs[i] - a) * ppm}px;height:${(fs[j] - fs[i] + iv) * ppm}px"><span>${fs[i] === fs[j] ? 'à ' + hhmm(fs[i]) : hhmm(fs[i]) + ' – ' + hhmm(fs[j])}</span></div>`; i = j + 1; } }
      const sel = slotSel && slotSel.dayId === day.id && slotSel.roomId === room.id ? `<div class="slotsel" style="top:${(slotSel.start - a) * ppm}px;height:${Math.max(iv, 60) * ppm}px"><span>${hhmm(slotSel.start)}</span></div>` : '';
      const used = ts.reduce((n, t) => n + t.total, 0), cap = dr ? dr.end - dr.start : 0;
      return `<div class="gcol"><div class="ghead"><b title="${esc(room.label)}">${esc(room.label)}</b><small>${dr ? `${hhmm(dr.start)}–${hhmm(dr.end)}` : 'Fermée ce jour'}</small></div>
      <div class="lane" data-drop="lane" data-axis="v" data-ppm="${ppm}" data-day="${day.id}" data-room="${room.id}" data-a="${a}" style="height:${H}px;background-size:100% ${60 * ppm}px,100% ${iv * ppm}px">${closed}${okz}${sel}${ts.map(t => blockV(t, a, ppm)).join('')}</div></div>`;
    }).join('');
    return `<div class="ggrid" style="grid-template-columns:${timeW}px repeat(${rooms.length},minmax(${colMin}px,1fr))"><div class="gtime"><div class="ghead"></div><div class="lbls" style="height:${H}px">${lbls}</div></div>${cols}</div>`;
  }

  /* ---- frise horizontale (salles en lignes) ---- */
  function friseAxisHTML(a, b, W, label = 'Salles') {
    const ppm = V.ppmH, iv = App.s.interval;
    let ticks = '';
    for (let m = a; m <= b; m += iv) if (m % 60 === 0 || ppm * iv >= 50) ticks += `<span class="${m % 60 ? '' : 'h'}" style="left:${(m - a) * ppm}px">${hhmm(m)}</span>`;
    return `<div class="faxis"><div class="fcorner">${label}</div><div class="fticks" style="width:${W}px">${ticks}</div></div>`;
  }
  function friseRoomsHTML(day, a, b, W) {
    const ppm = V.ppmH, bg = `background-size:${60 * ppm}px 100%,${App.s.interval * ppm}px 100%`;
    return App.s.rooms.map(room => {
      const dr = day.rooms.find(r => r.roomId === room.id), ts = placedIn(day.id, room.id);
      const used = ts.reduce((n, t) => n + t.total, 0), cap = dr ? dr.end - dr.start : 0;
      let closed = '';
      if (!dr) closed = `<div class="closed" style="top:0;bottom:0;left:0;width:${W}px"><span style="padding:22px 10px">Fermée ce jour</span></div>`;
      else {
        if (dr.start > a) closed += `<div class="closed" style="top:0;bottom:0;left:0;width:${(dr.start - a) * ppm}px"></div>`;
        if (dr.end < b) closed += `<div class="closed" style="top:0;bottom:0;left:${(dr.end - a) * ppm}px;width:${(b - dr.end) * ppm}px"></div>`;
      }
      return `<div class="frow"><div class="flabel"><b title="${esc(room.label)}">${esc(room.label)}</b><small>${dr ? `${hhmm(dr.start)}–${hhmm(dr.end)} · ${Math.round(used / cap * 100)} % occupé` : 'Fermée'}</small><span class="occ"><i style="width:${cap ? Math.min(100, used / cap * 100) : 0}%"></i></span></div>
      <div class="lane h" data-drop="lane" data-axis="h" data-ppm="${ppm}" data-day="${day.id}" data-room="${room.id}" data-a="${a}" style="width:${W}px;${bg}">${closed}${ts.map(t => blockH(t, a, ppm)).join('')}</div></div>`;
    }).join('');
  }

  /* ---- calcul de position + glisser + clic sur un emplacement ---- */
  function minuteAt(lane, x, y) {
    const r = lane.getBoundingClientRect(), ppm = +lane.dataset.ppm;
    const off = lane.dataset.axis === 'v' ? (y - r.top) : (x - r.left);
    return snap(+lane.dataset.a + off / ppm, lane.dataset.day, lane.dataset.room);
  }
  function bindPlanningInteractions({ scroller, tray, onSlotClick }) {
    let pv = null;
    const posOf = (lane, i, t) => { const pp = t.prep * +lane.dataset.ppm; return lane.dataset.axis === 'v' ? minuteAt(lane, 0, i.top + pp) : minuteAt(lane, i.left + pp, 0); };
    makeDraggable({
      scroller,
      over(key, target, i) {
        pv && pv.remove(); pv = null; $$('.drop-hot').forEach(e => e.classList.remove('drop-hot'));
        if (!key || !target) return;
        if (target.dataset.drop === 'tray') { target.classList.add('drop-hot'); return; }
        const t = App.talk(key), m = posOf(target, i, t), c = check(t, target.dataset.day, target.dataset.room, m), ppm = +target.dataset.ppm, a = +target.dataset.a;
        pv = document.createElement('div'); pv.className = 'preview' + (c.ok ? '' : ' bad');
        previewBox(pv, target, t, m, a, ppm);
        pv.innerHTML = `${hhmm(m)} – ${hhmm(m + t.talkMin)}<small>${esc(c.ok ? 'Créneau libre' : c.reasons[0])}</small>`;
        target.append(pv);
      },
      drop(key, target, i) {
        if (target.dataset.drop === 'tray') { if (isPlaced(App.talk(key))) unplace(key); return; }
        App.armed = null; place(key, target.dataset.day, target.dataset.room, posOf(target, i, App.talk(key)));
      }
    });
    document.addEventListener('click', e => {
      if (e.target.closest('[data-act]')) return;
      const f = e.target.closest('[data-f]'); if (f) { V.filter = f.dataset.f; App.emit(); return; }
      const card = e.target.closest('[data-card]');
      if (card) { App.editing ? arm(card.dataset.card) : openTalk(card.dataset.card); return; }
      const o = e.target.closest('[data-open]');
      if (o) { if (App.armed && App.armed !== o.dataset.open) { /* clic sur un bloc en mode placement : on place au même endroit */ } else { openTalk(o.dataset.open); return; } }
      const lane = e.target.closest('.lane[data-day]');
      if (lane && App.editing) {
        const start = slotStartAt(lane, e.clientX, e.clientY);
        if (App.armed) { const k = App.armed; App.armed = null; place(k, lane.dataset.day, lane.dataset.room, start); }
        else if (onSlotClick) onSlotClick(lane.dataset.day, lane.dataset.room, start);
      }
    });
    document.addEventListener('input', e => { if (e.target.id === 'q') { V.q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; App.emit(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } } });
    document.addEventListener('keydown', e => { const o = e.target.closest && e.target.closest('[data-open]'); if (o && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openTalk(o.dataset.open); } });
  }

  /* ---- case sous le pointeur (même calcul pour le clic et l'aperçu) ---- */
  function slotStartAt(lane, x, y) {
    const ppm = +lane.dataset.ppm, r = lane.getBoundingClientRect(), a = +lane.dataset.a;
    const raw = lane.dataset.axis === 'v' ? a + (y - r.top) / ppm : a + (x - r.left) / ppm;
    const iv = App.s.step, dr = App.dayRoom(lane.dataset.day, lane.dataset.room), base = dr ? dr.start : a;
    return base + Math.floor((raw - base) / iv) * iv;
  }
  /* ---- intervention « en main » : aperçu au survol, comme pendant un glisser-déposer ---- */
  const Hover = { pv: null, gh: null, key: '' };
  function hoverClear() { Hover.pv && Hover.pv.remove(); Hover.pv = null; Hover.key = ''; }
  function ghostHide() { if (Hover.gh) Hover.gh.hidden = true; }
  function ghostAt(t, x, y) {
    if (!Hover.gh) { Hover.gh = document.createElement('div'); Hover.gh.className = 'arm-ghost'; document.body.append(Hover.gh); }
    const ty = TYPE[t.type];
    if (Hover.gh.dataset.k !== keyOf(t)) { Hover.gh.dataset.k = keyOf(t); Hover.gh.className = 'arm-ghost ' + ty.cls;
      Hover.gh.innerHTML = `<b>${esc(t.title)}</b><small>${esc(t.therapist)} · ${durLabel(t)}</small><small class="k">Clic pour placer · Échap pour annuler</small>`; }
    Hover.gh.hidden = false;
    const w = Hover.gh.offsetWidth, h = Hover.gh.offsetHeight;
    Hover.gh.style.transform = `translate(${Math.min(x + 16, innerWidth - w - 8)}px,${Math.min(y + 16, innerHeight - h - 8)}px)`;
  }
  function hoverPreview(lane, t, start) {
    const k = lane.dataset.day + '|' + lane.dataset.room + '|' + start;
    if (Hover.pv && Hover.pv.isConnected && Hover.key === k) return;
    hoverClear();
    const c = check(t, lane.dataset.day, lane.dataset.room, start), ppm = +lane.dataset.ppm, a = +lane.dataset.a;
    const pv = document.createElement('div'); pv.className = 'preview' + (c.ok ? '' : ' bad');
    previewBox(pv, lane, t, start, a, ppm);
    pv.innerHTML = `${hhmm(start)} – ${hhmm(start + t.talkMin)}<small>${esc(c.ok ? 'Libre · cliquez pour placer' : c.reasons[0])}</small>`;
    lane.append(pv); Hover.pv = pv; Hover.key = k;
  }
  document.addEventListener('pointermove', e => {
    if (e.buttons || e.pointerType === 'touch') return;
    const t = App.editing && App.armed && App.talk(App.armed);
    if (!t) { hoverClear(); ghostHide(); return; }
    ghostAt(t, e.clientX, e.clientY);
    const hit = document.elementFromPoint(e.clientX, e.clientY), lane = hit && hit.closest('.lane[data-day]');
    if (!lane) { hoverClear(); return; }
    hoverPreview(lane, t, slotStartAt(lane, e.clientX, e.clientY));
  });
  document.addEventListener('pointerleave', () => { hoverClear(); ghostHide(); });
  document.documentElement.addEventListener('mouseleave', () => { hoverClear(); ghostHide(); });
  App.on(() => { if (!App.armed || !App.editing) { hoverClear(); ghostHide(); } else Hover.key = ''; });

  /* ---- cadre d'aperçu : préparation + intervention + rangement ---- */
  function previewBox(pv, lane, t, m, a, ppm) {
    if (lane.dataset.axis === 'v') {
      Object.assign(pv.style, { left: '5px', right: '5px', top: (occA(t, m) - a) * ppm + 'px', height: t.total * ppm + 'px', paddingTop: t.prep * ppm + 4 + 'px' });
      pv.style.setProperty('--pre', t.prep * ppm + 'px'); pv.style.setProperty('--post', t.clean * ppm + 'px');
      pv.classList.add('v');
    } else Object.assign(pv.style, { top: '4px', bottom: '4px', left: (occA(t, m) - a) * ppm + 'px', width: t.total * ppm + 'px' });
  }

  /* ============ Desktop / Mobile : aperçu forcé + vrai téléphone ============ */
  const R = { forced: 'desktop' };
  const mq = matchMedia('(max-width:760px)');
  const isMobile = () => mq.matches || R.forced === 'mobile';
  const Z = { d: 2.2, m: 1.8 };
  function applyDevice() {
    const m = isMobile(), phone = !mq.matches && R.forced === 'mobile';
    document.documentElement.classList.toggle('m', m);
    document.documentElement.classList.toggle('real-m', mq.matches);
    $('#frame').className = phone ? 'phone' : '';
    $('#stage').className = phone ? 'phone-stage' : '';
    $$('#devSeg button').forEach(b => b.classList.toggle('on', b.dataset.dev === (phone ? 'mobile' : 'desktop')));
    V.ppmH = Z[m ? 'm' : 'd'];
  }
  mq.addEventListener('change', () => { applyDevice(); App.emit(); });

  /* tiroir bas */
  let bs = null;
  const BS = { tray: () => `<div class="tray">${trayHTML()}</div>` };
  function openBS(kind, data) { bs = { kind, data }; renderBS(); }
  function closeBS() { bs = null; renderBS(); }
  function renderBS() {
    let h = $('#bsHost'); if (!h) { h = document.createElement('div'); h.id = 'bsHost'; HOST().append(h); }
    if (!bs || !isMobile()) { h.innerHTML = ''; return; }
    const sc = h.querySelector('.bsheet')?.scrollTop || 0;
    h.innerHTML = `<div class="scrim" data-bs-close></div><div class="bsheet" role="dialog" aria-modal="true"><div class="grab"></div>${BS[bs.kind](bs.data)}</div>`;
    h.querySelector('.bsheet').scrollTop = sc;
  }
  function mbarHTML() {
    if (!isMobile()) return '';
    const un = App.s.talks.filter(t => !isPlaced(t)).length;
    return `<div class="mbar"><button class="btn" data-bs="tray">${pi('inbox')}<span>À planifier</span><b>${un}</b></button>
    ${App.editing ? `<button class="btn primary" data-act="save">${pi('save')}<span>Enregistrer</span></button>` : `<button class="btn primary" data-act="edit">${pi('pencil')}<span>Modifier</span></button>`}</div>`;
  }
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-dev]'); if (d) { R.forced = d.dataset.dev; applyDevice(); App.emit(); return; }
    const b = e.target.closest('[data-bs]'); if (b) { openBS(b.dataset.bs); return; }
    if (e.target.closest('[data-bs-close]')) closeBS();
  });
  App.on(() => { if (bs && bs.kind === 'tray' && App.armed) bs = null; renderBS(); });

  /* ============ Créneau choisi : qu'est-ce qui peut commencer ici ? ============ */
  let slot = null; // { dayId, roomId, start }
  function slotLists(s) {
    const here = App.s.talks.filter(t => isPlaced(t) && t.dayId === s.dayId && t.roomId === s.roomId && occA(t, t.start) <= s.start && s.start < occB(t, t.start));
    const free = [], move = [], off = [];
    for (const t of App.s.talks) {
      if (here.includes(t)) continue;
      const c = check(t, s.dayId, s.roomId, s.start);
      if (!c.ok) off.push([t, c.reasons[0]]); else (isPlaced(t) ? move : free).push(t);
    }
    return { here, free, move, off };
  }
  function slotHTML(s, { showOff = true } = {}) {
    const { here, free, move, off } = slotLists(s), room = App.room(s.roomId), day = App.day(s.dayId);
    const row = (t, sub, act, cls = '') => `<div class="prow ${cls}">${avatar(t.therapist)}<span><span class="t">${esc(t.title)}</span><span class="s">${sub}</span></span>${act}</div>`;
    const sec = (title, list, body) => list.length ? `<div class="psec"><h3><span>${title}</span><b>${list.length}</b></h3>${body}</div>` : '';
    const loc = t => `${esc(App.day(t.dayId).label.split(' ')[0])} ${hhmm(t.start)} · ${esc(App.room(t.roomId).label)}`;
    const nothing = !free.length && !move.length;
    return `<div class="ph"><span class="eyebrow">${esc(day.label)}</span><h2>${esc(room.label)} · ${hhmm(s.start)}</h2><p>Ce qui peut commencer ici à ${hhmm(s.start)}</p>
      <button class="btn icon ghost x" data-close-slot aria-label="Fermer">${pi('times')}</button></div>
    ${sec('Déjà sur ce créneau', here, here.map(t => row(t, `${esc(t.therapist)} · ${hhmm(t.start)}–${hhmm(t.start + t.talkMin)}`, `<button class="btn" data-act="unplace" data-key="${keyOf(t)}">Retirer</button>`)).join(''))}
    ${sec('À planifier', free, free.map(t => row(t, `${esc(t.therapist)} · ${TYPE[t.type].label.toLowerCase()} ${t.talkMin} min`, `<button class="btn primary" data-put="${keyOf(t)}">Placer</button>`)).join(''))}
    ${sec('Déjà placées ailleurs', move, move.map(t => row(t, loc(t), `<button class="btn" data-put="${keyOf(t)}">Déplacer ici</button>`)).join(''))}
    ${nothing ? `<p class="note" style="padding:10px 12px;margin:0">Aucune intervention ne tient à ${hhmm(s.start)} dans cette salle.</p>` : ''}
    ${showOff && off.length ? `<details class="psec offs"><summary>Ne tiennent pas ici <b>${off.length}</b></summary>${off.map(([t, r]) => row(t, esc(r), '', 'off')).join('')}</details>` : ''}`;
  }
  function putFromSlot(k) {
    const s = slot, t = App.talk(k); slot = null;
    if (typeof closeBS === 'function') closeBS();
    if (place(k, s.dayId, s.roomId, s.start)) toast(`« ${t.title} » placée à ${hhmm(s.start)}`, { label: 'Annuler', fn: () => App.undo() });
  }
  document.addEventListener('click', e => {
    const p = e.target.closest('[data-put]'); if (p) { putFromSlot(p.dataset.put); return; }
    if (e.target.closest('[data-close-slot]')) { slot = null; if (typeof closeBS === 'function') closeBS(); App.emit(); }
  });
  BS.slot = () => slot ? slotHTML(slot) : '';

  /* ============ Base commune : desktop = grille + panneau à droite, mobile = une salle à la fois ============ */
  let mRoom = null;
  const MIX = { panel: () => '', hl: () => null, roomInfo: null, onMobileSlot: null, mobileBody: null, after: null };

  function roomTabsHTML(day) {
    const hl = MIX.hl();
    return `<div class="roomtabs">${App.s.rooms.map(r => {
      const dr = day.rooms.find(x => x.roomId === r.id);
      let info = !dr ? 'fermée' : MIX.roomInfo ? MIX.roomInfo(day, r) : hl ? `${freeStarts(hl, day.id, r.id).length ? 'libre' : 'complet'}` : placedIn(day.id, r.id).length;
      return `<button data-room-tab="${r.id}" class="${r.id === mRoom ? 'on' : ''} ${hl && dr && freeStarts(hl, day.id, r.id).length ? 'fits' : ''}">${esc(r.label)}<small>${info}</small></button>`; }).join('')}</div>`;
  }
  function renderMix() {
    const m = isMobile(), day = ensureDay();
    $('#modeLbl').textContent = App.editing ? 'Édition' : 'Lecture';
    document.body.classList.toggle('armed-mode', !!App.armed);
    if (!App.editing || (slot && !App.dayRoom(slot.dayId, slot.roomId))) slot = null;
    if (!App.room(mRoom)) mRoom = App.s.rooms[0]?.id;
    $('#daybar').innerHTML = daybarHTML();
    $('#banners').innerHTML = armBanner() + focusBanner();
    if (!m) { const pt = $('#panel').scrollTop; $('#panel').innerHTML = MIX.panel(day); $('#panel').scrollTop = pt; }
    $('#roomtabs').innerHTML = m && day ? roomTabsHTML(day) : '';
    const hl = App.editing ? MIX.hl() : null;
    const old = $('#scroller'), key = V.curDay + (m ? mRoom : 'd'), keep = old && old.dataset.v === key ? [old.scrollTop, old.scrollLeft] : null;
    $('#body').innerHTML = !day ? emptyState() : m && MIX.mobileBody ? MIX.mobileBody(day, key, hl) : m
      ? `<div class="gscroll single" id="scroller" data-v="${key}">${gridHTML(day, { rooms: App.s.rooms.filter(r => r.id === mRoom), colMin: 0, timeW: 46, slotSel: slot, hl })}</div>`
      : `<div class="gscroll" id="scroller" data-v="${key}">${gridHTML(day, { slotSel: slot, hl })}</div>`;
    const sc = $('#scroller'); if (sc && keep) { sc.scrollTop = keep[0]; sc.scrollLeft = keep[1]; }
    if (m && slot) { if (!bs || bs.kind !== 'slot') openBS('slot'); } else if (bs && bs.kind === 'slot') closeBS();
    $('#mbar').innerHTML = mbarHTML();
    if (MIX.after) MIX.after(m, day);
  }
  const trayPanel = () => `<div class="tray">${trayHTML()}</div>`;
  const hintBox = txt => App.editing ? `<div class="hintbox">${pi('info-circle')}<span>${txt}</span></div>` : '';

  document.addEventListener('click', e => {
    const d = e.target.closest('.days [data-day]'); if (d) { V.curDay = d.dataset.day; slot = null; App.emit(); return; }
    const r = e.target.closest('[data-room-tab]'); if (r) { mRoom = r.dataset.roomTab; App.emit(); return; }
    if (e.target.closest('[data-bs-close]') && slot) { slot = null; App.emit(); }
  });
  function startMix() {
    bindPlanningInteractions({ scroller: () => $('#scroller'), onSlotClick(dayId, roomId, start) {
        if (isMobile() && MIX.onMobileSlot) return MIX.onMobileSlot(dayId, roomId, start);
        slot = { dayId, roomId, start }; App.emit(); } });
    App.on(renderMix);
    applyDevice(); renderActions(); renderMix();
  }

  /* ============ Version allégée : sans badges, barre des jours réduite à l'essentiel ============ */
  avatar = () => '';
  daybarHTML = () => {
    const s = App.s, un = s.talks.filter(t => !isPlaced(t)).length, all = dayStats();
    return `<div class="daybar lite"><div class="days dtabs">${s.days.map(d => { const st = dayStats(d.id);
      return `<button data-day="${d.id}" class="${d.id === V.curDay ? 'on' : ''}">${esc(d.label)}${st.bad ? `<i class="cdot" title="${st.bad} conflit${st.bad > 1 ? 's' : ''}"></i>` : ''}</button>`; }).join('')}</div>
    <div class="status">${un ? `<b>${un}</b> à planifier` : 'Tout est placé'}${all.bad ? ` · <button class="bad" data-conflicts><b>${all.bad}</b> conflit${all.bad > 1 ? 's' : ''}</button>` : ''}</div></div>`;
  };
  let showConflicts = false;
  function conflictsHTML() {
    const list = App.s.talks.filter(t => issuesOf(t).length);
    if (!showConflicts || !list.length) return '';
    return `<div class="clist">${list.map(t => `<button data-open="${keyOf(t)}"><b>${esc(t.title)}</b><span>${esc(App.day(t.dayId).label.split(' ')[0])} ${hhmm(t.start)} · ${esc(issuesOf(t)[0])}</span></button>`).join('')}</div>`;
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-conflicts]')) { showConflicts = !showConflicts; App.emit(); } });


  let pend = null, folded = false;
  const basePanel = () => slot ? slotHTML(slot) : trayPanel();
  MIX.onMobileSlot = (dayId, roomId, start) => { pend = { dayId, roomId, start }; openBS('tray'); };
  BS.tray = () => (pend ? `<div class="mpick">${pi('map-marker')}<span>Ce qui commence à <b>${hhmm(pend.start)}</b> en ${esc(App.room(pend.roomId).label)}</span></div>` : '') + `<div class="tray">${trayHTML()}</div>`;
  App.on(() => {
    if (pend && App.armed) { const k = App.armed, p = pend; App.armed = null; pend = null; place(k, p.dayId, p.roomId, p.start); }
    else if (pend && !bs) pend = null;
  });
  MIX.panel = day => {
    if (folded && !slot && !App.armed) { const un = App.s.talks.filter(t => !isPlaced(t)).length;
      return `<button class="unfold" data-fold title="Afficher le panneau">${pi('inbox')} À planifier <b>${un}</b></button>`; }
    return `<div class="fold"><button class="btn icon ghost" data-fold title="Replier le panneau" aria-label="Replier le panneau">${pi('angle-right')}</button></div>` + basePanel(day);
  };
  MIX.roomInfo = (day, r) => { const t = App.editing && App.armed && App.talk(App.armed); if (!t) return ''; const fs = freeStarts(t, day.id, r.id); return fs.length ? 'dès ' + hhmm(fs[0]) : 'complet'; };
  const baseMbar = mbarHTML;
  mbarHTML = () => { const t = isMobile() && App.editing && App.armed && App.talk(App.armed);
    return t ? `<div class="mbar armed"><div class="mc ${TYPE[t.type].cls}"><b>${esc(t.title)}</b><small>${durLabel(t)} · touchez la grille pour placer</small></div><button class="btn" data-act="disarm">${pi('times')}<span>Annuler</span></button></div>` : baseMbar(); };
  MIX.after = () => { $('.main').classList.toggle('folded', folded && !slot && !App.armed && !isMobile()); $('#banners').insertAdjacentHTML('afterbegin', conflictsHTML()); };
  document.addEventListener('click', e => { if (e.target.closest('[data-fold]')) { folded = !folded; App.emit(); } });
  App.on(() => {
    const day = App.day(V.curDay), t = App.armed && App.talk(App.armed);
    if (t && day && isMobile() && !freeStarts(t, day.id, mRoom).length) { const r = App.s.rooms.find(r => freeStarts(t, day.id, r.id).length); if (r) mRoom = r.id; }
  });
  document.documentElement.classList.add('v-l1');
  startMix();
</script>
