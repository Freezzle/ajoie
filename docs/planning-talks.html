      animation-duration: 1ms;
      -webkit-animation-iteration-count: 1;
      animation-iteration-count: 1;
      -webkit-transition-delay: 0s;
      transition-delay: 0s;
      -webkit-transition-duration: 0s;
      transition-duration: 0s;
    }
  }

  @-webkit-keyframes fa-spin {
    0% {
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100% {
      -webkit-transform: rotate(359deg);
      transform: rotate(359deg);
    }
  }

  @keyframes fa-spin {
    0% {
      -webkit-transform: rotate(0deg);
      transform: rotate(0deg);
    }
    100% {
      -webkit-transform: rotate(359deg);
      transform: rotate(359deg);
    }
  }

<style>
  /* Style aligné sur la maquette du planning des bénévoles : Inter, gris clair, accent bleu, cartes bordées.
     Conférences en violet, ateliers en turquoise ; statuts ok / à revoir comme les zones bénévoles. */
  :root{
    --bg:#f5f6f8;--surface:#fff;--muted:#f0f2f5;--border:#e1e4ea;--line:#eceef2;
    --text:#1c2230;--text2:#5d6676;--text3:#9aa1ad;
    --accent:#3b5bdb;--accent-weak:#e9eeff;
    --ok:#2b8a3e;--ok-bg:#e7f5ea;--under:#d6336c;--under-bg:#fdeaf0;--over:#d9480f;--over-bg:#fff1e6;
    --unav:#a3a8b1;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
    --conf:#6741d9;--conf-bg:#f3f0ff;--conf-bd:#d0bfff;
    --work:#0b7285;--work-bg:#e3fafc;--work-bd:#99e9f2;
    --hatch:rgba(28,34,48,.07);--av-l:52%;
    --radius:10px;
    --ink:var(--text);--muted-ink:var(--text2);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14171c;--surface:#1c2027;--muted:#232831;--border:#2f3540;--line:#262b34;
    --text:#e8ebf0;--text2:#a5adba;--text3:#6c7482;
    --accent:#7d97ff;--accent-weak:#252d48;
    --ok:#69db7c;--ok-bg:#1d3324;--under:#ff8fab;--under-bg:#3a1f29;--over:#ffa94d;--over-bg:#3a2a1a;
    --unav:#5c6370;--shadow:0 1px 2px rgba(0,0,0,.4);
    --conf:#b197fc;--conf-bg:#272040;--conf-bd:#4b3b85;
    --work:#66d9e8;--work-bg:#15303a;--work-bd:#1f5866;
    --hatch:rgba(232,235,240,.07);--av-l:42%;
    color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#14171c;--surface:#1c2027;--muted:#232831;--border:#2f3540;--line:#262b34;
    --text:#e8ebf0;--text2:#a5adba;--text3:#6c7482;
    --accent:#7d97ff;--accent-weak:#252d48;
    --ok:#69db7c;--ok-bg:#1d3324;--under:#ff8fab;--under-bg:#3a1f29;--over:#ffa94d;--over-bg:#3a2a1a;
    --unav:#5c6370;--shadow:0 1px 2px rgba(0,0,0,.4);
    --conf:#b197fc;--conf-bg:#272040;--conf-bd:#4b3b85;
    --work:#66d9e8;--work-bg:#15303a;--work-bd:#1f5866;
    --hatch:rgba(232,235,240,.07);--av-l:42%;
    color-scheme:dark}

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
  h1,h2,h3{margin:0;text-wrap:balance}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mono,.num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1440px;margin:0 auto}

  /* en-tête : titre à gauche, boutons à droite (app-content-page) */
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
  .bar-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .bar-title h1{font-size:18px;font-weight:700}
  .bar-title p{margin:0;color:var(--text2);font-size:12px}
  .tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;background:var(--accent-weak);padding:3px 8px;border-radius:999px;white-space:nowrap}
  .mode{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--text2);background:var(--surface)}
  .editing .mode{border-color:var(--over);color:var(--over);background:var(--over-bg)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-weight:500;white-space:nowrap;color:var(--text)}
  .btn .pi{font-size:13px;color:var(--text2)}
  .btn:hover:not(:disabled){border-color:var(--text3)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .btn.primary .pi{color:inherit}
  :root[data-theme="dark"] .btn.primary{color:#0f1424}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1424}}
  .btn.ghost{background:transparent}
  .btn.icon{padding:7px 10px}
  .m .btn.collapse span{display:none}
  .lnk{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px}

  .menu{position:relative}
  .menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow),0 8px 24px rgba(16,24,40,.12);padding:6px;min-width:250px;z-index:40;display:grid}
  .menu-pop button{text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px}
  .menu-pop button:hover{background:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .eyebrow{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}

  /* barre des jours + indicateurs (comme les bénévoles) */
  .daybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 12px;text-align:left}
  .days button small{display:block;color:var(--text3);font-size:11px}
  .days button.on{border-color:var(--accent);background:var(--accent-weak)}
  .days button .w{color:var(--under);font-weight:700}
  .kpis{display:flex;gap:8px;flex-wrap:wrap}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 12px;min-width:110px}
  .kpi small{display:block;color:var(--text3);font-size:11px}
  .kpi b{font-size:15px;font-variant-numeric:tabular-nums}
  .kpi.bad b{color:var(--under)} .kpi.good b{color:var(--ok)}

  .seg{display:inline-flex;background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:none;padding:6px 11px;border-radius:7px;color:var(--text2);font-weight:500;display:inline-flex;gap:7px;align-items:center}
  .seg button b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:var(--border);font-size:11px;color:var(--text)}
  .seg button.on,.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .seg button.on b,.seg button[aria-pressed="true"] b{background:var(--accent);color:#fff}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
  .pill.conf{background:var(--conf-bg);color:var(--conf)}
  .pill.work{background:var(--work-bg);color:var(--work)}
  .pill.st{background:var(--ok-bg);color:var(--ok)}
  .pill.st.PENDING{background:var(--over-bg);color:var(--over)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
  .dot.conf{background:var(--conf)} .dot.work{background:var(--work)}
  .av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:hsl(var(--h) 55% var(--av-l));color:#fff;font-size:10px;font-weight:700;flex:none;letter-spacing:.02em}
  .av.sm{width:18px;height:18px;font-size:8px}

  .field{display:grid;gap:4px;font-size:12px;color:var(--text2);font-weight:500}
  .field input,.field select,input.inp{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--text);min-width:0;width:100%}
  .hatch{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px)}

  /* bandeaux contextuels */
  .armbar,.focusbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 12px;border-radius:9px;margin-bottom:10px;font-size:13px}
  .armbar{background:var(--accent-weak);color:var(--text);border:1px solid var(--accent)}
  .armbar .pi{color:var(--accent)}
  .focusbar{background:var(--surface);border:1px solid var(--border)}
  .armed-mode .lane{cursor:copy}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;gap:12px;align-items:center;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100vw - 32px)}
  #toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;white-space:nowrap}

  /* panneau latéral de détail */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.32);z-index:60}
  .sheet{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);overflow:auto;
    padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:14px;align-content:start}
  .m .sheet{top:auto;left:0;width:100%;max-height:86%;border-left:0;border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px))}
  .sheet h2{font-size:18px;padding-right:36px}
  .sheet .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:13px;align-items:center}
  .sheet dt{color:var(--text3)} .sheet dd{margin:0}
  .sheet .desc{color:var(--text2);margin:0}
  .sheet .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .sheet-acts{display:flex;flex-wrap:wrap;gap:8px}
  .sheet-close{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}
  .who{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px 3px 3px;font-weight:500}
  .who small{color:var(--accent);font-size:11px}
  .issues{margin:0;padding:10px 12px 10px 30px;background:var(--under-bg);color:var(--under);border-radius:8px;font-size:13px;font-weight:500}
  .okbox{margin:0;padding:10px 12px;background:var(--ok-bg);color:var(--ok);border-radius:8px;font-size:13px;font-weight:500}
  .dur{display:flex;height:10px;border-radius:4px;overflow:hidden;border:1px solid var(--border)}
  .dur i{display:block}

  /* popin salles et horaires */
  .modal{position:fixed;z-index:70;inset:0;display:grid;place-items:center;padding:16px}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(16,24,40,.22);width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:18px;padding:20px}
  .modal-box header{display:flex;justify-content:space-between;gap:12px;align-items:start}
  .modal-box h2{font-size:17px}
  .modal-box h3{font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
  .modal-box footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--surface);padding-block:12px;margin-bottom:-12px;border-top:1px solid var(--line)}
  .cfg-rooms{display:grid;gap:8px}
  .cfg-rooms .r{display:flex;gap:8px;align-items:center}
  .cfg-day{border:1px solid var(--border);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
  .cfg-day .top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
  .cfg-table{width:100%;border-collapse:collapse;font-size:13px}
  .cfg-table td,.cfg-table th{padding:5px 6px;text-align:left;border-top:1px solid var(--line)}
  .cfg-table th{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .cfg-table input[type=time]{width:8.6em}
  .cfg-wrap{overflow-x:auto}
  pre.payload{margin:0;background:var(--muted);border-radius:10px;padding:14px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:55vh;white-space:pre}

  /* glisser */
  .drag-ghost{position:fixed;left:0;top:0;z-index:90;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(16,24,40,.25)}
  .editing [data-drag]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .is-dragging{opacity:.3}
  .drop-hot{outline:2px dashed var(--accent);outline-offset:-3px}

  .empty{display:grid;gap:10px;justify-items:start;padding:28px;border:1px dashed var(--border);border-radius:12px;color:var(--text2);background:var(--surface);margin:12px}
  .empty strong{color:var(--text);font-size:16px}
  .note{font-size:12px;color:var(--text3)}

  /* bloc d'intervention commun */
  .tk{position:absolute;border-radius:8px;overflow:hidden;border:1px solid var(--conf-bd);background:var(--conf-bg);cursor:pointer;z-index:1;color:var(--text)}
  .tk.work{border-color:var(--work-bd);background:var(--work-bg)}
  .tk:hover{box-shadow:var(--shadow),0 4px 12px rgba(16,24,40,.12);z-index:2}
  .tk .in{border-left:4px solid var(--conf);padding:5px 8px;display:grid;align-content:start;gap:1px;overflow:hidden;min-width:0}
  .tk.work .in{border-left-color:var(--work)}
  .tk .tm{font-size:11px;font-weight:600;color:var(--conf);font-variant-numeric:tabular-nums}
  .tk.work .tm{color:var(--work)}
  .tk .ti{font-weight:600;font-size:12.5px;line-height:1.25;overflow:hidden}
  .tk .wh{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
  .tk .bf{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px)}
  .tk.bad{border-color:var(--under);box-shadow:0 0 0 1px var(--under)}
  .tk .flag{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--under);color:#fff;display:grid;place-items:center;font-size:10px}
  .tk.dim{opacity:.28}
  .tk.hl{box-shadow:0 0 0 2px var(--accent);z-index:2}
  .tk.armed{box-shadow:0 0 0 2px var(--accent)}
  .preview{position:absolute;border-radius:8px;border:2px dashed var(--ok);background:var(--ok-bg);z-index:3;pointer-events:none;font-size:12px;color:var(--ok);padding:4px 8px;font-weight:600;overflow:hidden;white-space:nowrap}
  .preview.bad{border-color:var(--under);background:var(--under-bg);color:var(--under)}
  .preview small{display:block;font-weight:500}
  .closed{position:absolute;background:var(--muted);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 9px)}
  .closed span{display:inline-block;padding:6px 8px;font-size:11px;color:var(--text3)}

  /* cartes « à planifier » */
  .qcard{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface);display:grid;gap:3px;text-align:left;width:100%;position:relative}
  .qcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--conf)}
  .qcard.work::before{background:var(--work)}
  .qcard:hover{border-color:var(--text3)}
  .qcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-weak)}
  .qcard .t{font-weight:600;font-size:13px;line-height:1.3}
  .qcard .w{font-size:12px;color:var(--text2);display:flex;gap:6px;align-items:center}
  .qcard .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--border);color:var(--text2);font-size:12px;align-items:center}
  .legend .sw{display:inline-block;width:20px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}

  /* bac */
  .tray{display:grid;gap:10px;padding:12px;align-content:start}
  .tray-head{display:grid;gap:8px}
  .tray-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tray-title h2{font-size:15px}
  .tray-list{display:grid;gap:8px;align-content:start;min-height:56px;padding:2px}
  .tray-hint{margin:0}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:0 10px;background:var(--surface)}
  .search .pi{color:var(--text3);font-size:13px}
  .search input{border:0;background:none;padding:7px 0;min-width:0;width:100%;outline:none}

  .occ{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
  .occ i{display:block;height:100%;background:var(--accent)}

  /* grille verticale */
  .gscroll{overflow:auto;max-height:calc(100vh - 250px);min-height:360px;border-radius:0 0 var(--radius) var(--radius)}
  .ggrid{display:grid;min-width:min-content}
  .gtime{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--border)}
  .gtime .lbls{position:relative}
  .gtime .lbl{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
  .gtime .lbl.h{color:var(--text2);font-weight:600}
  .gtime .lbl:first-child{transform:translateY(3px)}
  .ghead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--border);height:56px;padding:8px 10px;display:grid;align-content:center}
  .gtime .ghead{z-index:5}
  .ghead b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghead small{color:var(--text3);font-size:11px}
  .gcol{border-right:1px solid var(--line);min-width:170px}
  .lane{position:relative;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px)}
  .lane.h{background-image:linear-gradient(90deg,var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);height:68px;flex:none}
  .editing .lane{cursor:cell}
  .slotsel{position:absolute;left:3px;right:3px;border:2px solid var(--accent);background:var(--accent-weak);border-radius:6px;z-index:2;pointer-events:none}
  .slotsel span{font-size:11px;font-weight:600;color:var(--accent);padding:0 6px}
  .slotsel.h{top:3px;bottom:3px;left:auto;right:auto}

  /* frise */
  .fscroll{overflow:auto;max-height:calc(100vh - 250px);min-height:300px;border-radius:0 0 var(--radius) var(--radius);--lw:170px}
  .frise{position:relative;min-width:min-content}
  .faxis{display:flex;position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--border)}
  .fcorner{position:sticky;left:0;z-index:7;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:700}
  .fticks{position:relative;height:34px;flex:none}
  .fticks span{position:absolute;bottom:7px;transform:translateX(-50%);font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
  .fticks span.h{color:var(--text2);font-weight:600}
  .fticks span:first-child{transform:translateX(4px)}
  .fday{display:flex;background:var(--muted);border-bottom:1px solid var(--border)}
  .fday > div{position:sticky;left:0;padding:7px 12px;display:flex;gap:10px;align-items:baseline}
  .fday b{font-size:14px}
  .fday small{color:var(--text3);font-size:12px}
  .fday .w{color:var(--under);font-weight:600}
  .frow{display:flex;border-bottom:1px solid var(--line)}
  .flabel{position:sticky;left:0;z-index:4;width:var(--lw);flex:none;background:var(--surface);border-right:1px solid var(--border);padding:8px 12px;display:grid;align-content:center;gap:1px}
  .flabel b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flabel small{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
  .toolbar .sp{flex:1}
  .zoom{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
  .zoom input{accent-color:var(--accent);width:120px}
  .tray .seg{display:grid;grid-template-columns:repeat(3,auto);justify-content:start}
  .tray .seg button{padding:5px 8px;font-size:12.5px;white-space:nowrap}
  .plane .tk .in{gap:0}

  /* ---------- aperçu Desktop / Mobile ---------- */
  body{padding:0}
  .devswitch{position:fixed;z-index:85;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;padding:6px 6px 6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 24px rgba(16,24,40,.16);font-size:12px;color:var(--text2)}
  .devswitch .note{display:none}
  .devswitch .seg button{padding:5px 12px}
  .real-m .devswitch{display:none}
  #app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
  .phone-stage{padding:18px 16px 30px;display:flex;justify-content:center}
  .phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 110px));border:10px solid #10131a;border-radius:42px;overflow:hidden;transform:translateZ(0);background:var(--bg);box-shadow:0 20px 60px rgba(16,24,40,.25);position:relative}
  .phone #app{height:100%;overflow:auto;padding-left:12px;padding-right:12px;padding-bottom:90px}
  .real-m #app{padding-bottom:96px}

  /* ---------- mise en page mobile (classe .m posée sur <html>) ---------- */
  .m .bar{position:static;padding-block:12px 8px}
  .m .bar-title h1{font-size:17px}
  .m .bar-title p{width:100%}
  .m .actions{width:100%}
  .m .actions .btn.primary{margin-left:auto}
  .m .daybar{display:grid;gap:8px;margin-bottom:10px}
  .m .days,.m .kpis{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
  .m .days button,.m .kpi{flex:none}
  .m .kpi{min-width:0;padding:5px 10px}
  .m .kpi b{font-size:14px}
  .m .toolbar{padding:8px 10px}
  .m .zoom input{width:90px}
  .m .fscroll{max-height:none;--lw:92px}
  .m .flabel{padding:6px 8px}
  .m .flabel b{font-size:12px}
  .m .lane.h{height:60px}
  .m .legend{font-size:11px;gap:10px}
  .m .tk .wh .av{display:none}

  /* barre d'action basse */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:8px;align-items:center;background:var(--surface);border-top:1px solid var(--border);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-shadow:0 -4px 14px rgba(16,24,40,.06)}
  .mbar .btn{flex:1;justify-content:center;padding:10px}
  .mbar .btn b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px}
  .mbar .btn.primary b{background:#fff;color:var(--accent)}

  /* tiroir bas générique */
  .bsheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(16,24,40,.18);padding:6px max(14px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
  .bsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 8px}
  .bsheet .tray{padding:4px 0}
  .bsheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
  .bsheet-head h2{font-size:16px}

  /* listes de candidats (créneau libre) */
  .psec{padding:10px 12px;display:grid;gap:6px;border-bottom:1px solid var(--line)}
  .bsheet .psec{padding:10px 0}
  .psec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:flex;justify-content:space-between}
  .psec h3 b{font-weight:600;color:var(--text2)}
  .prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 0}
  .prow .t{font-weight:600;font-size:13px;line-height:1.3;display:block}
  .prow .s{font-size:12px;color:var(--text2);display:block}
  .prow.off{opacity:.55}
  .prow.off .s{color:var(--under)}
  .prow .btn{padding:5px 10px;font-size:12px}
  .m .actions [data-act=edit],.m .actions [data-act=save]{display:none}
  .m .actions{justify-content:flex-start}
  .m .lane.h .tk .te,.m .lane.h .tk .wh{display:none}
  .m .lane.h .tk .in{align-content:center;padding:4px 7px}

  /* ---------- éléments communs aux 3 propositions ---------- */
  .board{min-width:0}
  .toolbar b{font-weight:600}
  .ph{display:grid;gap:2px;padding:12px 12px 10px;border-bottom:1px solid var(--border);position:relative}
  .bsheet .ph{padding:2px 0 10px}
  .ph h2{font-size:15px;padding-right:40px}
  .ph p{margin:0;color:var(--text2);font-size:12px}
  .ph .x{position:absolute;right:8px;top:8px}
  .bsheet .ph .x{right:0;top:0}
  details.offs summary{cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600;list-style:none;display:flex;justify-content:space-between}
  details.offs summary::-webkit-details-marker{display:none}
  details.offs summary::before{content:"▸ ";}
  details.offs[open] summary::before{content:"▾ ";}
  .bsheet .psec{padding:10px 0}
  .gscroll{max-height:calc(100vh - 230px)}

  /* ---------- mobile : sélecteur de salle ---------- */
  .roomtabs{display:flex;gap:6px;overflow-x:auto;padding:10px;border-bottom:1px solid var(--border);scrollbar-width:none}
  .roomtabs button{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .roomtabs button small{color:var(--text3);font-size:11px}
  .roomtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .roomtabs button.on small{color:rgba(255,255,255,.8)}
  .m .gscroll{max-height:none;overflow-x:auto}
  .m .ghead{height:auto;min-height:44px;padding:6px 8px}
  .m .ghead b{font-size:12.5px}
  .m .gtime .lbl{right:5px;font-size:10.5px}
  .m .tk .in{padding:4px 6px}
  .m .tk .ti{font-size:12px}
  .single .ghead{display:none}
  .compact .tk .wh,.compact .tk .bf,.compact .ghead small,.compact .ghead .occ{display:none}
  .compact .tk{display:block!important}
  .compact .tk .in{height:100%}
  .compact .tk .ti{-webkit-line-clamp:3!important;font-size:11.5px}
  .compact .tk .tm{font-size:10.5px}
  .compact .tk .te{display:none}
  .compact .gcol{min-width:0}

  /* ---------- mobile : programme par heure ---------- */
  .agenda{display:grid}
  .hour{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px;border-bottom:1px solid var(--line)}
  .hour > .h{font-weight:700;font-variant-numeric:tabular-nums;padding-top:4px}
  .hour .items{display:grid;gap:8px}
  .acard{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:8px 10px 8px 0;text-align:left;width:100%}
  .acard > i{align-self:stretch;border-radius:0 3px 3px 0;background:var(--conf)}
  .acard.work > i{background:var(--work)}
  .acard.bad{border-color:var(--under)}
  .acard b{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
  .acard small{display:flex;gap:6px;align-items:center;color:var(--text2);font-size:12px;margin-top:2px}
  .acard .rt{font-size:11px;color:var(--text3);text-align:right;white-space:nowrap}
  .acard .rt .w{color:var(--under);display:block}
  .afree{display:flex;flex-wrap:wrap;gap:6px}
  .afree button{border:1.5px dashed var(--border);background:none;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text2);display:inline-flex;gap:6px;align-items:center}
  .afree button .pi{font-size:11px;color:var(--accent)}
  .afree button:disabled{opacity:.55;cursor:default}

  /* ---------- desktop : popover de créneau ---------- */
  .pop{position:fixed;z-index:62;width:360px;max-height:min(520px,calc(100vh - 40px));overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(16,24,40,.22)}

  /* ---------- mélange : grille + panneau à droite (desktop), une salle (mobile) ---------- */
  .main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
  .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);max-height:calc(100vh - 80px);overflow:auto}
  .m .main{grid-template-columns:minmax(0,1fr)}
  .m .panel{display:none}
  .hintbox{margin:12px;padding:12px;border-radius:9px;background:var(--muted);color:var(--text2);font-size:12px;display:flex;gap:8px}
  .hintbox .pi{color:var(--accent);margin-top:2px}
  .okz{position:absolute;left:3px;right:3px;background:var(--ok-bg);border:1.5px dashed var(--ok);border-radius:7px;z-index:0;pointer-events:none}
  .okz span{display:inline-block;margin:3px 6px;font-size:11px;font-weight:600;color:var(--ok)}
  .roomtabs button.fits:not(.on){border-color:var(--ok);color:var(--ok)}
  .ptabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
  .ptabs button{border:0;background:none;padding:8px 10px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}

  /* ---------- intervention en main ---------- */
  .arm-ghost{position:fixed;left:0;top:0;z-index:95;pointer-events:none;max-width:240px;background:var(--surface);border:1px solid var(--conf-bd);border-left:4px solid var(--conf);border-radius:8px;padding:6px 10px;box-shadow:0 10px 28px rgba(16,24,40,.22);display:grid;gap:1px;opacity:.95}

  /* ---------- allègement ---------- */
  .prow{grid-template-columns:minmax(0,1fr) auto}

<div id="stage"><div id="frame"><div id="app">
  <header class="bar">
    <div class="bar-title"><h1>Planning des conférences</h1><span class="tag">M1 · Battements</span><span class="mode" id="modeLbl">Lecture</span><p>Salon Ajoie 2026 · données d’exemple</p></div>

</div></div></div>
<script>
  const HOST = () => document.getElementById('app') || document.body;
  /* ============ Socle commun : modèle aligné sur TimelineData / Talk / PlanningTalksDto ============ */
  const T = (id, type, title, therapist, exhibitor, status, dayId, roomId, start, description) => {
    const conf = type === 'CONFERENCE';
    // toTalk(con, 'CONFERENCE', 60, 45) / toTalk(work, 'WORKSHOP', 75, 60)
    return { id, type, title, therapist, exhibitor, status, description,
      dayId: dayId || null, roomId: roomId || null, start: start == null ? null : start };
  };
  const SEED = () => ({
    eventId: 'salon-ajoie-2026',
    interval: 30,   // pas de la salle : lignes de la grille
    step: 15,       // pas de placement : heures de début possibles
    types: { CONFERENCE: { dur: 45, prep: 0, clean: 15 }, WORKSHOP: { dur: 60, prep: 15, clean: 15 } },
    rooms: [
      { id: 'r1', label: 'Salle Jura' },
      { id: 'r2', label: 'Salle des Rangiers' },
      { id: 'r3', label: 'Atelier Clos-du-Doubs' }
    ],
    days: [
      { id: 'd1', label: 'Samedi 14 novembre', date: '2026-11-14', rooms: [
          { roomId: 'r1', start: 600, end: 1080 }, { roomId: 'r2', start: 600, end: 1080 }, { roomId: 'r3', start: 630, end: 1050 } ] },
      { id: 'd2', label: 'Dimanche 15 novembre', date: '2026-11-15', rooms: [
          { roomId: 'r1', start: 600, end: 1020 }, { roomId: 'r2', start: 600, end: 1020 }, { roomId: 'r3', start: 660, end: 990 } ] }
    ],
    talks: [
      T('101','CONFERENCE','Le sommeil, un allié sous-estimé','Claire Monnin','Cabinet Équilibre','ACCEPTED','d1','r1',600,'Comprendre les cycles du sommeil et les habitudes qui aident à mieux récupérer.'),
      T('102','CONFERENCE','Introduction à la sophrologie','Julien Fleury','Sophro Ajoie','ACCEPTED','d1','r2',690,'Origines, principes et premiers exercices de sophrologie.'),
      T('103','CONFERENCE','Plantes médicinales du Jura','Anne-Sophie Girardin','Herboristerie des Côtes','ACCEPTED','d1','r1',720,'Reconnaître et utiliser une dizaine de plantes de la région.'),
      T('104','CONFERENCE','Gérer le stress au quotidien','Marc Chapuis','Espace Respir','ACCEPTED','d2','r1',600,'Outils simples pour repérer et réguler le stress.'),
      T('105','CONFERENCE','Les bases de la médecine chinoise','Lin Wei Bourquin','Cabinet Lin Wei','ACCEPTED',null,null,null,'Yin, yang, méridiens : une introduction accessible.'),
      T('106','CONFERENCE','Alimentation anti-inflammatoire','Claire Monnin','Cabinet Équilibre','ACCEPTED','d1','r2',630,'Ce que dit la recherche et comment l’appliquer en cuisine.'),
      T('107','CONFERENCE','Kinésiologie : de quoi parle-t-on ?','Nadia Theurillat','Kinésio Porrentruy','PENDING',null,null,null,'Présentation de la méthode et de ses champs d’application.'),
      T('108','CONFERENCE','Traverser un deuil','Pascal Juillerat','Accompagnement PJ','ACCEPTED',null,null,null,'Les étapes du deuil et les ressources pour être accompagné.'),
      T('109','CONFERENCE','Réflexologie plantaire','Sabrina Rérat','Pieds & Bien-être','ACCEPTED',null,null,null,'Cartographie du pied et bienfaits attendus.'),
      T('201','WORKSHOP','Respiration et cohérence cardiaque','Julien Fleury','Sophro Ajoie','ACCEPTED','d1','r3',750,'Atelier pratique : 3 exercices à refaire chez soi.'),
      T('202','WORKSHOP','Fabriquer son baume aux plantes','Anne-Sophie Girardin','Herboristerie des Côtes','ACCEPTED','d1','r3',660,'Chaque participant repart avec son baume. 12 places.'),
      T('203','WORKSHOP','Initiation au qi gong','Lin Wei Bourquin','Cabinet Lin Wei','ACCEPTED','d2','r2',615,'Mouvements lents et respiration, tenue confortable conseillée.'),
      T('204','WORKSHOP','Automassage des mains','Sabrina Rérat','Pieds & Bien-être','PENDING',null,null,null,'Points réflexes de la main, en binôme.'),
      T('205','WORKSHOP','Méditation guidée','Nadia Theurillat','Kinésio Porrentruy','ACCEPTED',null,null,null,'Séance guidée de 45 minutes suivie d’un échange.')
    ]
  });

  function syncTalks(s) {
    for (const t of s.talks) { const c = s.types[t.type]; t.talkMin = c.dur; t.prep = c.prep; t.clean = c.clean; t.total = c.prep + c.dur + c.clean; }
    return s;
  }
  const occA = (t, start) => start - t.prep;              // début de la préparation
  const occB = (t, start) => start + t.talkMin + t.clean; // fin du rangement
  const durLabel = t => `${t.prep ? 'prép. ' + t.prep + ' · ' : ''}${t.talkMin} min${t.clean ? ' · rang. ' + t.clean : ''}`;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const toMin = v => { const [h, m] = String(v).split(':').map(Number); return h * 60 + (m || 0); };
  const clone = o => JSON.parse(JSON.stringify(o));
  const keyOf = t => t.type + ':' + t.id;
  const isPlaced = t => !!(t.dayId && t.roomId && t.start != null);
  const TYPE = { CONFERENCE: { label: 'Conférence', cls: 'conf' }, WORKSHOP: { label: 'Atelier', cls: 'work' } };
  const STATUS = { ACCEPTED: 'Validé', PENDING: 'En vérification' };

  const pi = n => `<i class="pi pi-${n}" aria-hidden="true"></i>`;
  const ICON = { back: pi('arrow-left'), pencil: pi('pencil'), save: pi('save'), list: pi('cog'), undo: pi('undo'), gear: pi('sliders-h'), x: pi('times'), wand: pi('bolt') };

  /* ---------- store : lecture / édition / annuler / enregistrer ---------- */
  const App = {
    saved: null, s: null, mode: 'read', hist: [], subs: [], armed: null, focus: null,
    init() { this.saved = syncTalks(SEED()); this.s = clone(this.saved); },
    on(fn) { this.subs.push(fn); },
    emit() { document.body.classList.toggle('editing', this.editing); renderActions(); this.subs.forEach(f => f()); renderSheet(); },
    get editing() { return this.mode === 'edit'; },
    edit() { this.mode = 'edit'; this.hist = []; this.emit(); },
    cancel() { this.armed = null; this.s = clone(this.saved); this.mode = 'read'; this.hist = []; this.emit(); toast('Modifications abandonnées'); },
    save() { this.armed = null; this.saved = clone(this.s); this.mode = 'read'; this.hist = []; this.emit(); toast('Planning enregistré', { label: 'Voir les données', fn: showPayload }); },
    change(fn) { this.hist.push(clone(this.s)); if (this.hist.length > 60) this.hist.shift(); fn(this.s); this.emit(); },
    undo() { if (!this.hist.length) return; this.s = this.hist.pop(); this.emit(); },
    talk(k) { return this.s.talks.find(t => keyOf(t) === k); },
    room(id) { return this.s.rooms.find(r => r.id === id); },
    day(id) { return this.s.days.find(d => d.id === id); },
    dayRoom(dayId, roomId) { const d = this.day(dayId); return d ? d.rooms.find(r => r.roomId === roomId) : null; }
  };

  /* ---------- règles ---------- */
  function check(t, dayId, roomId, start) {
    const reasons = [];
    const dr = App.dayRoom(dayId, roomId);
    if (!dr) reasons.push('La salle est fermée ce jour-là');
    else if (occA(t, start) < dr.start || occB(t, start) > dr.end) reasons.push(`Hors des horaires de la salle (${hhmm(dr.start)}–${hhmm(dr.end)}), battements compris`);
    for (const o of App.s.talks) {
      if (keyOf(o) === keyOf(t) || !isPlaced(o) || o.dayId !== dayId) continue;
      if (o.roomId === roomId) { if (occA(t, start) < occB(o, o.start) && occA(o, o.start) < occB(t, start)) reasons.push(`Chevauche « ${o.title} » (${hhmm(o.start)}), battements compris`); }
      else if (o.therapist === t.therapist && start < o.start + o.talkMin && o.start < start + t.talkMin) reasons.push(`${t.therapist} intervient déjà en ${App.room(o.roomId)?.label} à ${hhmm(o.start)}`);
    }
    return { ok: !reasons.length, reasons };
  }
  const issuesOf = t => isPlaced(t) ? check(t, t.dayId, t.roomId, t.start).reasons : [];
  const snap = (m, dayId, roomId) => {
    const dr = App.dayRoom(dayId, roomId), i = App.s.step, base = dr ? dr.start : 0;
    return base + Math.round((m - base) / i) * i;
  };
  const firstStart = (t, dr) => dr.start + Math.ceil(t.prep / App.s.step) * App.s.step;
  function freeStarts(t, dayId, roomId) {
    const dr = App.dayRoom(dayId, roomId); if (!dr) return [];
    const out = [];
    for (let m = firstStart(t, dr); occB(t, m) <= dr.end; m += App.s.step) if (check(t, dayId, roomId, m).ok) out.push(m);
    return out;
  }
  function place(k, dayId, roomId, start) {
    if (!App.dayRoom(dayId, roomId)) { toast('Cette salle est fermée ce jour-là'); return false; }
    App.change(s => Object.assign(s.talks.find(x => keyOf(x) === k), { dayId, roomId, start }));
    const t = App.talk(k), iss = issuesOf(t);
    if (iss.length) toast('Placé avec un conflit : ' + iss[0]);
    return true;
  }
  function unplace(k) { App.change(s => Object.assign(s.talks.find(x => keyOf(x) === k), { dayId: null, roomId: null, start: null })); }

  /* ---------- DTO envoyé à salonService.savePlanningTalks ---------- */
  function toDto(s) {
    const iso = (d, m) => new Date(`${d.date}T${hhmm(m)}:00`).toISOString();
    return {
      configuration: {
        eventId: s.eventId, intervalMinutes: s.interval, placementIntervalMinutes: s.step,
        talkTypes: Object.fromEntries(Object.entries(s.types).map(([k, v]) => [k, { durationTalkMinutes: v.dur, preparationMinutes: v.prep, cleanupMinutes: v.clean }])),
        days: s.days.map(d => ({ id: d.id, label: d.label, rooms: d.rooms.map(r => ({ roomId: r.roomId, startingHour: iso(d, r.start), endingHour: iso(d, r.end) })) })),
        rooms: s.rooms.map(r => ({ id: r.id, label: r.label }))
      },
      talks: s.talks.map(t => {
        const d = s.days.find(x => x.id === t.dayId), dr = d && d.rooms.find(r => r.roomId === t.roomId);
        return { id: t.id, type: t.type, roomId: t.roomId, dayId: t.dayId, startSlot: dr && t.start != null ? Math.round((t.start - dr.start) / s.step) : 0 };
      })
    };
  }

  /* ---------- UI commune ---------- */
  let toastTimer;
  function toast(msg, action) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); HOST().append(el); }
    el.hidden = false;
    el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
    if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.fn(); };
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 4200);
  }

  function renderActions() {
    const el = $('#actions'); if (!el) return;
    el.innerHTML = !App.editing
      ? `<button class="btn icon" data-act="back" title="Retour" aria-label="Retour">${ICON.back}</button>
       <button class="btn primary" data-act="edit">${ICON.pencil}<span>Modifier</span></button>
       <div class="menu"><button class="btn collapse" data-act="menu" aria-expanded="false">${ICON.list}<span>Actions</span></button>
         <div class="menu-pop" hidden><button data-act="pdf">Télécharger le planning (PDF)</button><button data-act="payload">Voir les données enregistrées</button></div></div>`
      : `<button class="btn collapse" data-act="undo" ${App.hist.length ? '' : 'disabled'} title="Annuler la dernière action">${ICON.undo}<span>Annuler</span></button>
       <button class="btn collapse" data-act="config">${ICON.gear}<span>Salles et horaires</span></button>
       <button class="btn ghost" data-act="cancel">Abandonner</button>
       <button class="btn primary" data-act="save">${ICON.save}<span>Enregistrer</span></button>`;
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    const pop = $('.menu-pop');
    if (pop && !e.target.closest('.menu')) pop.hidden = true;
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'edit') App.edit();
    else if (a === 'cancel') App.cancel();
    else if (a === 'save') App.save();
    else if (a === 'undo') App.undo();
    else if (a === 'config') openConfig();
    else if (a === 'back') toast('Retour à la fiche du salon');
    else if (a === 'menu') { pop.hidden = !pop.hidden; b.setAttribute('aria-expanded', String(!pop.hidden)); }
    else if (a === 'pdf') { pop.hidden = true; toast('Le PDF est généré par le serveur (action DOWNLOAD)'); }
    else if (a === 'payload') { pop.hidden = true; showPayload(); }
    else if (a === 'close-sheet') closeSheet();
    else if (a === 'unplace') { unplace(b.dataset.key); }
    else if (a === 'close-modal') closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeSheet(); } });

  /* ---------- panneau de détail d'une intervention ---------- */
  let sheetKey = null;
  function openTalk(k) { sheetKey = k; renderSheet(); }
  function closeSheet() { sheetKey = null; renderSheet(); }
  function renderSheet() {
    let host = $('#sheetHost');
    if (!host) { host = document.createElement('div'); host.id = 'sheetHost'; HOST().append(host); }
    const t = sheetKey && App.talk(sheetKey);
    if (!t) { host.innerHTML = ''; return; }
    const ty = TYPE[t.type], iss = issuesOf(t), s = App.s;
    const where = isPlaced(t) ? `${App.day(t.dayId).label} · ${App.room(t.roomId).label} · ${hhmm(t.start)}–${hhmm(t.start + t.talkMin)}` : 'Pas encore placée';
    let form = '';
    if (App.editing) {
      const dayId = t.dayId || s.days[0]?.id, roomId = t.roomId || App.day(dayId)?.rooms[0]?.roomId;
      const dr = App.dayRoom(dayId, roomId);
      let opts = '<option value="">—</option>';
      if (dr) for (let m = firstStart(t, dr); occB(t, m) <= dr.end; m += s.step) {
        const ok = check(t, dayId, roomId, m).ok, cur = isPlaced(t) && t.start === m && t.dayId === dayId && t.roomId === roomId;
        opts += `<option value="${m}" ${cur ? 'selected' : ''}>${hhmm(m)}${ok ? '' : ' · occupé'}</option>`;
      }
      form = `<div class="row">
      <label class="field">Jour<select id="sh-day">${s.days.map(d => `<option value="${d.id}" ${d.id === dayId ? 'selected' : ''}>${esc(d.label)}</option>`).join('')}</select></label>

  /* ---------- configuration salles / jours / intervalle ---------- */

      <div class="top"><label class="field">Libellé<input id="dl-${d.id}" data-dlabel="${i}" value="${esc(d.label)}"></label><label class="field">Date<input type="date" id="dd-${d.id}" data-ddate="${i}" value="${d.date}"></label>
      <button class="btn icon ghost" data-delday="${i}" aria-label="Supprimer le jour">${ICON.x}</button></div>
      <div class="cfg-wrap"><table class="cfg-table"><thead><tr><th>Salle</th><th>Ouverte</th><th>De</th><th>À</th></tr></thead><tbody>

        <td><input type="time" class="inp" step="900" id="e-${d.id}-${r.id}" data-he="${i}|${r.id}" value="${dr ? hhmm(dr.end) : '18:00'}" ${dr ? '' : 'disabled'}></td></tr>`; }).join('')}

    box.addEventListener('click', e => {

      else if (b.dataset.delroom) { const r = draft.rooms.splice(+b.dataset.delroom, 1)[0]; draft.days.forEach(d => d.rooms = d.rooms.filter(x => x.roomId !== r.id)); renderConfig(); }
      else if (b.id === 'addDay') { const last = draft.days[draft.days.length - 1]; const dt = last ? new Date(last.date + 'T12:00:00') : new Date(); dt.setDate(dt.getDate() + 1);
        draft.days.push({ id: 'd' + Date.now().toString(36), label: dt.toLocaleDateString('fr-CH', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^./, c => c.toUpperCase()), date: dt.toISOString().slice(0, 10), rooms: draft.rooms.map(r => ({ roomId: r.id, start: 600, end: 1080 })) }); renderConfig(); }
      else if (b.dataset.delday) { draft.days.splice(+b.dataset.delday, 1); renderConfig(); }
      else if (b.id === 'applyCfg') applyConfig();
    });
    box.addEventListener('input', e => {
      const el = e.target, ds = el.dataset;
      if (ds.room) draft.rooms[+ds.room].label = el.value;
      if (ds.ty) { const [k, f] = ds.ty.split('|'), v = Math.max(0, Math.round(+el.value || 0)); draft.types[k][f] = v; const c = draft.types[k]; $('#tt-' + k).textContent = (c.prep + c.dur + c.clean) + ' min'; }
      if (ds.dlabel) draft.days[+ds.dlabel].label = el.value;
      if (ds.ddate) draft.days[+ds.ddate].date = el.value;
      const k = ds.hs || ds.he;
      if (k && el.value) { const [i, rid] = k.split('|'); const dr = draft.days[+i].rooms.find(x => x.roomId === rid); if (dr) dr[ds.hs ? 'start' : 'end'] = toMin(el.value); }
    });
    box.addEventListener('change', e => {
      const ds = e.target.dataset; if (!ds.open) return;
      const [i, rid] = ds.open.split('|'), d = draft.days[+i];
      if (e.target.checked) d.rooms.push({ roomId: rid, start: toMin($('#s-' + d.id + '-' + rid).value || '10:00'), end: toMin($('#e-' + d.id + '-' + rid).value || '18:00') });
      else d.rooms = d.rooms.filter(x => x.roomId !== rid);
      d.rooms.sort((a, b) => draft.rooms.findIndex(r => r.id === a.roomId) - draft.rooms.findIndex(r => r.id === b.roomId));

    });
  }
  function applyConfig() {
    for (const d of draft.days) for (const r of d.rooms) if (r.end <= r.start) { toast(`${d.label} : l’heure de fin doit suivre l’heure de début`); return; }
    for (const [k, l] of TYPE_ROWS) if (draft.types[k].dur < 5) { toast(`${l} : la durée doit faire au moins 5 minutes`); return; }
    App.change(s => {
      s.interval = draft.interval; s.step = draft.step; s.types = draft.types; s.rooms = draft.rooms; s.days = draft.days;
      syncTalks(s);
      for (const t of s.talks) if (t.dayId && !s.days.find(d => d.id === t.dayId && d.rooms.some(r => r.roomId === t.roomId))) Object.assign(t, { dayId: null, roomId: null, start: null });
    });
    closeModal(); const n = App.s.talks.filter(t => issuesOf(t).length).length;
    toast(n ? `Configuration appliquée · ${n} intervention${n > 1 ? 's' : ''} en conflit à revoir` : 'Configuration appliquée');
  }

  /* ---------- glisser-déposer au pointeur (souris + tactile) ---------- */
  function makeDraggable(opts) {
    let d = null, ghost = null, suppressClick = false;
    document.addEventListener('pointerdown', e => {
      const el = e.target.closest('[data-drag]');
      if (!el || !App.editing || e.button !== 0) return;
      const r = el.getBoundingClientRect();
      d = { el, key: el.dataset.drag, x0: e.clientX, y0: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, w: r.width, h: r.height, started: false, pid: e.pointerId, target: null, info: null };
    });
    document.addEventListener('pointermove', e => {
      if (!d || e.pointerId !== d.pid) return;
      if (!d.started) {
        if (Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
        d.started = true;
        ghost = d.el.cloneNode(true); ghost.classList.add('drag-ghost'); ghost.removeAttribute('data-drag');
        Object.assign(ghost.style, { width: d.w + 'px', height: d.h + 'px', position: 'fixed', left: '0', top: '0', margin: '0' });
        document.body.append(ghost); d.el.classList.add('is-dragging');
      }
      e.preventDefault();
      ghost.style.transform = `translate(${e.clientX - d.ox}px,${e.clientY - d.oy}px)`;
      const info = { x: e.clientX, y: e.clientY, left: e.clientX - d.ox, top: e.clientY - d.oy };
      const p = opts.probe ? opts.probe(info) : info;
      const hit = document.elementFromPoint(p.x, p.y);
      d.target = hit && hit.closest('[data-drop]'); d.info = info;
      opts.over(d.key, d.target, info);
      const sc = opts.scroller && opts.scroller();
      if (sc) { const r = sc.getBoundingClientRect(), edge = 40;
        if (e.clientY > r.bottom - edge) sc.scrollTop += 14; else if (e.clientY < r.top + edge) sc.scrollTop -= 14;
        if (e.clientX > r.right - edge) sc.scrollLeft += 14; else if (e.clientX < r.left + edge) sc.scrollLeft -= 14; }
    }, { passive: false });
    const end = e => {
      if (!d || e.pointerId !== d.pid) return;
      if (d.started) { ghost.remove(); d.el.classList.remove('is-dragging'); opts.over(null, null); suppressClick = true;
        if (e.type === 'pointerup' && d.target) opts.drop(d.key, d.target, d.info); setTimeout(() => suppressClick = false, 0); }
      d = null;
    };
    document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
    document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
  }

  /* ---------- placement au toucher, suivi d'un·e intervenant·e, avatars ---------- */
  function arm(k) { App.armed = App.armed === k ? null : k; App.emit(); }
  function armBanner() {
    const t = App.armed && App.talk(App.armed); if (!t || !App.editing) return '';
    return `<div class="armbar" role="status"><i class="pi pi-map-marker"></i><span>Survolez la grille puis cliquez pour placer <b>${esc(t.title)}</b> (${durLabel(t)})</span><kbd>Échap</kbd><button class="lnk" data-act="disarm">Annuler</button></div>`;
  }
  function setFocus(name) { App.focus = App.focus === name ? null : name; App.emit(); }
  function focusBanner() {
    if (!App.focus) return '';
    const n = App.s.talks.filter(t => t.therapist === App.focus && isPlaced(t)).length;
    return `<div class="focusbar">${avatar(App.focus)}<span>Interventions de <b>${esc(App.focus)}</b> surlignées · ${n} placée${n > 1 ? 's' : ''}</span><button class="lnk" data-act="unfocus">Effacer</button></div>`;
  }
  function focusCls(t) { return App.focus ? (t.therapist === App.focus ? ' hl' : ' dim') : ''; }
  function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function avatar(name, cls = '') { const ini = name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); return `<span class="av ${cls}" style="--h:${hue(name)}" title="${esc(name)}">${ini}</span>`; }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'disarm') { App.armed = null; App.emit(); }
    if (b.dataset.act === 'unfocus') { App.focus = null; App.emit(); }
    if (b.dataset.act === 'arm') arm(b.dataset.key);
    if (b.dataset.act === 'focus') setFocus(b.dataset.name);
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,select,textarea,.modal')) return;
    if (e.key === 'Escape' && (App.armed || App.focus)) { App.armed = null; App.focus = null; App.emit(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && App.editing) { e.preventDefault(); App.undo(); }
  });

  App.init();

  /* ============ Vues partagées : grille verticale, frise horizontale, bac « À planifier » ============ */
  const V = { ppmV: 1.7, ppmH: 2.2, curDay: App.s.days[0]?.id, filter: 'ALL', q: '' };

  function bounds(rooms) {
    let a = rooms.length ? Math.min(...rooms.map(r => r.start)) : 540, b = rooms.length ? Math.max(...rooms.map(r => r.end)) : 1080;
    return [Math.floor(a / 60) * 60, Math.ceil(b / 60) * 60];
  }
  const placedIn = (dayId, roomId) => App.s.talks.filter(t => isPlaced(t) && t.dayId === dayId && (!roomId || t.roomId === roomId));
  function ensureDay() { if (!App.day(V.curDay)) V.curDay = App.s.days[0]?.id; return App.day(V.curDay); }

    return `<div class="empty"><strong>Aucun jour configuré</strong>${App.editing ? 'Ajoutez les jours et les salles du salon pour démarrer le planning.<button class="btn primary" data-act="config">' + pi('sliders-h') + '<span>Salles et horaires</span></button>' : 'Activez le mode édition pour démarrer un nouveau planning.'}</div>`;
  }

  /* ---- barre des jours + indicateurs ---- */
  function dayStats(dayId) {
    const ts = dayId ? placedIn(dayId) : App.s.talks.filter(isPlaced);
    return { n: ts.length, bad: ts.filter(t => issuesOf(t).length).length };
  }
  function daybarHTML({ allOption = false } = {}) {

      return `<button data-day="${d.id}" class="${d.id === V.curDay ? 'on' : ''}"><b>${esc(d.label)}</b><small>${hhmm(b[0])}–${hhmm(b[1])} · ${d.rooms.length} salle${d.rooms.length > 1 ? 's' : ''} · ${st.n} interv.${st.bad ? ` · <span class="w">${st.bad} conflit${st.bad > 1 ? 's' : ''}</span>` : ''}</small></button>`; }).join('');
    return `<div class="daybar"><div class="days">${allOption ? `<button data-day="*" class="${V.curDay === '*' ? 'on' : ''}"><b>Tous les jours</b><small>${s.days.length} jours · ${all.n} interv.</small></button>` : ''}${days}</div>
