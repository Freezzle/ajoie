<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--muted:#f0f2f5;--border:#e1e4ea;--line:#eceef2;
  --text:#1c2230;--text2:#5d6676;--text3:#9aa1ad;
  --accent:#3b5bdb;--accent-weak:#e9eeff;
  --ok:#2b8a3e;--ok-bg:#e7f5ea;--under:#d6336c;--under-bg:#fdeaf0;--over:#d9480f;--over-bg:#fff1e6;
  --unav:#a3a8b1;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c;--surface:#1c2027;--muted:#232831;--border:#2f3540;--line:#262b34;
    --text:#e8ebf0;--text2:#a5adba;--text3:#6c7482;
    --accent:#7d97ff;--accent-weak:#252d48;
    --ok:#69db7c;--ok-bg:#1d3324;--under:#ff8fab;--under-bg:#3a1f29;--over:#ffa94d;--over-bg:#3a2a1a;
    --unav:#5c6370;--shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c;--surface:#1c2027;--muted:#232831;--border:#2f3540;--line:#262b34;
  --text:#e8ebf0;--text2:#a5adba;--text3:#6c7482;
  --accent:#7d97ff;--accent-weak:#252d48;
  --ok:#69db7c;--ok-bg:#1d3324;--under:#ff8fab;--under-bg:#3a1f29;--over:#ffa94d;--over-bg:#3a2a1a;
  --unav:#5c6370;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:600 10px/1 Inter,sans-serif;padding:2px 4px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2)}
code{font-size:12px;background:var(--muted);padding:1px 4px;border-radius:4px}
.wrap{max-width:1440px;margin:0 auto;padding:16px}

/* top */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0}
.brand small{color:var(--text2)}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;color:var(--text2);font-weight:500;display:flex;gap:7px;align-items:center}
.seg button b{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:var(--border);font-size:11px;color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.seg button.on b{background:var(--accent);color:#fff}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;display:inline-flex;gap:6px;align-items:center;color:var(--text2)}
.icon-btn:hover{color:var(--text)}
.icon-btn:disabled{opacity:.4;cursor:default}

/* pitch */
.pitch{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}
.pitch h2,.mcard h2{margin:0 0 4px;font-size:16px}
.pitch p,.mcard p{margin:0;color:var(--text2)}
.pitch h3,.mcard h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.pitch ul,.mcard ul{margin:0;padding-left:18px;color:var(--text2)}
.pitch li,.mcard li{margin:3px 0}
.eyebrow{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
@media (max-width:900px){.pitch{grid-template-columns:1fr}}

/* day bar + switch */
.daybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 12px;text-align:left}
.days button small{display:block;color:var(--text3);font-size:11px}
.days button.on{border-color:var(--accent);background:var(--accent-weak)}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 12px;min-width:110px}
.kpi small{display:block;color:var(--text3);font-size:11px}
.kpi b{font-size:15px}
.kpi.bad b{color:var(--under)} .kpi.good b{color:var(--ok)}
.viewbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.vswitch{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.vswitch button{border:0;background:none;border-radius:9px;padding:8px 16px 8px 12px;display:flex;gap:10px;align-items:center;text-align:left;color:var(--text2)}
.vswitch button i{font-size:17px;width:20px;text-align:center}
.vswitch button b{display:block;color:var(--text);font-size:13.5px}
.vswitch button small{display:block;font-size:11.5px}
.vswitch button.on{background:var(--accent);color:rgba(255,255,255,.85)}
.vswitch button.on b{color:#fff}
.vhint{color:var(--text3);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface);border-radius:var(--radius) var(--radius) 0 0}
.tool{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 8px 5px 5px;font-weight:500}
.tool .sw{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--c,var(--muted));color:#1c2230;font-size:12px}
.tool.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.tool.un .sw{background:var(--unav);color:#fff}
.tool.er .sw{background:var(--muted);color:var(--text)}
.toolbar .sep,.m-pal .sep{width:1px;height:24px;background:var(--border);margin:0 4px;flex:none}
.toolbar .hint{margin-left:auto;color:var(--text3);font-size:12px}
.sw{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:#1c2230;font-size:11px;flex:none}
.selbanner{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--accent-weak);border-bottom:1px solid var(--border);font-size:13px}
.selbanner .sp{flex:1}
.scroller{overflow:auto;max-height:72vh}
.noselect{user-select:none;-webkit-user-select:none}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--under)}
.btn.full{width:100%;justify-content:center;padding:10px;margin-top:12px}
.st-under{background:var(--under-bg)!important;color:var(--under)}
.st-ok{background:var(--ok-bg)!important;color:var(--ok)}
.st-over{background:var(--over-bg)!important;color:var(--over)}
.st-none{color:var(--text3)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--muted);white-space:nowrap}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:hsl(var(--h) 55% 52%);color:#fff;font-size:10px;font-weight:700;flex:none;transition:opacity .15s,transform .15s}
.av.lg{width:30px;height:30px;font-size:11px}
.seat{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--under);opacity:.8;flex:none}
.dim .av{opacity:.18}
.dim .av.fx{opacity:1;transform:scale(1.1);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}

/* ===== Timeline (vue bénévoles) ===== */
.tl-in{position:relative}
.tl-sticky{position:sticky;top:0;z-index:12;background:var(--surface);box-shadow:0 1px 0 var(--border)}
.tl-row{display:flex;border-bottom:1px solid var(--line)}
.tl-name{position:sticky;left:0;z-index:6;width:170px;flex:none;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid var(--border);font-weight:600;font-size:13px}
.tl-name small{margin-left:auto;font-weight:500;color:var(--text3);font-size:11.5px}
.tl-name small.warn{color:var(--over);font-weight:700}
.tl-name[data-act]{cursor:pointer}
.tl-name[data-act]:hover{color:var(--accent)}
.tl-row.fx .tl-name{background:var(--accent-weak);color:var(--accent)}
.tl-head .tl-name{color:var(--text3);font-weight:500;font-size:12px}
.tw{display:flex;flex-direction:column}
.tranches{position:relative;height:46px;border-bottom:1px solid var(--line)}
.tranches .tr{position:absolute;top:5px;bottom:5px;border-radius:7px;background:var(--muted);padding:3px 8px;font-size:11px;overflow:hidden;white-space:nowrap;border-left:3px solid var(--accent);line-height:1.25}
.tranches .tr b{display:block;font-size:11.5px}
.tranches .tr small{color:var(--text2)}
.ticks{position:relative;height:28px}
.ticks span{position:absolute;top:7px;font-size:11px;color:var(--text2);transform:translateX(4px);font-weight:600}
.track{position:relative;height:46px;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px var(--w));touch-action:none;cursor:copy}
.track.ro{cursor:default;height:30px}
.band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 9%,transparent);border-left:1px dashed var(--accent);border-right:1px dashed var(--accent);pointer-events:none}
.blk{position:absolute;top:6px;height:34px;border-radius:8px;background:var(--c);color:#1c2230;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;font-weight:600;cursor:grab;overflow:visible;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.08);transition:opacity .15s}
.blk .bl{overflow:hidden;text-overflow:ellipsis}
.blk small{font-weight:500;opacity:.7;overflow:hidden}
.blk.narrow .bl,.blk.narrow small{display:none}
.blk.narrow{padding:0;justify-content:center}
.blk.un{background:repeating-linear-gradient(135deg,var(--unav) 0 4px,color-mix(in srgb,var(--unav) 60%,transparent) 4px 9px);color:#fff}
.blk.hl{box-shadow:0 0 0 2px var(--accent)}
.blk.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text);z-index:4}
.blk.drag{opacity:.85;z-index:9;cursor:grabbing;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.blk.ghost{opacity:.6;outline:2px dashed var(--text2);pointer-events:none}
.blk .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
.blk .h.l{left:-2px}.blk .h.r{right:-2px}
.blk .h::after{content:"";position:absolute;top:10px;bottom:10px;left:3px;width:3px;border-radius:2px;background:rgba(0,0,0,.25);opacity:0}
.blk:hover .h::after{opacity:1}
.dimp .tl-row.pr:not(.fx) .blk:not(.hl){opacity:.28}
.pop{position:absolute;top:40px;left:0;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;gap:4px;cursor:default}
.pop button{border:1px solid transparent;border-radius:7px;background:none;padding:3px}
.pop button:hover{border-color:var(--border);background:var(--muted)}
.pop .sw{width:26px;height:26px}
.cv{position:absolute;top:4px;bottom:4px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cv.ed{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:0;top:3px;bottom:3px;background:var(--muted)}
.cv.ed b{text-align:center;font-size:10.5px}
.cv.ed button{border:0;background:none;height:17px;line-height:1;font-size:13px;color:inherit;padding:0}
.cv.ed button:hover{background:rgba(0,0,0,.06)}
.tl-row.cov.ed .track.ro{height:62px}
.tl-row.cov .tl-name{font-weight:500;font-size:12px}
.tl-sec{padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.tl-sec span{position:sticky;left:10px;display:flex;gap:7px;align-items:center}
.tl-sec .btn{position:sticky;left:340px;text-transform:none;letter-spacing:0;font-size:11.5px;padding:3px 9px}

/* zones alignées sur la timeline (B) */
.zdock{position:sticky;bottom:0;z-index:11;background:var(--surface);box-shadow:0 -1px 0 var(--border),0 -8px 16px rgba(16,24,40,.07)}
.zrow .tl-name{align-items:center}
.zrow .tl-name small{display:block;margin:0;font-weight:500;color:var(--text3);font-size:11px}
.zt{cursor:default}
.zcell{position:absolute;top:3px;bottom:3px;border-radius:6px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;padding:3px;cursor:pointer;background:var(--muted);touch-action:none}
.zcell .av{width:20px;height:20px;font-size:8.5px}
.zcell .seat{width:20px;height:20px}
.zcell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.zcell:hover{filter:brightness(.97)}
.zfree .track{height:26px}
.zfree .tl-name{font-size:11.5px;font-weight:500;color:var(--text2)}
.zfree .fc{position:absolute;top:4px;bottom:4px;display:grid;place-items:center;font-size:11px;color:var(--text2)}

/* ===== Zones × heures (2A) ===== */
.p2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:1000px){.p2{grid-template-columns:1fr}}
.g2{border-collapse:separate;border-spacing:0}
.g2 th,.g2 td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.g2 thead th{position:sticky;top:31px;background:var(--surface);z-index:5;font-size:11px;color:var(--text2);padding:7px 0;font-weight:600}
.g2 thead tr.trrow th{top:0;height:31px;text-align:left;padding:4px 6px;font-weight:500;background:var(--surface)}
.g2 thead tr.trrow th div{border-left:3px solid var(--accent);background:var(--muted);border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden}
.g2 thead tr.trrow th b{color:var(--text);margin-right:4px}
.g2 .name{position:sticky;left:0;background:var(--surface);z-index:6;padding:8px 10px;min-width:170px;text-align:left}
.g2 thead .name{z-index:8}
.g2 .name .nm{display:flex;gap:8px;align-items:center}
.g2 .name small{display:block;color:var(--text3);font-size:11px;margin-left:30px}
.g2 td.pc{min-width:72px;width:72px;vertical-align:top;padding:5px;cursor:pointer;touch-action:none;position:relative}
.g2 td.pc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.g2 td.pc:hover{filter:brightness(.97)}
.g2 td.pc .mn{position:absolute;right:4px;bottom:2px;font-size:9.5px;font-weight:700;opacity:.75}
.seats{display:flex;flex-wrap:wrap;gap:3px;min-height:46px;align-content:flex-start}
.g2 tr.free td{font-size:12px;text-align:center;color:var(--text2);padding:6px 0;background:var(--muted)}
.g2 tr.free .name{background:var(--muted)}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.panel .ph{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.panel .ph small{display:block;color:var(--text2);font-size:12px}
.panel .ph .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--text2);padding:0 4px}
.panel .body{overflow:auto;padding:6px 8px 10px}
.panel .tip{padding:10px 14px;color:var(--text2);font-size:12.5px;border-bottom:1px solid var(--border)}
.needrow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2)}
.needrow b{min-width:34px;text-align:center;color:var(--text);font-size:15px}
.needrow button{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface)}
.needrow .cov{margin-left:auto;font-weight:600;padding:3px 8px;border-radius:6px;font-size:12px}
.vrow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:8px}
.vrow:hover{background:var(--muted)}
.vrow .vn{flex:1;min-width:0}
.vrow .vn small{display:block;color:var(--text3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.st-unav{opacity:.5}
.vrow.st-here .vn small{color:var(--ok)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:10px 6px 4px}
.strip{display:flex;gap:1px;margin-top:4px;height:6px}
.strip span{flex:1;border-radius:1px;background:var(--line)}
.strip span.u{background:var(--unav)}
.rost{cursor:pointer}
.rost.on{background:var(--accent-weak)}
.pB{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1100px){.pB{grid-template-columns:1fr}}
.pB .scroller{max-height:76vh}

/* ===== MOBILE ===== */
.mlayout{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.phone{width:392px;height:min(800px,calc(100vh - 150px));min-height:600px;border-radius:46px;padding:11px;background:#0d0f13;box-shadow:0 0 0 2px #2a2e36,0 20px 50px rgba(0,0,0,.25);position:sticky;top:12px}
.screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.phone.bare{width:auto;height:calc(100dvh - 12px);min-height:0;margin:0 -16px;padding:0;border-radius:0;background:none;box-shadow:none;position:relative;top:0}
.phone.bare .screen{border-radius:0}
.m-status{display:flex;justify-content:space-between;padding:12px 26px 2px;font-size:13px;font-weight:600;background:var(--surface);flex:none}
.m-app{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 12px 10px;flex:none}
.m-title{display:flex;align-items:center;gap:10px}
.m-title b{font-size:16px;flex:1}
.m-ib{border:0;background:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.m-ib:disabled{opacity:.35}
.m-seg{display:flex;background:var(--muted);border-radius:10px;padding:3px;margin-top:10px}
.m-seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px;font-weight:600;font-size:13px;color:var(--text2);display:flex;gap:7px;justify-content:center;align-items:center}
.m-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.m-days,.m-tabs,.m-pal{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.m-days::-webkit-scrollbar,.m-tabs::-webkit-scrollbar,.m-pal::-webkit-scrollbar{display:none}
.m-days{margin-top:10px}
.m-chip{flex:none;border:1px solid var(--border);border-radius:999px;padding:7px 13px;white-space:nowrap;background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.m-chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.m-chip em{font-style:normal;font-size:11px;font-weight:700;background:var(--under);color:#fff;border-radius:999px;padding:0 6px;line-height:17px}
.m-chip small{opacity:.7;font-size:11px}
.m-kpis{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--text2)}
.m-kpis b.g{color:var(--ok)} .m-kpis b.r{color:var(--under)}
.m-body{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.m-bottom{flex:none;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px 10px}
.m-hint{font-size:11.5px;color:var(--text3);margin:0 2px 7px}
.m-pal .tool{flex:none;padding:5px 11px 5px 5px;border-radius:999px;font-size:13px}
.m-pal .tool .sw{border-radius:50%;width:26px;height:26px}
.m-pal .tool.mode{background:var(--muted)}
.m-pal .tool.mode.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:none}
.m-pal .tool.mode.on .sw{background:rgba(255,255,255,.2);color:#fff}
.m-row{display:flex;align-items:center;gap:8px}
.m-row .m-hint{margin:0;flex:1}
.m-selbar{display:flex;align-items:center;gap:10px}
.m-selbar>div{flex:1;min-width:0}
.m-selbar small{display:block;color:var(--text2);font-size:12px}
.m-selbar .btn{padding:9px 14px;font-size:13px}
.m-selbar .x{border:0;background:var(--muted);border-radius:50%;width:34px;height:34px;font-size:18px;flex:none}
.m-tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.m-tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--text3);padding:4px}
.m-tabbar button i{font-size:19px}
.m-tabbar button.on{color:var(--accent)}
.m-tabbar button em{font-style:normal;position:relative}
.mside{display:flex;flex-direction:column;gap:14px}
.mcard{padding:18px}
.mcard h3{margin-top:16px}
.pitch-d{margin-top:16px}
.pitch-d summary{cursor:pointer;color:var(--text2);padding:8px 0}
.backdrop{position:absolute;inset:0;background:rgba(10,12,16,.38);z-index:40;animation:fade .15s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:80%;background:var(--surface);border-radius:20px 20px 0 0;z-index:41;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0;flex:none}
.sheet .vrow{padding:9px 6px}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.prow{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.prow .tm{width:92px;flex:none;font-weight:700;font-size:13px}
.prow .tm small{display:block;font-weight:500;color:var(--text3);font-size:11px}
.prow .sw{width:30px;height:30px;border-radius:8px}
.prow.gap{color:var(--text3)}
.prow.gap .sw{background:var(--muted);color:var(--text3)}
.prow.un .sw{background:var(--unav);color:#fff}
.covt{border-collapse:separate;border-spacing:3px}
.covt th{position:sticky;left:0;background:var(--surface);z-index:2;font-size:10px;color:var(--text2);font-weight:600;padding:0 4px}
.covt th.trh{position:static;text-align:left;font-weight:600;color:var(--text);border-left:3px solid var(--accent);background:var(--muted);border-radius:5px;padding:3px 6px;white-space:nowrap}
.covt th.tk{position:static}
.covt td{min-width:38px;text-align:center;border-radius:6px;background:var(--muted);padding:0}
.covt td button{display:block;width:100%;border:0;background:none;height:22px;color:inherit;font-size:15px;line-height:1}
.covt td b{display:block;font-size:10.5px}
.covwrap{overflow-x:auto;padding:4px 2px}
/* grille mobile (1A) */
.g1{border-collapse:separate;border-spacing:0}
.g1 th,.g1 td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.g1 thead th{position:sticky;top:0;background:var(--surface);z-index:5;font-size:10px;font-weight:600;color:var(--text2);padding:7px 0;min-width:38px;height:30px}
.g1 .name{position:sticky;left:0;background:var(--surface);z-index:6;min-width:54px;width:54px;padding:4px 0;text-align:center}
.g1 .name small{display:block;font-size:9.5px;color:var(--text3);font-weight:600}
.g1 .name small.warn{color:var(--over)}
.g1 .name[data-act]{cursor:pointer}
.g1 tr.fx .name{background:var(--accent-weak)}
.g1 thead .name{z-index:8}
.g1 td.c{position:relative;width:38px;height:44px;padding:0;touch-action:pan-x pan-y;cursor:pointer}
.g1.paint td.c{touch-action:none}
.g1 td.c .b{position:absolute;inset:6px 0}
.g1 td.c.f .b{background:var(--c);display:grid;place-items:center;color:#1c2230;font-size:12px}
.g1 td.c.f.rs .b{left:4px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.g1 td.c.f.re .b{right:4px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.g1 td.c.un .b{background:repeating-linear-gradient(135deg,var(--unav) 0 3px,transparent 3px 8px);opacity:.8}
.g1.dimp tr:not(.fx) td.c .b{opacity:.3}
.g1 tfoot td{font-size:10px;text-align:center;height:32px;background:var(--surface)}
.g1 tfoot tr:first-child td{border-top:2px solid var(--border)}
.g1 td.cov{cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
/* zones mobile (2A) */
.m-tabs{padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.m2list{padding:0 10px 14px}
.m2tr{display:flex;align-items:baseline;gap:8px;padding:8px 4px 6px;font-size:12px;color:var(--text2)}
.m2tr b{color:var(--text);font-size:13px}
.m2tr .pill{margin-left:auto;font-size:11px}
.m2row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer}
.m2row .t{width:44px;flex:none;font-weight:700;font-size:13px}
.m2row .t small{display:block;color:var(--text3);font-weight:500;font-size:11px}
.m2row .seats{flex:1;min-height:24px}
.m2row .rt{text-align:right;flex:none}
.m2row .rt small{display:block;font-size:10.5px;color:var(--text3);margin-top:3px}
.m2row.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent);background:var(--accent-weak)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:719px){.toolbar .hint{display:none}.tl-name{width:120px}.brand small{display:none}.tl-sec .btn{left:200px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Planning des bénévoles</h1><small>vue bénévoles ⇄ vue zones · 2 propositions</small></div>
    <div class="seg" id="seg"></div>
    <div class="top-r">
      <div class="seg" id="dev"></div>
      <button class="icon-btn" data-act="undo" id="undoBtn" title="Annuler (Ctrl+Z)"><i class="pi pi-undo"></i>Annuler</button>
    </div>
  </div>
  <div id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- Données (calquées sur le modèle Angular) ---------------- */
const narrow=()=>window.innerWidth<720;
const S={
  prop:'A', mode:'person', device:narrow()?'mobile':'desktop', dayId:'d2', tool:{kind:'CAT',id:'c1'},
  focusVol:null, sel:null, blkSel:null, hist:[], drag:null, sheet:null, personV:null,
  mPaint:false, mCat:'c1', editMin:false,
  cats:[
    {id:'c1',label:'Buvette',icon:'pi pi-credit-card',color:'#C1E1C1'},
    {id:'c2',label:'Lavage',icon:'pi pi-sparkles',color:'#C1D9E1'},
    {id:'c3',label:'Cuisine',icon:'pi pi-shop',color:'#FFDDC1'},
    {id:'c4',label:'Logistique',icon:'pi pi-box',color:'#FFE8B5'}
  ],
  vols:['Charlène','Davy','Dylan','Matthias','Raphael','Kevin','Cathy','Leila','Michael','Papa'].map((l,i)=>({id:'v'+(i+1),label:l})),
  days:[]
};
const mkDay=(id,label,start,end,interval,assigned,tr)=>{
  const d={id,label,start,end,interval,assigned,cells:new Map(),unav:new Set(),needs:{}};
  d.tranches=tr.map(([l,h0,h1,nd])=>({label:l,a:(h0-start)*60/interval,b:(h1-start)*60/interval,nd}));
  return d;
};
const OPEN=[1,0,0,2],MORN=[2,0,1,0],PEAK=[3,1,2,0],AFT=[2,1,1,0],CLOSE=[1,1,0,2];
S.days=[
  mkDay('d1','Vendredi',16,23,60,['v1','v2','v3','v4','v5','v6','v7','v8'],[['Installation',16,18,OPEN],['Soirée',18,21,PEAK],['Clôture',21,23,CLOSE]]),
  mkDay('d2','Samedi',8,19,60,['v1','v2','v3','v4','v5','v6','v7','v8','v9','v10'],[['Ouverture',8,10,OPEN],['Matinée',10,12,MORN],['Midi',12,14,PEAK],['Après-midi',14,17,AFT],['Fermeture',17,19,CLOSE]]),
  mkDay('d3','Dimanche',9,17,30,['v1','v2','v4','v5','v7','v8','v9','v10'],[['Matinée',9,12,MORN],['Midi',12,14,PEAK],['Après-midi',14,16,AFT],['Rangement',16,17,CLOSE]])
];
const K=(v,s)=>v+'::'+s;
const N=d=>Math.round((d.end-d.start)*60/d.interval);
const day=()=>S.days.find(d=>d.id===S.dayId);
const cat=id=>S.cats.find(c=>c.id===id);
const vol=id=>S.vols.find(v=>v.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tl=(d,i)=>{const m=d.start*60+i*d.interval;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const tShort=(d,i)=>{const m=d.start*60+i*d.interval;return m%60?':'+String(m%60).padStart(2,'0'):Math.floor(m/60)+'h'};
const hue=id=>(parseInt(id.slice(1))*67)%360;
const ini=l=>l.slice(0,2);
const av=(v,cls='')=>`<span class="av ${cls}" style="--h:${hue(v.id)}" title="${esc(v.label)}">${esc(ini(v.label))}</span>`;
const fmtH=h=>(Math.round(h*10)/10).toString().replace('.',',')+' h';
const vh=(d,vId)=>{let c=0;for(let i=0;i<N(d);i++) if(d.cells.has(K(vId,i))&&!d.unav.has(K(vId,i)))c++;return c*d.interval/60};
const count=(d,c,i)=>d.assigned.reduce((a,v)=>a+(d.cells.get(K(v,i))===c?1:0),0);
const need=(d,c,i)=>(d.needs[c]||[])[i]||0;
const covSt=(a,n)=>(!a&&!n)?'none':a<n?'under':a===n?'ok':'over';
const holesCat=(d,c)=>{let h=0;for(let i=0;i<N(d);i++)h+=Math.max(0,need(d,c,i)-count(d,c,i));return h};
const trMin=(d,t,c)=>{let m=0;for(let i=t.a;i<t.b;i++)m=Math.max(m,need(d,c,i));return m};
const trCount=(d,t,c)=>{let m=Infinity;for(let i=t.a;i<t.b;i++)m=Math.min(m,count(d,c,i));return m===Infinity?0:m};
const trTotalMin=(d,t)=>{let m=0;for(let i=t.a;i<t.b;i++)m=Math.max(m,S.cats.reduce((s,c)=>s+need(d,c.id,i),0));return m};
function stats(d){
  const n=N(d);let tot=0,ok=0,holes=0,hrs=0;
  for(let i=0;i<n;i++)S.cats.forEach(c=>{const a=count(d,c.id,i),nd=need(d,c.id,i);tot+=nd;ok+=Math.min(a,nd);if(a<nd)holes+=nd-a});
  d.assigned.forEach(v=>hrs+=vh(d,v));
  return {pct:tot?Math.round(ok/tot*100):100,holes,hrs};
}

/* ---------------- Seed déterministe ---------------- */
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function seedDay(d,unav){
  S.cats.forEach(c=>d.needs[c.id]=new Array(N(d)).fill(0));
  d.tranches.forEach(t=>{for(let i=t.a;i<t.b;i++)S.cats.forEach((c,ci)=>d.needs[c.id][i]=t.nd[ci])});
  unav.forEach(([v,a,b])=>{for(let i=a;i<b;i++)d.unav.add(K(v,i))});
  for(let i=0;i<N(d);i++){
    const rem={},used=new Set();S.cats.forEach(c=>rem[c.id]=need(d,c.id,i));
    for(const v of shuffle(d.assigned)){
      if(d.unav.has(K(v,i)))continue;
      const p=d.cells.get(K(v,i-1));
      if(p&&rem[p]>0&&rnd()<.88&&vh(d,v)<5.5){d.cells.set(K(v,i),p);rem[p]--;used.add(v)}
    }
    for(const c of S.cats){
      while(rem[c.id]>0){
        const free=shuffle(d.assigned).filter(v=>!used.has(v)&&!d.unav.has(K(v,i))&&vh(d,v)<6);
        if(!free.length)break;
        rem[c.id]--; if(rnd()<.13)continue;
        d.cells.set(K(free[0],i),c.id);used.add(free[0]);
      }
    }
  }
}
seedDay(S.days[0],[['v3',0,2],['v7',5,7]]);
seedDay(S.days[1],[['v10',0,4],['v5',7,10],['v9',4,6]]);
seedDay(S.days[2],[['v2',0,4],['v8',10,14]]);

  if(t.kind==='UNAV'){d.unav.add(k);d.cells.delete(k);return}
  if(t.kind==='AVAIL'){d.unav.delete(k);return}
  if(d.unav.has(k))return;
  if(t.kind==='CAT')d.cells.set(k,t.id);else d.cells.delete(k);

function runs(d,v){
  const n=N(d),out=[];let cur=null;
  for(let i=0;i<=n;i++){
    const k=K(v,i),key=i<n?(d.unav.has(k)?'UN':(d.cells.get(k)||null)):null;
    if(cur&&cur.cat!==key){cur.b=i;out.push(cur);cur=null}
    if(!cur&&key)cur={cat:key,a:i};
  }
  return out;
}

/* ---- panneau d'affectation ---- */
function rangeStatus(d,v,sel){
  let here=0,free=0,un=0;const busy={};
  for(let i=sel.a;i<=sel.b;i++){const k=K(v,i),c=d.cells.get(k);
    if(d.unav.has(k))un++;else if(c===sel.cat)here++;else if(c)busy[c]=(busy[c]||0)+1;else free++}
  return {here,free,un,busy,len:sel.b-sel.a+1};
}
function panelSel(d,sel){
  const c=cat(sel.cat),len=sel.b-sel.a+1;
  const ns=[];for(let i=sel.a;i<=sel.b;i++)ns.push(need(d,sel.cat,i));
  const mn=Math.min(...ns),mx=Math.max(...ns);
  let a=0,nd=0;for(let i=sel.a;i<=sel.b;i++){a+=count(d,sel.cat,i);nd+=need(d,sel.cat,i)}
  const rows=d.assigned.map(v=>({v:vol(v),s:rangeStatus(d,v,sel)}));
  const rank=r=>r.s.here?0:r.s.free===len?1:r.s.free?2:Object.keys(r.s.busy).length?3:4;
  rows.sort((x,y)=>rank(x)-rank(y));
  const groups=['Dans cette zone','Libres sur toute la plage','Partiellement libres','Dans une autre zone','Indisponibles'];

function cellHtml(d,v,i,r){
  const k=K(v,i),c=d.cells.get(k),un=d.unav.has(k);

    const same=j=>d.cells.get(K(v,j))===c&&!d.unav.has(K(v,j));
    const p=same(i-1),nx=same(i+1);
    cls+=' f'+(p?'':' rs')+(nx?'':' re');st=`style="--c:${cat(c).color}"`;
    if(!p)inner=`<i class="${cat(c).icon}"></i>`;

function render(){
  const keep={};document.querySelectorAll('[data-scroll]').forEach(e=>keep[e.dataset.scroll]=[e.scrollLeft,e.scrollTop]);
  if(S.prop==='A'&&S.mode==='both')S.mode='person';
  document.getElementById('seg').innerHTML=['A','B'].map(p=>`<button data-prop="${p}" class="${S.prop===p?'on':''}"><b>${p}</b>${PITCH[p].t}</button>`).join('');
  document.getElementById('dev').innerHTML=`<button data-dev="desktop" class="${S.device==='desktop'?'on':''}"><i class="pi pi-desktop"></i>Desktop</button><button data-dev="mobile" class="${S.device==='mobile'?'on':''}"><i class="pi pi-mobile"></i>Mobile</button>`;
  document.getElementById('undoBtn').disabled=!S.hist.length;
  let html;
  if(S.device==='mobile')html=renderMobile();
  else html=pitchDesktop()+daybar()+viewbar()+'<main>'+(S.prop==='B'?renderLinked():S.mode==='zone'?renderZonesTable():renderPersons())+'</main>';
  document.getElementById('main').innerHTML=html;
  document.querySelectorAll('[data-scroll]').forEach(e=>{const k=keep[e.dataset.scroll];if(k){e.scrollLeft=k[0];e.scrollTop=k[1]}});
}

/* ---------------- Interactions ---------------- */
const at=(e,sel)=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest(sel)};
const moved=(g,e,px=8)=>Math.hypot(e.clientX-g.x0,e.clientY-g.y0)>px;
function posBlk(el,a,b,W){el.style.left=(a*W+2)+'px';el.style.width=((b-a)*W-4)+'px'}
function desktopDown(e){
  const d=day(),n=N(d);
  if(e.target.closest('.pop,[data-act],button'))return;
  const zc=e.target.closest('[data-zc]');
  if(zc){e.preventDefault();const s=+zc.dataset.s;S.sel={dayId:d.id,cat:zc.dataset.cat,a:s,b:s,anchor:s};S.drag={mode:'sel'};render();return}
  const track=e.target.closest('.track[data-v]');if(!track)return;
  e.preventDefault();
  const W=W3(d),x=(e.clientX-track.getBoundingClientRect().left)/W;
  const blk=e.target.closest('.blk');
  if(blk){
    const r={v:blk.dataset.v,cat:blk.dataset.cat,a:+blk.dataset.a,b:+blk.dataset.b};
    const h=e.target.closest('.h');
    S.drag=h?{mode:'resize',side:h.classList.contains('l')?'l':'r',...r,na:r.a,nb:r.b,el:blk}
            :{mode:'move',...r,off:Math.floor(x)-r.a,tv:r.v,na:r.a,el:blk,x0:e.clientX,y0:e.clientY,moved:false};
  }else{
    if(S.blkSel){S.blkSel=null;render();return}
    const s=Math.min(n-1,Math.floor(x)),g=document.createElement('div');
    const c=S.tool.kind==='CAT'?cat(S.tool.id):null;
    g.className='blk ghost '+(c?'':'un');if(c)g.style.setProperty('--c',c.color);
    track.appendChild(g);
    S.drag={mode:'create',v:track.dataset.v,anchor:s,a:s,b:s+1,el:g};posBlk(g,s,s+1,W);
  }
}
function mobileDown(e){
  if(e.target.closest('.sheet,.backdrop,.m-bottom,.m-app,.m-tabs,.m-tabbar,[data-act]'))return;
  const d=day(),x0=e.clientX,y0=e.clientY;
  if(S.mode!=='zone'){
    const td=e.target.closest('.g1 td.c');if(!td)return;
    if(S.mPaint){e.preventDefault();snap();S.drag={mode:'paint',last:td.dataset.v+td.dataset.s};applyTool(d,td.dataset.v,+td.dataset.s);render()}
    else S.drag={mode:'tap',kind:'cell',v:td.dataset.v,s:+td.dataset.s,x0,y0};
  }else{
    const row=e.target.closest('.m2row');if(!row)return;
    S.drag={mode:'tap',kind:'zone',s:+row.dataset.s,x0,y0};
  }
}
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  S.device==='mobile'?mobileDown(e):desktopDown(e);
});
window.addEventListener('pointermove',e=>{
  const g=S.drag;if(!g)return;const d=day(),n=N(d);
  switch(g.mode){
    case 'tap': if(moved(g,e))S.drag=null; break;
    case 'paint':{const td=at(e,'.g1 td.c');if(!td)return;const key=td.dataset.v+td.dataset.s;if(key===g.last)return;g.last=key;applyTool(d,td.dataset.v,+td.dataset.s);render();break}
    case 'sel':{const td=at(e,`[data-zc][data-cat="${S.sel.cat}"]`);if(!td)return;const s=+td.dataset.s,a=Math.min(S.sel.anchor,s),b=Math.max(S.sel.anchor,s);if(a!==S.sel.a||b!==S.sel.b){S.sel.a=a;S.sel.b=b;render()}break}
    case 'create':{const W=W3(d),s=Math.max(0,Math.min(n-1,Math.floor((e.clientX-g.el.parentNode.getBoundingClientRect().left)/W)));g.a=Math.min(g.anchor,s);g.b=Math.max(g.anchor,s)+1;posBlk(g.el,g.a,g.b,W);break}
    case 'resize':{const W=W3(d),x=Math.round((e.clientX-g.el.parentNode.getBoundingClientRect().left)/W);
      if(g.side==='l')g.na=Math.max(0,Math.min(g.b-1,x));else g.nb=Math.max(g.a+1,Math.min(n,x));posBlk(g.el,g.na,g.nb,W);break}
    case 'move':{
      if(!g.moved&&!moved(g,e,5))return;
      const W=W3(d);
      if(!g.moved){g.moved=true;g.el.classList.add('drag');S.blkSel=null;const p=g.el.querySelector('.pop');p&&p.remove()}
      const tr=at(e,'.track[data-v]');if(tr&&tr!==g.el.parentNode){tr.appendChild(g.el);g.tv=tr.dataset.v}
      const len=g.b-g.a;g.na=Math.max(0,Math.min(n-len,Math.floor((e.clientX-g.el.parentNode.getBoundingClientRect().left)/W)-g.off));posBlk(g.el,g.na,g.na+len,W);break}
  }
});
function setRange(d,v,a,b,c){for(let i=a;i<b;i++){const k=K(v,i);if(c==='UN'){d.unav.add(k);d.cells.delete(k)}else if(!d.unav.has(k))d.cells.set(k,c)}}
function clearRange(d,v,a,b,c){for(let i=a;i<b;i++){const k=K(v,i);if(c==='UN')d.unav.delete(k);else if(d.cells.get(k)===c)d.cells.delete(k)}}
window.addEventListener('pointerup',()=>{
  const g=S.drag;if(!g)return;S.drag=null;const d=day();
  switch(g.mode){
    case 'create': snap();setRange(d,g.v,g.a,g.b,S.tool.kind==='CAT'?S.tool.id:'UN');break;
    case 'resize': if(g.na!==g.a||g.nb!==g.b){snap();clearRange(d,g.v,g.a,g.b,g.cat);setRange(d,g.v,g.na,g.nb,g.cat);S.blkSel=null}break;
    case 'move':
      if(!g.moved){S.blkSel=isSel(g.v,g)?null:{v:g.v,cat:g.cat,a:g.a,b:g.b};break}
      if(g.tv!==g.v||g.na!==g.a){snap();clearRange(d,g.v,g.a,g.b,g.cat);setRange(d,g.tv,g.na,g.na+(g.b-g.a),g.cat);
        if(g.tv!==g.v)toast(`${g.cat==='UN'?'Indisponibilité':cat(g.cat).label} réaffecté·e à ${vol(g.tv).label}`)}
      break;
    case 'tap':
      if(g.kind==='cell'){snap();applyTool(d,g.v,g.s)}
      else{
        const s=g.s,cur=S.sel&&S.sel.dayId===d.id&&S.sel.cat===S.mCat?S.sel:null;
        if(!cur)S.sel={dayId:d.id,cat:S.mCat,a:s,b:s,anchor:s};
        else if(cur.a===cur.b){if(s===cur.a)S.sel=null;else{cur.a=Math.min(cur.a,s);cur.b=Math.max(cur.b,s)}}
        else S.sel={dayId:d.id,cat:S.mCat,a:s,b:s,anchor:s};
      }
      break;
  }
  render();
});
const cancelDrag=()=>{const g=S.drag;if(!g)return;S.drag=null;if(g.mode!=='tap')render()};
window.addEventListener('pointercancel',cancelDrag);
window.addEventListener('blur',cancelDrag);

document.addEventListener('click',e=>{
  if(!document.contains(e.target))return;
  const t=e.target.closest('[data-prop],[data-mode],[data-day],[data-tool],[data-act],[data-dev],[data-mcat]');if(!t)return;const d=day();
  if(t.dataset.prop){S.prop=t.dataset.prop;S.blkSel=null;S.sheet=null;if(S.prop==='B'&&S.device==='desktop'&&S.mode==='person')S.mode='both';return render()}
  if(t.dataset.mode){S.mode=t.dataset.mode;S.blkSel=null;S.sheet=null;return render()}
  if(t.dataset.dev){S.device=t.dataset.dev;S.blkSel=null;S.sheet=null;if(S.device==='mobile'&&S.mode==='both')S.mode='person';return render()}
  if(t.dataset.day){S.dayId=t.dataset.day;S.sel=null;S.blkSel=null;S.sheet=null;return render()}
  if(t.dataset.mcat){S.mCat=t.dataset.mcat;S.sel=null;return render()}
  if(t.dataset.tool){S.tool={kind:t.dataset.tool,id:t.dataset.id};return render()}
  const a=t.dataset.act,v=t.dataset.v,sel=S.sel,b=S.blkSel;
  switch(a){
    case 'undo': return undo();
    case 'mpaint': S.mPaint=!S.mPaint;break;
    case 'sheet': S.sheet=t.dataset.sheet;break;
    case 'closeSheet': S.sheet=null;break;
    case 'editmin': S.editMin=!S.editMin;break;
    case 'nd+': case 'nd-':{snap();const c=t.dataset.cat,s=+t.dataset.s;d.needs[c][s]=Math.max(0,need(d,c,s)+(a==='nd+'?1:-1));break}
    case 'closeSel': S.sel=null;S.sheet=null;break;
    case 'focus': S.focusVol=S.focusVol===v?null:v;if(S.device==='mobile')S.sheet=null;break;
    case 'person': S.personV=v;S.focusVol=v;S.sheet='person';break;
    case 'gozone':{S.mode='zone';S.focusVol=v;S.sheet=null;const r=runs(d,v).find(x=>x.cat!=='UN');if(r)S.mCat=r.cat;break}
    case 'need+': case 'need-':
      snap();for(let i=sel.a;i<=sel.b;i++)d.needs[sel.cat][i]=Math.max(0,need(d,sel.cat,i)+(a==='need+'?1:-1));break;
    case 'add': case 'force': case 'rm':
      snap();
      for(let i=sel.a;i<=sel.b;i++){const k=K(v,i),c=d.cells.get(k);if(d.unav.has(k))continue;
        if(a==='rm'){if(c===sel.cat)d.cells.delete(k)}else if(a==='force'||!c)d.cells.set(k,sel.cat)}
      toast(`${vol(v).label} ${a==='rm'?'retiré·e de':'→'} ${cat(sel.cat).label}`);break;
    case 'recat': case 'del':
      if(!b)return;snap();clearRange(d,b.v,b.a,b.b,b.cat);
      if(a==='recat')setRange(d,b.v,b.a,b.b,t.dataset.cat);else toast('Créneau supprimé');
      S.blkSel=null;break;
    default: return;
  }
  render();
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();return undo()}
  const num=parseInt(e.key);
  if(num>=1&&num<=S.cats.length){S.tool={kind:'CAT',id:S.cats[num-1].id};return render()}
  if(e.key.toLowerCase()==='x'){S.tool={kind:'UNAV'};return render()}
  if(e.key==='Escape'){S.sel=null;S.blkSel=null;S.focusVol=null;S.sheet=null;return render()}
  if((e.key==='Delete'||e.key==='Backspace')&&S.blkSel){const d=day(),b=S.blkSel;snap();clearRange(d,b.v,b.a,b.b,b.cat);S.blkSel=null;render()}
});
let wasNarrow=narrow();
window.addEventListener('resize',()=>{if(narrow()!==wasNarrow){wasNarrow=narrow();render()}});
render();
</script>
