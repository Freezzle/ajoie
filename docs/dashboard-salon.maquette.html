<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ajoie · Statistiques du salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --backdrop:#E6EAE5; --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#F5F7F4;
  --line:#DFE3DD; --line-strong:#C8CEC6; --fg:#1B1F1C; --muted:#59625C;
  --accent:#1F5C4F; --accent-hover:#174A3F; --accent-soft:#E1EEE9; --accent-line:#9CC3B7; --accent-fg:#FFFFFF;
  --danger:#B3261E; --danger-soft:#FBE9E7; --warn:#8A5A00; --warn-soft:#FBF1DA; --ok:#1B6B37; --frame:#1B1F1C;
  --st-ver:#B07A12; --st-ok:#2C7A4B; --st-out:#B3261E;
  --s-paid:#2C7A4B; --s-disc:#7FB596; --s-rest:#D5DAD3;
  --prev:#9AA39C;
  --shadow:0 24px 60px rgba(20,30,25,.16),0 2px 6px rgba(20,30,25,.06);
  --font-ui:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Bricolage Grotesque','Figtree',ui-sans-serif,system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.num{font-variant-numeric:tabular-nums}

/* ── Page de démonstration ── */
.page{max-width:1240px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top h1{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:68ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px}
.ctl-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:36px;padding:0 13px;border:0;border-radius:9px;background:transparent;font-size:14px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tab{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.tab:hover{border-color:var(--line-strong)}
.tab[aria-selected="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11.5px 13.5px}
.tab-n{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"] .tab-n{color:var(--accent)}
.tab-t{font-family:var(--font-display);font-size:17px;font-weight:700}
.tab-d{font-size:13px;color:var(--muted)}
@media (max-width:860px){.tabs{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--backdrop);border-radius:18px;padding:28px 16px;display:flex;justify-content:center;align-items:flex-start}
.viewport{container-type:inline-size;container-name:vp;width:100%;display:flex;justify-content:center}
.viewport.mobile{width:390px;max-width:100%;height:820px;border:10px solid var(--frame);border-radius:44px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
@media (max-width:560px){.stage{padding:0;background:transparent}.viewport.mobile{border:0;border-radius:0;box-shadow:none}}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.notes summary{font-family:var(--font-display);font-weight:700;font-size:15px;cursor:pointer}
.notes ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.notes li{margin-bottom:5px}.notes li b{color:var(--fg)}

/* ── Application ── */
.app{position:relative;width:100%;max-width:1200px;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.viewport.mobile .app{height:100%;border:0;border-radius:0;box-shadow:none;overflow-y:auto}
.app-head{display:flex;align-items:center;gap:12px;padding:18px 24px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.app-head .tt{flex:1;min-width:0}
.app-head h2{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.app-head .ss{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-head .ss b{color:var(--fg);font-weight:600}
.head-acts{display:flex;gap:8px;align-items:center;position:relative}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:0;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn-quiet{background:var(--surface);color:var(--fg);border:1.5px solid var(--line-strong);font-weight:600}
.btn-quiet:hover{border-color:var(--fg)}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-icon{width:40px;padding:0;justify-content:center}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.omenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none}
.omenu.on{display:block}
.omenu button{display:flex;width:100%;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:none;font-size:14px;font-weight:500;text-align:left}
.omenu button:hover{background:var(--surface-2)}
.omenu button svg{color:var(--muted)}
.body{padding:18px 24px 24px;display:flex;flex-direction:column;gap:14px}

/* Cartes */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .lnk{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--accent);background:none;border:0;padding:0;display:inline-flex;gap:4px;align-items:center}
.card-h .lnk:hover{text-decoration:underline;text-underline-offset:3px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Tuiles KPI */
.kpi{gap:6px;padding:14px 16px}
.kpi .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-family:var(--font-ui);font-size:15px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.delta{font-weight:700;font-size:12px;border-radius:999px;padding:1px 7px;background:var(--surface-2);color:var(--fg)}
.delta.up{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.delta.down{color:var(--danger);background:var(--danger-soft)}

/* Barres empilées / horizontales */
.stack{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:transparent}
.stack.thin{height:8px}
.stack i{display:block;height:100%;min-width:3px;cursor:default}
.stack i:first-child{border-radius:4px 0 0 4px}.stack i:last-child{border-radius:0 4px 4px 0}
.stack i:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hbar .val small{font-weight:500;color:var(--muted)}
.track{display:flex;gap:2px;height:10px}
.track i{display:block;height:100%;border-radius:0}
.track i:first-child{border-radius:2px 0 0 2px}
.track i:last-child{border-radius:0 4px 4px 0}
.track i:only-child{border-radius:2px 4px 4px 2px}

/* Chiffres en liste */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.fig{display:flex;flex-direction:column;gap:1px;min-width:0}
.fig b{font-family:var(--font-display);font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.fig span{font-size:12.5px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.rowkv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.rowkv:last-child{border-bottom:0}
.rowkv span{color:var(--muted)}
.rowkv b{font-variant-numeric:tabular-nums}
.rowkv b.bad{color:var(--danger)}

/* Graphique ligne */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--font-ui)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .cur{fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round}
.chart .prev{fill:none;stroke:var(--prev);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.chart .area{fill:color-mix(in srgb,var(--accent) 10%,transparent)}
.chart .today{stroke:var(--fg);stroke-width:1;stroke-dasharray:3 3}
.chart .salon{stroke:var(--ok);stroke-width:1.5}
.chart .lbl{font-size:11px;font-weight:700;font-family:var(--font-ui)}
.chart .xh{stroke:var(--fg);stroke-width:1;opacity:0}
.chart .dot{opacity:0}
.chart.hov .xh,.chart.hov .dot{opacity:1}
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .08s;max-width:240px}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.tip .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* Sensibles masqués */
.masked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:1.5px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:13.5px;text-align:center;padding:16px}
.masked b{color:var(--fg)}

/* Bandeau de phase */
.phase{display:flex;flex-direction:column;gap:10px}
.phase .rail{position:relative;height:36px;margin:14px 6px 0}
.phase .rail .bar{position:absolute;left:0;right:0;top:15px;height:6px;border-radius:99px;background:var(--line)}
.phase .rail .done{position:absolute;left:0;top:15px;height:6px;border-radius:99px;background:var(--accent)}
.phase .ms{position:absolute;top:9px;transform:translateX(-50%);width:18px;height:18px;border-radius:99px;background:var(--surface);border:2.5px solid var(--line-strong)}
.phase .ms.past{border-color:var(--accent);background:var(--accent)}
.phase .ms.salon{border-color:var(--ok)}
.phase .tk{position:absolute;top:12px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);background:var(--surface);border:2px solid var(--muted);border-radius:2px}
.phase .tk.late{border-color:var(--danger);background:var(--danger-soft)}
.phase .now{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);transform:translateX(-50%)}
.phase .now span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;margin-bottom:2px}
.phase .labels{position:relative;height:34px;margin:0 6px}
.phase .labels div{position:absolute;transform:translateX(-50%);text-align:center;font-size:12px;line-height:1.3;white-space:nowrap}
.phase .labels div:first-child{transform:none;text-align:left}
.phase .labels div:last-child{transform:translateX(-100%);text-align:right}
.phase .labels b{display:block;font-size:12.5px}
.phase .labels span{color:var(--muted)}

/* Compte à rebours */
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .big{font-family:var(--font-display);font-size:52px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count .big small{font-size:20px;color:var(--muted);font-weight:600}
.count span{color:var(--muted);font-size:14px}

/* Liste de priorités */
.todo{display:flex;flex-direction:column;gap:8px}
.ti{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.ti:hover{border-color:var(--line-strong);box-shadow:0 2px 8px -4px rgba(20,30,25,.18)}
.ti .n{font-family:var(--font-display);font-size:24px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--c)}
.ti .t{font-weight:600;font-size:14.5px}
.ti .t small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:1px}
.ti .go{color:var(--muted)}
.ti.crit{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.tag.crit{background:var(--danger-soft);color:var(--danger)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--surface-2);color:var(--muted)}
.ti.done{opacity:.55}
.ti.done .n{color:var(--ok)}

/* Progressions */
.prog{display:flex;flex-direction:column;gap:12px}
.pg{display:flex;flex-direction:column;gap:5px}
.pg .l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.pg .l b{font-variant-numeric:tabular-nums}
.pg .l span{color:var(--muted)}
.pg .t{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pg .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pg.ok .t i{background:var(--ok)}

/* Tâches */
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.task:last-child{border-bottom:0}
.task .due{font-size:12px;font-weight:700;white-space:nowrap}
.task .due.late{color:var(--danger)}
.task .due.soon{color:var(--warn)}
.task .who{font-size:12px;color:var(--muted)}
.task .ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong)}

/* Commande logistique */
.order{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.order div{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2)}
.order b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.order span{font-size:12px;color:var(--muted)}
.order small{display:block;font-size:11.5px;color:var(--warn);font-weight:600}

/* Proposition C : rapport */
.rtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{padding:10px 14px 11px;border:0;background:none;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.rtabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--fg)}
.rbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rbar label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.rbar select{height:36px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 10px;font-size:13.5px}
table.rep{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.rep th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
table.rep th:first-child{text-align:left}
table.rep th .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}
table.rep td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rep td:first-child{text-align:left;white-space:normal}
table.rep tr:hover td{background:var(--surface-2)}
table.rep td.z{color:var(--line-strong)}
table.rep td.mix{width:30%;min-width:120px}
table.rep td.dv{font-size:12.5px}
table.rep td.dv.up{color:var(--ok)}
table.rep td.dv.down{color:var(--danger)}
table.rep tfoot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--line-strong)}
.repmob{display:none;flex-direction:column;gap:8px}
.rm{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.rm .h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.rm .h b{font-variant-numeric:tabular-nums}
.rm .c{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:4px}
.rm .c b{color:var(--fg);font-variant-numeric:tabular-nums}
.rm .stack{margin-top:8px}

.ftoast{position:fixed;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;bottom:24px;z-index:120;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:all .22s}
.ftoast.on{opacity:1;transform:translate(-50%,0)}


/* ── Hebdo ── */
.brief{gap:6px;background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.brief .lead{margin:0;font-family:var(--font-display);font-size:21px;line-height:1.4;font-weight:600;letter-spacing:-.005em}
.brief .lead b{font-weight:700}
.brief .lead b.bad{color:var(--danger)}
.wk{gap:6px}
.wkrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wkv{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wkv small{font-family:var(--font-ui);font-size:14px;color:var(--muted);font-weight:600}
.spark{width:120px;height:34px;flex:none}
.spark rect:hover{opacity:.8}
.evg{display:flex;flex-direction:column;gap:4px}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ev:last-child{border-bottom:0}
.evi{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.evd{font-size:12px;color:var(--muted);white-space:nowrap}
.evt b{font-weight:600}
/* ── Parcours ── */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}

function bindChart(id){

  const x=w=>L+(w-WK_MIN)/(0-WK_MIN)*(W-L-Rr), y=v=>T+(1-v/maxY)*(H-T-Bm);

function timeChart(id,key,opt={}){
  if(key==="pay"&&SENS) return `<div class="masked">${IC.eye}<b>Montants masqués</b>Le mode discret est actif.</div>`;
  const se=SERIES[key], data=se.data(), ref=se.ref&&se.ref();
  const mob=DEV==="mobile", W=mob?340:(opt.wide?760:560), H=opt.h||(mob?190:200), L=mob?34:40, Rr=10, T=18, Bm=opt.noX?6:24;
  const top=Math.max(ref?ref.v:0,...data.map(p=>p[1]));
  const step=key==="pay"?(top>8000?2500:1000):(top>20?10:5), maxY=Math.ceil(top*1.08/step)*step;
  const x=w=>L+(w-CMIN)/CSPAN*(W-L-Rr), y=v=>T+(1-v/maxY)*(H-T-Bm);
  const path=data.map(([w,v],i)=>(i?"L":"M")+x(w).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=path+` L${x(data.at(-1)[0]).toFixed(1)} ${y(0)} L${x(data[0][0]).toFixed(1)} ${y(0)} Z`;
  let g=""; for(let v=0;v<=maxY;v+=step) g+=`<line class="grid-l" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${se.axis(v)}</text>`;
  let xt=""; if(!opt.noX){ const a=D(dOfW(CMIN)),b=D(dOfW(CMAX)),months=[]; for(let d=new Date(a.getFullYear(),a.getMonth()+1,1,12);d<=b;d.setMonth(d.getMonth()+1)) months.push(d.toISOString().slice(0,10));
    months.filter((m,i)=>!mob||i%2===0).forEach(m=>{xt+=`<text class="ax" x="${x(wOf(m))}" y="${H-6}" text-anchor="middle">${MO[D(m).getMonth()]}</text>`}) }
  const mk=[[SALON.regClose,"clôture","today"],[SALON.start,"salon","salon"]].filter(([d])=>wOf(d)>=CMIN&&wOf(d)<=CMAX);
  const last=data.at(-1);
  CHARTS[id]={key,x,y,W,data,se};
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${se.label}">
    ${g}<line class="base" x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}"/>${xt}
    ${mk.map(([d,l,c])=>`<line class="${c}" x1="${x(wOf(d))}" x2="${x(wOf(d))}" y1="${T}" y2="${y(0)}" data-tip="${l==="salon"?"Salon · "+fmtD(SALON.start):"Clôture des inscriptions · "+fmtD(SALON.regClose)}"/>`).join("")}
    ${ref?`<line x1="${L}" x2="${W-Rr}" y1="${y(ref.v)}" y2="${y(ref.v)}" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="4 4"/><text class="lbl" x="${L+6}" y="${y(ref.v)-6}" fill="var(--muted)">${ref.label}</text>`:""}
    <path d="${area}" fill="color-mix(in srgb,${se.color} 11%,transparent)"/><path d="${path}" fill="none" stroke="${se.color}" stroke-width="2.25" stroke-linejoin="round"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4.5" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>
    <text class="lbl" x="${x(last[0])-8}" y="${y(last[1])-9}" text-anchor="end" fill="var(--fg)">${key==="pay"?chf(last[1]):last[1]}</text>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${y(0)}"/><circle class="dot" r="4" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>
    <rect class="hit" x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-Bm}" fill="transparent"/></svg></div>`;
}
function bindCharts(group){
  const ids=Object.keys(CHARTS).filter(id=>document.getElementById(id));
  const setAt=(targets,w,e)=>{ const lines=[];
    ids.forEach(id=>{ if(!targets.includes(id)) document.getElementById(id).classList.remove("hov") });
    targets.forEach(id=>{const c=CHARTS[id],el=document.getElementById(id),p=c.data.find(d=>d[0]===w); el.classList.toggle("hov",!!p); if(!p)return;
      const xh=el.querySelector(".xh"),dot=el.querySelector(".dot"); xh.setAttribute("x1",c.x(w));xh.setAttribute("x2",c.x(w));dot.setAttribute("cx",c.x(w));dot.setAttribute("cy",c.y(p[1]));
      lines.push(`<span class="k" style="background:${c.se.color}"></span>${c.se.label} : <b>${c.se.fmt(p[1])}</b>`)});
    lines.length?showTip(e,`<b>Semaine du ${fmtD(dOfW(w))}</b><br>${lines.join("<br>")}`):hideTip(); };
  ids.forEach(id=>{const c=CHARTS[id],el=document.getElementById(id),svg=el.querySelector("svg"),hit=el.querySelector(".hit"); if(!hit)return;
    hit.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*c.W,L=+hit.getAttribute("x"),Wd=+hit.getAttribute("width");
      const w=Math.max(CMIN,Math.min(CMAX,Math.round(CMIN+(px-L)/Wd*CSPAN))); setAt(group?ids:[id],w,e)});
    hit.addEventListener("pointerleave",()=>{ids.forEach(o=>document.getElementById(o)?.classList.remove("hov"));hideTip()});
  });
}
