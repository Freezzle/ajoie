<div class="vswitch" [class.is-full-width]="fullWidth()" role="radiogroup" (keydown)="onKeydown($event)">
    @for (option of options(); track option.value) {
        <button type="button"
                role="radio"
                [attr.aria-checked]="option.value === value()"
                [class.on]="option.value === value()"
                [disabled]="isDisabled()"
                [tabindex]="option.value === value() ? 0 : -1"
                (click)="select(option)">
            @if (option.icon) {
                <i [class]="option.icon"></i>
            }
            <span class="text-truncate">{{ option.labelKey | translate }}</span>
            @if (option.count !== undefined) {
                <span class="vswitch-count">{{ option.count }}</span>
            }
        </button>
    }
</div>
