<div class="radio-box" role="radiogroup" [attr.aria-labelledby]="'label_' + fieldName">
    @if (translateKey) {
        <div class="radio-box-label" [id]="'label_' + fieldName">{{ translateKey | translate }}</div>
    }
    <div class="radio-box-options">
        @for (option of options; track option) {
            <label class="radio-box-option" [class.selected]="value === option">
                <input type="radio"
                       [name]="'field_' + fieldName"
                       [value]="option"
                       [checked]="value === option"
                       [disabled]="disabled"
                       (change)="select(option)"/>
                <span>{{ needTranslation ? (getLabel(option) | translate) : getLabel(option) }}</span>
                @if (getHint(option); as hint) {
                    <small [title]="hint" class="radio-box-hint">{{ hint }}</small>
                }
            </label>
        }
    </div>
</div>
@if (control && control.errors) {
    <error-box [formControlElement]="control"/>
}
