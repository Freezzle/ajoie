<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h4>Salles</h4>
            <button (click)="addRoom()" icon="pi pi-plus" label="Ajouter" pButton size="small" type="button"></button>
        </div>

        <p-table [rowHover]="true" [rowTrackBy]="trackById" [value]="rooms()" class="mt-4" dataKey="id">
            <ng-template pTemplate="header">
                <tr>
                    <th>Libellé</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template let-room pTemplate="body">
                <tr>
                    <td>
                        <input
                                (blur)="commitRoomLabel(room.id)"
                                (ngModelChange)="setRoomLabelDraft(room.id, $event)"
                                [ngModel]="roomLabel(room)"
                                fluid="true"
                                pInputText
                        />
                    </td>
                    <td>
                        <button
                                (click)="deleteRoom(room.id)" class="p-button-text p-button-danger" icon="pi pi-trash"
                                pButton
                                type="button"
                        ></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
