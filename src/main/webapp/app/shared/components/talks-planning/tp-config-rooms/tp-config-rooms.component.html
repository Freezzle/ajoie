<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h4>Salles</h4>
            <button pButton type="button" icon="pi pi-plus" size="small" label="Ajouter" (click)="addRoom()"></button>
        </div>

        <p-table class="mt-4" [value]="rooms()" dataKey="id" [rowTrackBy]="trackById" [rowHover]="true">
            <ng-template pTemplate="header">
                <tr>
                    <th>Libellé</th>
                    <th>Actions</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-room>
                <tr>
                    <td>
                        <input
                                pInputText
                                fluid="true"
                                [ngModel]="roomLabel(room)"
                                (ngModelChange)="setRoomLabelDraft(room.id, $event)"
                                (blur)="commitRoomLabel(room.id)"
                        />
                    </td>
                    <td>
                        <button
                                pButton type="button" icon="pi pi-trash"
                                class="p-button-text p-button-danger"
                                (click)="deleteRoom(room.id)"
                        ></button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
