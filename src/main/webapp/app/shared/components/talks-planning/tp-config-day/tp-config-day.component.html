<div class="row">
    <div *ngIf="day() as day; else missing" class="col-12">
        <div class="mt-3">
            <label>Libellé</label>
            <input
                    (blur)="commitDayLabel(day.id)"
                    (ngModelChange)="setDayLabelDraft(day.id, $event)"
                    [ngModel]="dayLabel(day)"
                    fluid="true"
                    pInputText
            />
        </div>

        <p-divider></p-divider>

        <h4>Affectations</h4>
        <div class="mt-4">
            <p-table [rowHover]="true" [rowTrackBy]="trackByRoomId" [value]="selectedDayRoomRows()">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Salle</th>
                        <th>Début</th>
                        <th>Fin</th>
                        <th>Actions</th>
                    </tr>
                </ng-template>

                <ng-template let-row pTemplate="body">
                    <tr>
                        <td>{{ row.roomLabel }}</td>

                        <td>
                            <p-datepicker
                                    (ngModelChange)="updateRoomTime(row.roomId, $event, row.endingHour)"
                                    [appendTo]="'body'"
                                    [ngModel]="row.startingHour"
                                    [showIcon]="true"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                            ></p-datepicker>
                        </td>

                        <td>
                            <p-datepicker
                                    (ngModelChange)="updateRoomTime(row.roomId, row.startingHour, $event)"
                                    [appendTo]="'body'"
                                    [ngModel]="row.endingHour"
                                    [showIcon]="true"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                            ></p-datepicker>
                        </td>

                        <td>
                            <button
                                    (click)="removeRoomFromDay(row.roomId)" class="p-button-text p-button-danger" icon="pi pi-trash"
                                    pButton
                                    type="button"
                            ></button>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="footer">
                    <tr>
                        <td>
                            <p-select
                                    [formControl]="addRoomToDayForm.controls.roomId"
                                    [options]="availableRoomsForDay()"
                                    appendTo="body"
                                    fluid="true"
                                    optionLabel="label"
                                    optionValue="id"
                                    placeholder="Choisir une salle"
                            ></p-select>
                        </td>
                        <td>
                            <p-datepicker
                                    [appendTo]="'body'"
                                    [formControl]="addRoomToDayForm.controls.startingHour"
                                    [showIcon]="true"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                            ></p-datepicker>
                        </td>
                        <td>
                            <p-datepicker
                                    [appendTo]="'body'"
                                    [formControl]="addRoomToDayForm.controls.endingHour"
                                    [showIcon]="true"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                            ></p-datepicker>
                        </td>
                        <td>
                            <button (click)="addRoomToDay()" icon="pi pi-plus" label="Attribuer" pButton size="small"
                                    type="button"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <ng-template #missing>
        <div class="col-12 p-text-secondary">
            Jour introuvable (selectedDayId non présent dans data.days).
        </div>
    </ng-template>
</div>
