<button (click)="onClick()"
  [class.disabled]="isDisabled"
  [title]="translateKey | translate"
  class="btn {{colorButton}} btn-sm"
  type="{{isSubmit ? 'submit' : 'button'}}">
  @if (faIcon) {
    <fa-icon [animation]="faIconAnimation" [icon]="faIcon"></fa-icon>
  }
  @if (showText) {
    <span jhiTranslate="{{translateKey}}">Edit</span>
  }
</button>
