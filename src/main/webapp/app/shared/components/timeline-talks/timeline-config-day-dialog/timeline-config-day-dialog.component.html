<div class="row">
    <div class="col-12" *ngIf="selectedDay() as day; else missing">
        <div class="mt-3">
            <label>Libellé</label>
            <input
                    pInputText
                    fluid="true"
                    [ngModel]="dayLabel(day)"
                    (ngModelChange)="setDayLabelDraft(day.id, $event)"
                    (blur)="commitDayLabel(day.id)"
            />
        </div>

        <div class="col-12 mt-4">
            <p-divider></p-divider>
        </div>

        <h4>Période du jour</h4>

        <div class="row mt-3">
            <div class="col-6">
                <label>Début</label>
                <p-datepicker
                        [formControl]="dayPeriodForm.controls.startingHour"
                        [showTime]="true"
                        [timeOnly]="true"
                        hourFormat="24"
                        [showIcon]="true"
                        [appendTo]="'body'"
                ></p-datepicker>
            </div>
            <div class="col-6">
                <label>Fin</label>
                <p-datepicker
                        [formControl]="dayPeriodForm.controls.endingHour"
                        [showTime]="true"
                        [timeOnly]="true"
                        hourFormat="24"
                        [showIcon]="true"
                        [appendTo]="'body'"
                ></p-datepicker>
            </div>
        </div>
    </div>

    <ng-template #missing>
        <div class="col-12 p-text-secondary">
            Jour introuvable (selectedDayId non présent dans data.days).
        </div>
    </ng-template>
</div>
