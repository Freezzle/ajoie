<div class="row">
    <div class="col-12" *ngIf="day() as day; else missing">
        <h4>Affectations</h4>
        <div class="mt-4">
            <p-table [value]="selectedDayRoomRows()" [rowTrackBy]="trackByRoomId" [rowHover]="true">
                <ng-template pTemplate="header">
                    <tr>
                        <th>Salle</th>
                        <th>Début</th>
                        <th>Fin</th>
                        <th>Actions</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td>{{ row.roomLabel }}</td>

                        <td>
                            <p-datepicker
                                    [ngModel]="row.startingHour"
                                    (ngModelChange)="updateRoomTime(row.roomId, $event, row.endingHour)"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                                    [appendTo]="'body'"
                                    [showIcon]="true"
                            ></p-datepicker>
                        </td>

                        <td>
                            <p-datepicker
                                    [ngModel]="row.endingHour"
                                    (ngModelChange)="updateRoomTime(row.roomId, row.startingHour, $event)"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                                    [appendTo]="'body'"
                                    [showIcon]="true"
                            ></p-datepicker>
                        </td>

                        <td>
                            <button
                                    pButton type="button" icon="pi pi-trash"
                                    class="p-button-text p-button-danger"
                                    (click)="removeRoomFromDay(row.roomId)"
                            ></button>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="footer">
                    <tr>
                        <td>
                            <p-select
                                    [options]="availableRoomsForDay()"
                                    optionLabel="label"
                                    optionValue="id"
                                    [formControl]="addRoomToDayForm.controls.roomId"
                                    fluid="true"
                                    appendTo="body"
                                    placeholder="Choisir une salle"
                            ></p-select>
                        </td>
                        <td>
                            <p-datepicker
                                    [formControl]="addRoomToDayForm.controls.startingHour"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                                    [showIcon]="true"
                                    [appendTo]="'body'"
                            ></p-datepicker>
                        </td>
                        <td>
                            <p-datepicker
                                    [formControl]="addRoomToDayForm.controls.endingHour"
                                    [showTime]="true"
                                    [timeOnly]="true"
                                    hourFormat="24"
                                    [showIcon]="true"
                                    [appendTo]="'body'"
                            ></p-datepicker>
                        </td>
                        <td>
                            <button pButton type="button" size="small" icon="pi pi-plus" label="Attribuer" (click)="addRoomToDay()"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <ng-template #missing>
        <div class="col-12 p-text-secondary">
            Jour introuvable (selectedDayId non présent dans data.days).
        </div>
    </ng-template>
</div>
