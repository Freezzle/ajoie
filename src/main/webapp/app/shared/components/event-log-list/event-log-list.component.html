@if (items().length > 0) {
    <ul class="list-group w-100">
        @for (event of items(); track event.id) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div class="d-flex flex-grow-1 align-items-center gap-2">
                    <small [class.invisible]="!event.showDate"
                           class="text-muted text-nowrap date-col">
                        {{ event.referenceDate | date:'dd.MM.yyyy' }}
                    </small>

                    <small class="text-muted text-nowrap time-col">
                        {{ event.referenceDate | date:'HH:mm' }}
                    </small>

                    <div class="flex-grow-1">
                        <fa-icon [icon]="event.type | eventType" class="me-2"></fa-icon>
                        {{ event.label }}
                    </div>
                </div>

                <button-box (clickedEvent)="onDelete(event.id)"
                            *jhiHasAnyAuthority="['ROLE_ADMIN']"
                            [showText]="false"
                            primeIcon="pi-times"
                            translateKey="common.delete"
                            type="danger">
                </button-box>
            </li>
        }
    </ul>
} @else {
    <p class="text-muted mb-0">Aucun événement enregistré.</p>
}
