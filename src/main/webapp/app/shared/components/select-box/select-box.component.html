<p-iftalabel>
    <p-select [options]="options"
              [formControl]="control"
              [inputId]="'field_' + fieldName"
              [invalid]="control.invalid && control.touched"
              [dataKey]="dataKeyToUse"
              [filter]="enableFilter"
              [filterBy]="filterByToUse"
              [showClear]="!control.hasValidator(Validators.required)"
              fluid>
        <!-- Affichage dans la liste -->
        <ng-template pTemplate="item" let-item>
            {{ needTranslation ? (getLabel(item) | translate) : getLabel(item) }}
        </ng-template>

        <!-- Affichage de la valeur sélectionnée -->
        <ng-template pTemplate="selectedItem" let-item>
            {{ needTranslation ? (getLabel(item) | translate) : getLabel(item) }}
        </ng-template>
    </p-select>

    @if (translateKey) {
        <label [for]="'field_' + fieldName">
            {{ translateKey | translate }}
            @if (control.hasValidator(Validators.required)) {
                <span class="danger-icon">*</span>
            }
        </label>
    }
</p-iftalabel>

@if (control.errors) {
    <error-box [formControlElement]="control"/>
}
