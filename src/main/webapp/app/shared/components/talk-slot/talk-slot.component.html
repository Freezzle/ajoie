<div class="talk-container" [style.width.px]="widthInPx() -2">
    <div class="text-overflow">
        <p-badge [severity]="conferenceType() ? undefined : 'warn'"
                 [value]="conferenceType() ? 'C' : 'A'"/> {{ talk().title }}</div>
    <div class="text-overflow">
        <small>{{ talk().client }}</small>
    </div>
</div>
