<p-menu #menu
        [appendTo]="appendTo()"
        [model]="items()"
        [popup]="true">
    <ng-template #item let-item>
        <div class="am-item">
            @if (item.routerLink) {
                <a [routerLink]="item.routerLink" class="am-item-main">
                    @if (item.icon) {
                        <i [class]="item.icon"></i>
                    }
                    <span class="p-menu-item-label">{{ item.label }}</span>
                </a>
            } @else {
                <span class="am-item-main">
                    @if (item.icon) {
                        <i [class]="item.icon"></i>
                    }
                    <span class="p-menu-item-label">{{ item.label }}</span>
                </span>
            }
            @if (hasHelp(item)) {
                <i (click)="showHelp($event, item)"
                   [attr.aria-label]="helpLabel"
                   [class.is-blocked]="item.disabled"
                   [class.pi-exclamation-circle]="item.disabled"
                   [class.pi-question-circle]="!item.disabled"
                   [title]="helpLabel"
                   class="pi am-help"></i>
            }
        </div>
    </ng-template>
</p-menu>

<action-help-popover #helpPopover [helpText]="currentHelpText" [conditionalKeys]="currentConditionalKeys"/>
