@if (translateKey) {
    <p-iftalabel>
        <p-inputnumber [formControl]="control"
                       [inputId]="'field_' + fieldName"
                       [invalid]="control.invalid && control.touched"
                       [maxFractionDigits]="modeDecimal ? '2': '0'"
                       [minFractionDigits]="0"
                       [showButtons]="true"
                       fluid
                       mode="decimal"
        ></p-inputnumber>
        <label [for]="'field_' + fieldName">{{ translateKey | translate }}
            @if (control.hasValidator(Validators.required)) {
                <span class="text-danger">*</span>
            }
        </label>
    </p-iftalabel>
} @else {
    <p-float-label>
        <p-inputnumber [formControl]="control"
                       [inputId]="'field_' + fieldName"
                       [invalid]="control.invalid && control.touched"
                       [maxFractionDigits]="modeDecimal ? '2': '0'"
                       [minFractionDigits]="0"
                       [showButtons]="true"
                       fluid
                       mode="decimal"
        ></p-inputnumber>
    </p-float-label>
}
@if (control.errors) {
    <error-box [formControlElement]="control"/>
}
