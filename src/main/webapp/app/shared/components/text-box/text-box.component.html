@if (translateKey) {
    <p-iftalabel>
        <input ptInputText
               [id]="'field_' + fieldName"
               pInputText
               [invalid]="control.invalid && control.touched"
               [formControl]="control"
               fluid/>
        <label [for]="'field_' + fieldName">
            {{ translateKey | translate }}
            @if (control.hasValidator(Validators.required)) {
                <span class="danger-icon">*</span>
            }
        </label>
    </p-iftalabel>
} @else {
    <p-float-label>
        <input ptInputText
               [id]="'field_' + fieldName"
               pInputText
               [invalid]="control.invalid && control.touched"
               [formControl]="control"
               fluid/>
    </p-float-label>
}
@if (control.errors) {
    <error-box [formControlElement]="control"/>
}
