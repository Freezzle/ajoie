<p-card [class.pt-4]="!showHeader()" class="mb-4">
    @if (showHeader()) {
        <ng-template #header pTemplate="header">
            <ng-content select="[appCardHeader]"></ng-content>
        </ng-template>
    }

    <!-- Contenu -->
    <ng-content select="[appCardBody]"></ng-content>
</p-card>
