<p-iftalabel>
    <p-datepicker
            [dateFormat]="'dd.mm.yy'"
            [firstDayOfWeek]="1"
            [formControl]="control"
            [inputId]="'field_' + fieldName"
            [invalid]="controlDir.control?.invalid && controlDir.control?.touched"
            fluid
            iconDisplay="input"
            showIcon></p-datepicker>
    @if (translateKey) {
        <label [for]="'field_' + fieldName">{{ translateKey | translate }}
            @if (control.hasValidator(Validators.required)) {
                <span class="text-danger">*</span>
            }
        </label>
    }
</p-iftalabel>
@if (control.errors) {
    <error-box [formControlElement]="control"/>
}
