<div class="checkbox-box {{control.disabled ? 'disabled' : ''}} d-flex p-3 justify-content-between align-items-center"
     [class.is-invalid]="isInvalid">
  <div class="checkbox-box-labels">
    <div>{{ (translateKey ?? '') | translate }}
      @if (infoKey) {
        <info-icon [textKey]="infoKey" />
      }
    </div>
    @if (hint) {
      <small class="checkbox-box-hint">{{ hint }}</small>
    }
  </div>
  <div>
    <p-toggleswitch
      [formControl]="control"
      [inputId]="'field_' + fieldName"
      [invalid]="isInvalid" />
  </div>
</div>
