<p-toggle-button [inputId]="'field_' + fieldName"
        [style.height]="'100%'"
                [formControl]="control"
                [onLabel]="(translateKey ?? '') | translate"
                [offLabel]="(translateKey ?? '') | translate"
                [invalid]="control!.invalid && control!.touched"
                onIcon="pi pi-check"
                offIcon="pi pi-times"
                 iconPos="right"
                fluid></p-toggle-button>
