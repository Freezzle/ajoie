@if (labelKey() || label()) {
    @let text = labelKey() ? (labelKey()! | translate) : label();

    <span [style.--el-color]="color()" [title]="text" class="el-foot-item">
        @if (icon(); as icon) {
            <fa-icon [attr.aria-label]="text" [icon]="icon"></fa-icon>
        }
        @if (showLabel()) {
            <span class="el-foot-text">{{ text }}</span>

          @if (detail()) {
            <em>{{ detail() }}</em>
          }
        }
    </span>
}
