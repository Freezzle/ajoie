@if (labelKey() || label()) {
    @let text = labelKey() ? (labelKey()! | translate) : label();

    <span [appFootHelp]="help" [style.--el-color]="color()" [title]="text" class="el-foot-item">
        @if (icon(); as icon) {
            <fa-icon [animation]="spin() ? 'spin' : undefined"
                     [attr.aria-label]="text"
                     [icon]="icon"></fa-icon>
        }
        @if (showLabel()) {
            <span class="el-foot-text">{{ text }}</span>

          @if (detail()) {
            <em>{{ detail() }}</em>
          }
        }
    </span>

    <p-popover #help [baseZIndex]="9999" appendTo="body">
        <div class="el-foot-help">
            <span class="el-foot-help-text">{{ text }}</span>
            @if (detail()) {
                <em class="el-foot-help-detail">{{ detail() }}</em>
            }
        </div>
    </p-popover>
}
