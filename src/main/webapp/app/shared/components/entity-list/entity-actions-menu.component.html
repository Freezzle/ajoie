@if (menuItems().length > 0) {
    <action-menu #menu [items]="menuItems()"/>
    <button #gear
            (click)="openMenu(menu, $event)"
            [attr.aria-label]="actionsLabel()"
            [title]="actionsLabel()"
            aria-haspopup="menu"
            class="el-gear"
            type="button">
        <i class="pi pi-cog"></i>
    </button>
}
