@if (labelKey()) {
    <span class="el-status-wrap">
        <span [class.el-status--out]="strikethrough()"
              [style.--el-color]="color()"
              class="el-status">{{ labelKey()! | translate }}</span>
        @if (suffix()) {
            <small>{{ suffix() }}</small>
        }
    </span>
}
