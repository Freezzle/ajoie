@if (formControlElement() &&
formControlElement().errors &&
formControlElement().invalid &&
(formControlElement().dirty || formControlElement().touched)) {
  <div class="invalid-tooltip">
    @for (error of errors(); track $index) {
      @if (error.errorKey && formControlElement().errors?.[error.errorKey]) {
        <div [jhiTranslate]="error.translateKey ?? ''" [translateValues]="error.translateValues"></div>
      }
    }
  </div>
}
