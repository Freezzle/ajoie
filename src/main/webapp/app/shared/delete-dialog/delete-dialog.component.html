<form (ngSubmit)="confirmDelete()" name="deleteForm">
    <div class="modal-header">
        <h4 class="modal-title" jhiTranslate="common.delete">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
        <app-alert-error></app-alert-error>
        <p [jhiTranslate]="translateKey" [translateValues]="translateValues" id="jhi-delete-conference-heading"></p>
    </div>

    <div class="modal-footer">
        <button-box (clickedEvent)="cancel()" [showText]="true" primeIcon="pi-times" translateKey="common.cancel" type="secondary"/>

        <button-box (clickedEvent)="confirmDelete()" [isSubmit]="true" primeIcon="pi-times" translateKey="common.delete" type="danger"/>
    </div>
</form>
