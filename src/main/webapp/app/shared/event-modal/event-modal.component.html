<form>
    <div class="modal-header">
        <h4 class="modal-title">Historique</h4>
    </div>

    <div class="modal-body">
        @if (events.length > 0) {
            <ul class="list-group w-100 ul-list">
                @for (event of events; track event) {
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex flex-grow-1 align-items-center gap-2">
                            <!-- date (jour) : invisible quand répétée, mais garde la largeur -->
                            <small class="text-muted text-nowrap date-col"
                                   [class.invisible]="!event.showDate">
                                {{ event.referenceDate | date:'dd.MM.yyyy' }}
                            </small>

                            <!-- heure : toujours affichée -->
                            <small class="text-muted text-nowrap time-col">
                                {{ event.referenceDate | date:'HH:mm' }}
                            </small>

                            <div class="flex-grow-1">
                                <fa-icon [icon]="event.type | eventType" class="me-2"></fa-icon>
                                {{ event.label }}
                            </div>
                        </div>

                        <button-box (clickedEvent)="onDelete(event.id)"
                                    *jhiHasAnyAuthority="['ROLE_ADMIN']"
                                    [showText]="false"
                                    faIcon="times"
                                    type="danger"
                                    translateKey="common.delete">
                        </button-box>
                    </li>
                }
            </ul>
        } @else {
            <p class="text-muted">Aucun événement enregistré.</p>
        }
    </div>

    <div class="modal-footer">
        <button (click)="close()" class="btn btn-primary" data-dismiss="modal" type="button">
            <span jhiTranslate="common.back">Close</span>
        </button>
    </div>
</form>
