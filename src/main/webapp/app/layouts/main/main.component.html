<div class="app-layout" [class.app-layout-public]="isPublicLayout()">
    @if (!isPublicLayout()) {
        <!-- Top navbar -->
        <app-topbar></app-topbar>
    }

    <!-- Global Alert Toast -->
    <app-alert></app-alert>

    <div class="app-layout-body">
        @if (!isPublicLayout()) {
            <!-- Sidebar injected via named router-outlet -->
            <router-outlet name="navbar"></router-outlet>
        }

        <!-- Main content card -->
        @if (isPublicLayout()) {
            <router-outlet></router-outlet>
        } @else {
            <div [class.inDevelopement]="inDevelopementMode()" class="main-content">
                <div>
                    <router-outlet></router-outlet>
                </div>
            </div>
        }
    </div>
</div>
