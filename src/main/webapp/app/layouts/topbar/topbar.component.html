<div class="topbar">
    <!-- Left section: Toggle sidebar button -->
    <div class="topbar-left">
        <button-box (clickedEvent)="toggleSidebar()"
                    [showText]="false"
                    primeIcon="pi-bars"
                    translateKey="navbar.toggle"
                    type="secondary"
                    class="topbar-btn toggle-btn"></button-box>
    </div>

    <!-- Right section: User actions and settings -->
    <div class="topbar-right">
        <!-- Presence component -->
        <app-presence *jhiHasAnyAuthority="['ROLE_ADMIN_BUSINESS']" class="topbar-item"></app-presence>

        <!-- Chat messages component -->
        <app-chat-messages *jhiHasAnyAuthority="['ROLE_ADMIN_BUSINESS']" class="topbar-item"></app-chat-messages>

        <!-- Eye toggle button for sensitive information -->
        <button-box (clickedEvent)="navigationService.hideSensibleInformation.set(!navigationService.hideSensibleInformation())"
                    [showText]="false"
                    [primeIcon]="navigationService.hideSensibleInformation() ? 'pi-eye-slash' : 'pi-eye'"
                    [translateKey]="navigationService.hideSensibleInformation() ? 'navbar.showInfo' : 'navbar.hideInfo'"
                    type="secondary"
                    class="topbar-btn"></button-box>

        <!-- User authenticated section -->
        @if (account() !== null) {
            <!-- Sessions button -->
            <button-box [showText]="false"
                        [routerLink]="['/account/sessions']"
                        [modeLink]="true"
                        primeIcon="pi-cloud"
                        translateKey="navbar.sessions"
                        type="secondary"
                        class="topbar-btn"></button-box>

            <!-- Logout button -->
            <button-box (clickedEvent)="logout()"
                        [showText]="false"
                        primeIcon="pi-sign-out"
                        translateKey="navbar.logout"
                        type="danger"
                        class="topbar-btn"></button-box>
        } @else {
            <!-- Login button -->
            <button-box (clickedEvent)="login()"
                        [showText]="false"
                        primeIcon="pi-sign-in"
                        translateKey="navbar.login"
                        type="secondary"
                        class="topbar-btn"></button-box>

            <!-- Register button -->
            <button-box [showText]="false"
                        [routerLink]="['/account/register']"
                        [modeLink]="true"
                        primeIcon="pi-user-plus"
                        translateKey="navbar.register"
                        type="secondary"
                        class="topbar-btn"></button-box>
        }
    </div>
</div>
