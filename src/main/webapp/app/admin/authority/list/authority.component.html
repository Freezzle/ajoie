<div>
    <h2 id="page-heading">
        <div class="d-flex justify-content-center">
            <span jhiTranslate="authority.title">Les authorités</span>
        </div>
        <hr/>
        <div class="d-flex justify-content-between mt-4">
            <span>
                <button-box (clickedEvent)="previousState()"
                            [isDisabled]="isLoading"
                            [showText]="false"
                            faIcon="arrow-left" translateKey="common.back"/>
            </span>

            <span>
                <button (click)="load()" [disabled]="isLoading" class="btn btn-primary btn-sm">
                    <fa-icon [animation]="isLoading ? 'spin' : undefined" icon="sync"></fa-icon>
                    <span jhiTranslate="common.refresh"></span>
                </button>

                <button [routerLink]="['./new']" class="btn btn-success btn-sm" id="create-entity">
                    <fa-icon icon="plus"></fa-icon>
                    <span jhiTranslate="common.create">Créer</span>
                </button>
            </span>
        </div>
    </h2>
    <p-toast/>
    <p-confirm-dialog/>
    <app-alert-error></app-alert-error>

    <app-alert></app-alert>

    @if (authorities) {
        <div class="table-responsive table-entities" id="entities">
            <table aria-describedby="page-heading" class="table table-hover">
                <thead class="thead-primary">
                <tr (sortChange)="navigateToWithComponentValues($event)" [sortState]="sortState" jhiSort>
                    <th class="text-white" jhiSortBy="name">
                        <div class="d-flex">
                            <span jhiTranslate="authority.name">Name</span>

                            <fa-icon class="p-1" icon="sort"></fa-icon>
                        </div>
                    </th>
                    <th>&nbsp;</th>
                </tr>
                </thead>
                <tbody>
                    @if (authorities.length === 0) {
                        <tr>
                            <td colspan="2">
                                <span jhiTranslate="authority.home.notFound">Aucun Authority</span>
                            </td>
                        </tr>
                    } @else {
                        @for (authority of authorities; track trackName($index, authority)) {
                            <tr>
                                <td [routerLink]="['./', authority.name, 'view']" class="clickable">
                                    {{ authority.name }}
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <button (click)="delete($event, authority)"
                                                class="btn btn-danger btn-sm"
                                                type="submit">
                                            <fa-icon [title]="'common.delete' | translate" icon="times"></fa-icon>
                                            <span jhiTranslate="common.delete"></span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        }
                    }
                </tbody>
            </table>
        </div>
    }
</div>
