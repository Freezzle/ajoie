<div class="d-flex justify-content-center">
    <div class="col-8">
        @if (authority()) {
            <div>
                <h2>
                    <span jhiTranslate="authority.detail.title">Authority</span>
                </h2>

                <hr/>

                <app-alert-error></app-alert-error>

                <app-alert></app-alert>

                <dl class="row-md">
                    <dt>
                        <span jhiTranslate="authority.name">Name</span>
                    </dt>
                    <dd>
                        <span>{{ authority()!.name }}</span>
                    </dd>
                </dl>

                <button-box (clickedEvent)="previousState()" [showText]="true" primeIcon="pi-arrow-left" translateKey="common.back" type="primary"/>
            </div>
        }
    </div>
</div>
