<div>
    <form (ngSubmit)="save()" [formGroup]="editForm" name="editForm" novalidate>
        <h2 id="page-heading">

            <div class="d-flex justify-content-center">
                @if (!authority?.name) {
                    <span jhiTranslate="authority.create">Nouvel authorité</span>
                }
            </div>
            <hr/>

            <div class="d-flex justify-content-between mt-4">
        <span>
          <button-box (clickedEvent)="previousState()"
                      [isDisabled]="isLoading"
                      [showText]="false"
                      primeIcon="pi-arrow-left" translateKey="common.back"/>
          </span>

                <span>
            @if (!isReadOnly) {
                <button-box
                        [isDisabled]="editForm.invalid || isLoading"
                        [isSubmit]="true"
                        [showText]="false"
                        primeIcon="pi-save" translateKey="common.save"/>
            }
          </span>
            </div>
        </h2>

        <div>
            <app-alert-error></app-alert-error>

            <app-alert></app-alert>

            <div class="card">
                <h5 class="card-header" jhiTranslate="common.info-basic">Information de base</h5>
                <div class="card-body">
                    <div class="row">
                        <div class="col-sm-12 fw-bold align-content-center position-relative">
                            <label for="field_name" jhiTranslate="authority.name">Nom</label>
                            <input [readonly]="editForm.get('name')!.disabled" class="form-control"
                                   formControlName="name" id="field_name" name="name" type="text"/>
                            <field-error [errors]="[ErrorModel.required(), ErrorModel.maxlength(50)]"
                                         [formControlElement]="getName"></field-error>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
