<div class="row" [formGroup]="form">

    <!-- Mode de paiement : détermine le libellé imprimé -->
    <div class="col-12 col-sm-6 mt-3">
        <select-box fieldName="paymentMode"
                    formControlName="paymentMode"
                    translateKey="invoicingPlan.payment.mode"
                    [options]="modeOptions"
                    [formatterFunction]="modeFormatter"/>
    </div>

    <!-- Libellé imprimé sur la facture / quittance -->
    <div class="col-12 col-sm-6 mt-3">
        <text-box fieldName="label"
                  formControlName="label"
                  translateKey="invoicingPlan.payment.label"/>
        <small class="text-muted">
            {{ (isCustomLabel ? 'invoicingPlan.payment.labelCustom' : 'invoicingPlan.payment.labelAuto') | translate }}
        </small>
    </div>

    <!-- Date de paiement -->
    <div class="col-12 col-sm-6 mt-3">
        <date-box fieldName="billingDate"
                  formControlName="billingDate"
                  translateKey="invoicingPlan.payment.date"/>
    </div>

    <!-- Montant -->
    <div class="col-12 col-sm-6 mt-3">
        <currency-box fieldName="amount"
                      formControlName="amount"
                      translateKey="invoicingPlan.payment.amount"/>
    </div>

    <!-- Note interne : jamais imprimée -->
    <div class="col-12 mt-3">
        <text-box fieldName="extraInformation"
                  formControlName="extraInformation"
                  translateKey="invoicingPlan.payment.comment"/>
        <small class="text-muted">{{ 'invoicingPlan.payment.commentHint' | translate }}</small>
    </div>

</div>
