<form (ngSubmit)="confirmAdd()" name="addForm">
    <div class="modal-header">
        <h4 class="modal-title">Créer un plan</h4>
    </div>

    <div class="modal-body">
        <app-alert-error></app-alert-error>
        <div class="row">
            <div class="col-sm-12 fw-bold align-content-center position-relative">
                <label for="field_name">Nom du plan</label> <input [(ngModel)]="info.name" class="form-control"
                                                                   id="field_name" name="name" type="text"/>
            </div>
            <div class="col-sm-4 fw-bold align-content-center position-relative">
                <label for="field_width">Longueur (m)</label>
                <input [(ngModel)]="info.widthMeter" class="form-control" id="field_width" name="widthMeter"
                       type="number"/>
            </div>
            <div class="col-sm-4 fw-bold align-content-center position-relative">
                <label for="field_height">Hauteur (m)</label>
                <input [(ngModel)]="info.heightMeter" class="form-control" id="field_height" name="heightMeter"
                       type="number"/>
            </div>
            <div class="col-sm-4 fw-bold align-content-center position-relative">
                <label for="field_spacing">Taille d'un carré (m)</label>
                <input [(ngModel)]="info.spacingMeter" class="form-control" id="field_spacing" name="spacingMeter"
                       type="number"/>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button-box (clickedEvent)="cancel()" [showText]="true" primeIcon="pi-times" translateKey="common.cancel" type="secondary"/>

        <button-box (clickedEvent)="confirmAdd()" [isSubmit]="true" primeIcon="pi-plus" translateKey="common.create" type="primary"/>
    </div>
</form>
