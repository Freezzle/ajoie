<form (ngSubmit)="confirmAdd()" name="addForm">
    <div class="modal-header">
        <h4 class="modal-title">Renommer le plan</h4>
    </div>

    <div class="modal-body">
        <app-alert-error></app-alert-error>
        <div class="row">
            <div class="col-sm-12 fw-bold align-content-center position-relative">
                <label for="field_name">Nom du plan</label> <input [(ngModel)]="floorName" class="form-control"
                                                                   id="field_name" name="name" type="text"/>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button-box (clickedEvent)="cancel()" [showText]="true" translateKey="common.cancel" type="secondary"/>

        <button-box (clickedEvent)="confirmAdd()" [isSubmit]="true" translateKey="common.validate" type="primary"/>
    </div>
</form>
