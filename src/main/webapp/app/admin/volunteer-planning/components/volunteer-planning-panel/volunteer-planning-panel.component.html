<p-confirm-dialog></p-confirm-dialog>

<p-tabs [(value)]="topTab" lazy>
    <p-tablist>
        <p-tab value="0">Jours / Bénévoles / Assignations</p-tab>
        <p-tab value="1">Catégories</p-tab>
    </p-tablist>

    <p-tabpanels>
        <!-- ================= TAB PLANNING ================= -->
        <p-tabpanel value="0">
            <p-tabs (valueChange)="ensureSelectedDay()" [(value)]="planningTab" lazy>
                <p-tablist>
                    <p-tab value="0">Jours</p-tab>
                    <p-tab value="1">Bénévoles</p-tab>
                    <p-tab value="2">Assigner / Désassigner</p-tab>
                </p-tablist>

                <p-tabpanels>
                    <!-- -------- JOURS (inline editable) -------- -->
                    <p-tabpanel value="0">
                        <label>Intervalle (minutes)</label>
                        <p-select
                                (ngModelChange)="onIntervalChange($event)"
                                [ngModel]="planning().intervalMinutes"
                                [options]="intervalOptions"
                        ></p-select>

                        <div class="toolbar">
                            <p-button (onClick)="addDay()" icon="pi pi-plus" label="Ajouter un jour"></p-button>
                        </div>

                        <p-table [rowHover]="true" [value]="planning().days">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th style="width: 22rem;">Label</th>
                                    <th style="width: 14rem;">Début</th>
                                    <th style="width: 14rem;">Fin</th>
                                    <th style="width: 7rem;">Actions</th>
                                </tr>
                            </ng-template>

                            <ng-template let-d pTemplate="body">
                                <tr>
                                    <td>
                                        <input
                                                (ngModelChange)="updateDayLabel(d.id, $event)"
                                                [ngModel]="d.label"
                                                class="w-full"
                                                pInputText
                                        />
                                    </td>

                                    <td>
                                        <p-datepicker
                                                (ngModelChange)="updateDayTimes(d.id, $event, d.endTime)"
                                                [ngModel]="d.startTime"
                                                [showIcon]="true"
                                                [showTime]="true"
                                                [timeOnly]="true"
                                                hourFormat="24"
                                        ></p-datepicker>
                                    </td>

                                    <td>
                                        <p-datepicker
                                                (ngModelChange)="updateDayTimes(d.id, d.startTime, $event)"
                                                [ngModel]="d.endTime"
                                                [showIcon]="true"
                                                [showTime]="true"
                                                [timeOnly]="true"
                                                hourFormat="24"
                                        ></p-datepicker>
                                    </td>

                                    <td>
                                        <p-button
                                                (onClick)="confirmDeleteDay(d.id, d.label)"
                                                [text]="true"
                                                icon="pi pi-trash"
                                                severity="danger"
                                        ></p-button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </p-tabpanel>

                    <!-- -------- BENEVOLES (inline editable) -------- -->
                    <p-tabpanel value="1">
                        <div class="toolbar">
                            <p-button (onClick)="addVolunteer()" icon="pi pi-plus"
                                      label="Ajouter un bénévole"></p-button>
                        </div>

                        <p-table [rowHover]="true" [value]="planning().volunteers">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Label</th>
                                    <th style="width: 7rem;">Actions</th>
                                </tr>
                            </ng-template>

                            <ng-template let-v pTemplate="body">
                                <tr>
                                    <td>
                                        <input
                                                (ngModelChange)="updateVolunteerLabel(v.id, $event)"
                                                [ngModel]="v.label"
                                                class="w-full"
                                                pInputText
                                        />
                                    </td>

                                    <td>
                                        <p-button
                                                (onClick)="confirmDeleteVolunteer(v.id, v.label)"
                                                [text]="true"
                                                icon="pi pi-trash"
                                                severity="danger"
                                        ></p-button>
                                    </td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </p-tabpanel>

                    <!-- -------- ASSIGNATIONS (déjà inline) -------- -->
                    <p-tabpanel value="2">
                        <div class="assign-layout">
                            <div class="assign-left">
                                <label>Jour</label>
                                <p-select
                                        (ngModelChange)="selectedDayId.set($event)"
                                        [ngModel]="selectedDayId()"
                                        [options]="dayOptions()"
                                        placeholder="Choisir un jour"
                                ></p-select>

                                <div class="spacer"></div>

                                <label>Ajouter des bénévoles</label>
                                <p-multiSelect
                                        (ngModelChange)="selectedVolunteerIdsToAssign.set($event)"
                                        [display]="'chip'"
                                        [ngModel]="selectedVolunteerIdsToAssign()"
                                        [options]="unassignedVolunteerOptions()"
                                        defaultLabel="Sélectionner..."
                                        optionLabel="label"
                                        optionValue="value"
                                ></p-multiSelect>

                                <p-button
                                        (onClick)="assignSelectedVolunteers()"
                                        [disabled]="!selectedDay() || selectedVolunteerIdsToAssign().length === 0"
                                        class="assign-btn"
                                        icon="pi pi-plus"
                                        label="Assigner"
                                ></p-button>
                            </div>

                            <div class="assign-right">
                                <h4 class="title">Bénévoles assignés</h4>

                                @if (selectedDay(); as d) {
                                    <p-table [rowHover]="true" [value]="assignedVolunteers()">
                                        <ng-template pTemplate="header">
                                            <tr>
                                                <th>Label</th>
                                                <th style="width: 6rem;">Action</th>
                                            </tr>
                                        </ng-template>

                                        <ng-template let-v pTemplate="body">
                                            <tr>
                                                <td>{{ v.label }}</td>
                                                <td class="actions">
                                                    <p-button
                                                            (onClick)="unassignVolunteer(d.id, v.id)"
                                                            [text]="true"
                                                            icon="pi pi-times"
                                                            severity="danger"
                                                    ></p-button>
                                                </td>
                                            </tr>
                                        </ng-template>
                                    </p-table>
                                } @else {
                                    <div class="muted">Choisis un jour pour gérer les assignations.</div>
                                }
                            </div>
                        </div>
                    </p-tabpanel>
                </p-tabpanels>
            </p-tabs>
        </p-tabpanel>

        <!-- ================= TAB CATEGORIES ================= -->
        <p-tabpanel value="1">
            <div class="toolbar">
                <p-button (onClick)="addCategory()" icon="pi pi-plus" label="Ajouter une catégorie"></p-button>
            </div>

            <p-table [rowHover]="true" [value]="planning().categories">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width: 14rem;">Icon</th>
                        <th style="width: 16rem;">Couleur</th>
                        <th>Label</th>
                        <th style="width: 7rem;">Actions</th>
                    </tr>
                </ng-template>

                <ng-template let-c pTemplate="body">
                    <tr>
                        <td class="d-flex justify-content-between">
                            <p-select
                                    (ngModelChange)="updateCategoryIcon(c.id, $event)"
                                    [ngModel]="c.icon"
                                    [options]="iconOptions"
                                    class="w-full"
                                    optionLabel="label"
                                    optionValue="value"></p-select>

                            <div class="icon-preview">
                                <i [class]="c.icon"></i>
                            </div>
                        </td>

                        <td>
                            <div class="color-row">
                                <p-color-picker
                                        (ngModelChange)="updateCategoryColor(c.id, $event)"
                                        [format]="'hex'"
                                        [ngModel]="c.color"/>
                                <span class="mono">{{ c.color }}</span>
                            </div>
                        </td>

                        <td>
                            <input (ngModelChange)="updateCategoryLabel(c.id, $event)"
                                   [ngModel]="c.label"
                                   class="w-full"
                                   pInputText
                            />
                        </td>

                        <td class="actions">
                            <p-button
                                    (onClick)="confirmDeleteCategory(c.id, c.label)"
                                    [text]="true"
                                    icon="pi pi-trash"
                                    severity="danger"
                            ></p-button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </p-tabpanel>
    </p-tabpanels>
</p-tabs>
