<div class="row">
    <div class="col-12">
        <label>Libellé du jour</label>
        <input pInputText
               [fluid]="true"
               [ngModel]="dayLabel()"
               (ngModelChange)="setDayLabelDraft($event)"
               (blur)="commitDayLabel()"
               (keydown.enter)="commitDayLabel()"/>
    </div>

    <div class="mt-4 col-12">
        <label>{{ 'planningVolunteers.day.date' | translate }}</label>
        <p-datepicker [fluid]="true"
                      [ngModel]="dateValue()"
                      (ngModelChange)="updateDate($event)"
                      dateFormat="dd.mm.yy"
                      [showButtonBar]="true"
                      appendTo="body"></p-datepicker>
    </div>

    <div class="mt-4 col-12">
        <label>{{ 'planningVolunteers.day.description' | translate }}</label>
        <textarea pTextarea
                  [fluid]="true"
                  rows="2"
                  [ngModel]="dayDescription()"
                  (ngModelChange)="setDayDescriptionDraft($event)"
                  (blur)="commitDayDescription()"></textarea>
    </div>

    <div class="mt-4 col-6">
        <div>Début</div>
        <p-datepicker [fluid]="true"
                      [ngModel]="day()?.startTime"
                      (ngModelChange)="updateStartTime($event)"
                      [timeOnly]="true"
                      [showTime]="true"
                      hourFormat="24"
                      appendTo="body"
                      [stepMinute]="interval()"></p-datepicker>
    </div>

    <div class="mt-4 col-6">
        <div>Fin</div>
        <p-datepicker [fluid]="true"
                      [ngModel]="day()?.endTime"
                      (ngModelChange)="updateEndTime($event)"
                      [timeOnly]="true"
                      [showTime]="true"
                      hourFormat="24"
                      appendTo="body"
                      [stepMinute]="interval()"></p-datepicker>
    </div>

    <div class="mt-4 col-12">
        <label>{{ 'planningVolunteers.interval.label' | translate }}</label>
        <p-select [fluid]="true"
                  [options]="intervalOptions()"
                  optionLabel="label"
                  optionValue="value"
                  [ngModel]="interval()"
                  (ngModelChange)="updateInterval($event)"
                  appendTo="body"></p-select>
    </div>
</div>
