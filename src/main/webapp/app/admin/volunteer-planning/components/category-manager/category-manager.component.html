<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-end">
            <button-box (clickedEvent)="addCategory()"
                        primeIcon="pi-plus"
                        translateKey="common.create"
                        type="success"/>
        </div>
        <p-table [value]="categories()" [rowHover]="true" [dataKey]="'id'">
            <ng-template pTemplate="header">
                <tr>
                    <th>Icon</th>
                    <th>Couleur</th>
                    <th>Label</th>
                    <th></th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-c>
                <tr>
                    <td>
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            @if (c.icon) {
                                <i [class]="c.icon"></i>
                            } @else {
                                <span class="w-1r"></span>
                            }

                            <p-select appendTo="body"
                                      [fluid]="true"
                                      [options]="iconOptions"
                                      optionLabel="label"
                                      optionValue="value"
                                      [ngModel]="c.icon ?? ''"
                                      (ngModelChange)="updateIcon(c.id, $event)"></p-select>
                        </div>
                    </td>

                    <td>
                        <div>
                            <p-color-picker appendTo="body" [format]="'hex'" [ngModel]="c.color"
                                            (ngModelChange)="updateColor(c.id, $event)"/>
                            <span>{{ c.color }}</span>
                        </div>
                    </td>

                    <td>
                        <input pInputText
                               [fluid]="true"
                               [ngModel]="categoryLabel(c)"
                               (ngModelChange)="setCategoryLabelDraft(c.id, $event)"
                               (blur)="commitCategoryLabel(c.id)"
                               (keydown.enter)="commitCategoryLabel(c.id)"/>
                    </td>

                    <td class="text-end">
                        <button-box (clickedEvent)="deleteCategory(c.id)"
                                    [showText]="false"
                                    primeIcon="pi-times"
                                    translateKey="common.delete"
                                    type="danger"/>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
