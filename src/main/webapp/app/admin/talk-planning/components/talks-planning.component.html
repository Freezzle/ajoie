<app-content-page>
    <div appMenuBarStart>
        <h3>{{ 'salon.talksPlanning' | translate }}</h3>
    </div>
    <div appMenuBarEnd>
        <button-box (clickedEvent)="previousState()"
                    [isDisabled]="isLoading()"
                    faIcon="arrow-left"
                    translateKey="common.back"
                    [showText]="false"/>

        @if (isReadOnly()) {
            <button-box (clickedEvent)="activateEditMode()"
                        [isDisabled]="isLoading()"
                        faIcon="pencil-alt"
                        translateKey="common.edit"
                        [showText]="false"/>
        }

        @if (!isReadOnly()) {
            <button-box (clickedEvent)="activateReadOnlyMode()"
                        [isDisabled]="isLoading()"
                        faIcon="ban"
                        translateKey="common.cancel"
                        [showText]="false"
                        type="secondary"/>
            <button-box (clickedEvent)="save()"
                        [isDisabled]="isLoading()"
                        [isSubmit]="true"
                        faIcon="floppy-disk"
                        translateKey="common.save"
                        [showText]="false"/>
        }
    </div>
    <app-alert-error></app-alert-error>
    <app-alert></app-alert>
    <p-toast/>
    <p-confirmpopup/>
    <app-card [showHeader]="false">
        <div appCardBody>
            @if (configuration) {
                <timeline-talks [(configuration)]="configuration"
                                [(talks)]="talks"
                                [editionMode]="!isLoading() && !isReadOnly()"/>
            }

            @if (!isLoading() && !hasConfiguration && isReadOnly()) {
                <div>Veuillez activer le mode édition pour démarrer un nouveau planning.</div>
            }
        </div>
    </app-card>
</app-content-page>
