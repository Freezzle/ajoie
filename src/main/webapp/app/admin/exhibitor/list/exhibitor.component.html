<div>
  <h2 id="page-heading">
    <div class="d-flex justify-content-center">
      <span jhiTranslate="exhibitor.title">Les exposants</span>
    </div>
    <hr/>

    <div class="d-flex justify-content-between mt-3">
      <span>
        <button-box (clickedEvent)="previousState()"
                    faIcon="arrow-left"
                    [isDisabled]="isLoading"
                    translateKey="common.back"/>
      </span>

      <span [formGroup]="filters" class="row">
        <div class="col-auto">
          <input (blur)="actionFilter()"
                 class="form-control"
                 formControlName="fullName"
                 [placeholder]="'exhibitor.filter.fullName' | translate"
                 type="text"/>
        </div>
        <div class="col-auto">
          <div class="col-auto">
            <input (blur)="actionFilter()"
                   class="form-control"
                   formControlName="email"
                   [placeholder]="'exhibitor.filter.email' | translate"
                   type="text"/>
          </div>
        </div>
      </span>

      <span>
        <button-box (clickedEvent)="refresh()"
                    faIcon="sync"
                    [faIconAnimation]="isLoading ? 'spin' : undefined"
                    [isDisabled]="isLoading"
                    translateKey="common.refresh"/>

        <link-box [links]="['./new']" type="success"
                  translateKey="common.create"
                  faIcon="plus"
                  [isDisabled]="isLoading"/>
      </span>
    </div>
  </h2>

  <jhi-alert-error></jhi-alert-error>

  <div class="table-responsive table-entities" id="entities">
    <table aria-describedby="page-heading" class="table table-hover">
      <thead class="thead-primary">
        <tr (sortChange)="navigateToWithComponentValues($event)" [sortState]="sortState" jhiSort>
          <th jhiSortBy="fullName" scope="col">
            <div class="d-flex">
              <span jhiTranslate="exhibitor.fullName">Nom complet</span>

              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th jhiSortBy="email" scope="col">
            <div class="d-flex">
              <span jhiTranslate="exhibitor.email">Email</span>

              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th jhiSortBy="phoneNumber" scope="col">
            <div class="d-flex">
              <span jhiTranslate="exhibitor.phoneNumber">Téléphone</span>

              <fa-icon class="p-1" icon="sort"></fa-icon>
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        @if (exhibitors.length === 0) {
          <tr>
            <td colspan="4">
              <span jhiTranslate="exhibitor.notFound">Aucun exposant</span>
            </td>
          </tr>
        } @else {
          @for (exhibitor of exhibitorsPaginated; track $index) {
            <tr>
              <td class="go-detail" [routerLink]="['./', exhibitor.id, 'view']">{{ exhibitor.fullName }}</td>
              <td class="go-detail" [routerLink]="['./', exhibitor.id, 'view']">{{ exhibitor.email }}</td>
              <td class="go-detail" [routerLink]="['./', exhibitor.id, 'view']">{{ exhibitor.phoneNumber }}</td>
              <td class="text-end">
                <div class="btn-group">
                  <button-box (clickedEvent)="delete(exhibitor)"
                              [showText]="false" translateKey="common.delete" faIcon="times" type="danger" [isSubmit]="true"/>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>

  <jhi-pagination (pageChanged)="refreshExhibitors($event)" [collectionSize]="exhibitors.length"/>
</div>
