<div class="d-flex align-items-center flex-wrap gap-3 mb-2">
    <div class="flex-grow-1 min-w-0">
        <p-tabs [value]="selectedDayId() ?? undefined" scrollable>
            <p-tablist>
                @for (day of days(); track day.id) {
                    <p-tab (click)="daySelected.emit(day.id)" [value]="day.id">
                        <div class="d-flex align-items-center gap-2 text-nowrap">
                            <span>{{ day.label }}</span>
                            @if (hasConflict(day.id)) {
                                <span class="badge rounded-pill text-bg-danger">{{ conflictsByDay().get(day.id) }}</span>
                            }
                        </div>
                    </p-tab>
                }
            </p-tablist>
        </p-tabs>
    </div>

    <div class="ms-auto d-flex align-items-center gap-2">
        @if (isReadOnly()) {
            @if (menuItems().length > 0) {
                <menu-box [buttonDisabled]="isLoading()"
                          [items]="menuItems()"
                          buttonIcon="pi-list"
                          buttonTranslateKey="common.actions"/>
            }
        } @else {
            <button-box (clickedEvent)="configRequested.emit()"
                        [isDisabled]="isLoading()"
                        primeIcon="pi-sliders-h"
                        translateKey="planningTalks.config.title"
                        type="secondary"/>
            <button-box (clickedEvent)="undoRequested.emit()"
                        [isDisabled]="isLoading() || !canUndo()"
                        primeIcon="pi-undo"
                        translateKey="planningTalks.undo"
                        type="secondary"/>
        }
    </div>
</div>
