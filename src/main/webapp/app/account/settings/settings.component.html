<div>
    <div class="d-flex justify-content-center">
        <div class="col-md-8">
            @if (settingsForm.value.login) {
                <h2 [translateValues]="{ username: settingsForm.value.login }" jhiTranslate="settings.title">
                    Profil de l&apos;utilisateur [<strong>{{ settingsForm.value.login }}</strong>] </h2>
            }
            @if (success()) {
                <div class="alert alert-success" jhiTranslate="settings.messages.success">
                    <strong>Votre profil a été sauvegardé !</strong>
                </div>
            }

            <app-alert-error></app-alert-error>

            @if (settingsForm.value.login) {
                <form (ngSubmit)="save()" [formGroup]="settingsForm" name="form" novalidate>
                    <div class="mb-3 position-relative">
                        <label class="form-label" for="firstName" jhiTranslate="settings.form.firstname">Prénom</label>
                        <input [placeholder]="'settings.form.firstname.placeholder' | translate"
                               class="form-control"
                               formControlName="firstName"
                               id="firstName"
                               name="firstName"
                               type="text"/>

                        <field-error [errors]="[ErrorModel.required(), ErrorModel.minlength(1), ErrorModel.maxlength(50)]"
                                     [formControlElement]="getFirstName"></field-error>
                    </div>

                    <div class="mb-3 position-relative">
                        <label class="form-label" for="lastName" jhiTranslate="settings.form.lastname">Nom</label>
                        <input [placeholder]="'settings.form.lastname.placeholder' | translate"
                               class="form-control"
                               formControlName="lastName"
                               id="lastName"
                               name="lastName"
                               type="text"/>

                        <field-error [errors]="[ErrorModel.required(), ErrorModel.minlength(1), ErrorModel.maxlength(50)]"
                                     [formControlElement]="getLastName"></field-error>
                    </div>

                    <div class="mb-3 position-relative">
                        <label class="form-label" for="email" jhiTranslate="global.form.email.label">Email</label>
                        <input [placeholder]="'global.form.email.placeholder' | translate"
                               class="form-control"
                               formControlName="email"
                               id="email"
                               name="email"
                               type="email"/>

                        <field-error [errors]="[
                ErrorModel.required(),
                ErrorModel.minlength(5),
                ErrorModel.maxlength(254),
                ErrorModel.custom('email', 'global.messages.validate.email.invalid'),
              ]" [formControlElement]="getEmail"></field-error>
                    </div>

                    @if (languages && languages.length > 0) {
                        <div class="mb-3">
                            <label for="langKey" jhiTranslate="settings.form.language">Langue</label>
                            <select class="form-control" formControlName="langKey" id="langKey" name="langKey">
                                @for (language of languages; track $index) {
                                    <option [value]="language">{{ language | findLanguageFromKey }}</option>
                                }
                            </select>
                        </div>
                    }

                    <button-box [isDisabled]="settingsForm.invalid" [isSubmit]="true" translateKey="settings.form.button" type="primary"/>
                </form>
            }
        </div>
    </div>
</div>
