<div>
    <h2 id="page-heading">
        <div class="d-flex justify-content-center">
            <span>Sessions actives</span>
        </div>
        <hr/>

        <div class="d-flex justify-content-between mt-4">
      <span>
        <button-box (clickedEvent)="previousState()"
                    [isDisabled]="isLoading"
                    [showText]="false"
                    primeIcon="pi-arrow-left" translateKey="common.back"/>
      </span>
        </div>
    </h2>

    <div class="table-responsive">
        <table aria-describedby="session-page-heading" class="table table-striped">
            <thead>
            <tr>
                <th jhiTranslate="sessions.table.ipaddress" scope="col">Adresse IP</th>
                <th jhiTranslate="sessions.table.useragent" scope="col">User Agent</th>
                <th jhiTranslate="sessions.table.date" scope="col">Date</th>
                <th scope="col"></th>
            </tr>
            </thead>
            <tbody>
                @for (session of sessions; track $index) {
                    <tr>
                        <td>{{ session.ipAddress }}</td>
                        <td>{{ session.userAgent }}</td>
                        <td>{{ session.tokenDate | date: 'longDate' }}</td>
                        <td>
                            <button (click)="invalidate(session.series)" class="btn btn-primary" jhiTranslate="sessions.table.button"
                                    type="submit">
                                Invalider
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
