<div>
    <div class="d-flex justify-content-center">
        @if (account$ | async; as account) {
            <div class="col-md-8">
                <h2 [translateValues]="{ username: account.login }" jhiTranslate="password.title"></h2>

                @if (success()) {
                    <div class="alert alert-success" jhiTranslate="password.messages.success"></div>
                }
                @if (error()) {
                    <div class="alert alert-danger" jhiTranslate="password.messages.error"></div>
                }
                @if (doNotMatch()) {
                    <div class="alert alert-danger" jhiTranslate="global.messages.error.dontmatch"></div>
                }

                <form (ngSubmit)="changePassword()" [formGroup]="passwordForm" name="form">
                    <div class="mb-3 position-relative">
                        <label class="form-label" for="currentPassword"
                               jhiTranslate="global.form.currentpassword.label"></label>
                        <input [placeholder]="'global.form.currentpassword.placeholder' | translate"
                               class="form-control"
                               formControlName="currentPassword"
                               id="currentPassword"
                               name="currentPassword"
                               type="password"/>

                        <field-error [errors]="[ErrorModel.required()]"
                                     [formControlElement]="getCurrentPassword"></field-error>
                    </div>

                    <div class="mb-3 position-relative">
                        <label class="form-label" for="newPassword"
                               jhiTranslate="global.form.newpassword.label"></label>
                        <input [placeholder]="'global.form.newpassword.placeholder' | translate"
                               class="form-control"
                               formControlName="newPassword"
                               id="newPassword"
                               name="newPassword"
                               type="password"/>

                        <field-error [errors]="[ErrorModel.required(), ErrorModel.minlength(4), ErrorModel.maxlength(50)]"
                                     [formControlElement]="getNewPassword"></field-error>

                        <app-password-strength-bar
                                [passwordToCheck]="passwordForm.get('newPassword')!.value"></app-password-strength-bar>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword"
                               jhiTranslate="global.form.confirmpassword.label"></label>
                        <input [placeholder]="'global.form.confirmpassword.placeholder' | translate"
                               class="form-control"
                               formControlName="confirmPassword"
                               id="confirmPassword"
                               name="confirmPassword"
                               type="password"/>

                        <field-error [errors]="[ErrorModel.required(), ErrorModel.minlength(4), ErrorModel.maxlength(50)]"
                                     [formControlElement]="getConfirmPassword"></field-error>
                    </div>

                    <button [disabled]="passwordForm.invalid" class="btn btn-primary" jhiTranslate="password.form.button"
                            type="submit"></button>
                </form>
            </div>
        }
    </div>
</div>
