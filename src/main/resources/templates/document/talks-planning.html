<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <link href="styles.css" media="all" rel="stylesheet" type="text/css" />
  <!-- Document interne sans en-tête : seules les marges de page diffèrent du standard -->
  <style>
    @page {
      margin: 20mm;
    }
  </style>
</head>

<body>
<!-- Une page par combinaison jour / salle -->
<div th:each="page, iterStat : ${pages}" th:classappend="${!iterStat.last} ? 'page-break'">
  <div class="page-header">
    <h1 th:text="${page.roomLabel}">Salle</h1>
    <p class="page-subtitle" th:text="${page.dayLabel}">Jour</p>
    <hr class="separator" />
  </div>

  <p class="muted text-center" th:if="${page.talks.isEmpty()}">
    Aucune animation prévue pour cette salle ce jour-là.
  </p>

  <div class="block" th:each="talk : ${page.talks}">
    <table class="agenda">
      <tr>
        <td class="agenda-time" th:text="${talk.startTime}">08:00</td>
        <td>
          <div class="block-title" th:text="${talk.title}">Titre de l'animation</div>
          <div class="muted">[[${talk.therapistName}]] ([[${talk.exhibitorFullName}]])</div>
          <div class="agenda-description" th:text="${talk.description}">Description de l'animation</div>
        </td>
      </tr>
    </table>
  </div>
</div>
</body>
</html>
