<div th:fragment="header">
  <hr class="separator" />
  <table class="header-table">
    <tr>
      <td class="header-logo-cell"><img alt="logo" class="header-logo" src="logo.jpg" /></td>
      <td>
        <b>[[${sender.getEnterpriseName()}]]</b><br />
        [[${sender.getStreetLine()}]]<br />
        [[${sender.getCityLine()}]]<br />
        [[${sender.getWebsite()}]]
      </td>
      <td class="header-title-cell"><h1>[[${headerTitle}]]</h1></td>
    </tr>
  </table>
</div>
