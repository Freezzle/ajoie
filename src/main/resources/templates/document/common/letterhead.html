<div th:fragment="letterhead">
  <table class="letterhead-table">
    <tr>
      <td>&nbsp;</td>
      <td class="letterhead-address">
        <span th:if="${!#strings.isEmpty(recipient.getEnterpriseName())}">[[${recipient.getEnterpriseName()}]]<br /></span>
        <span th:if="${!#strings.isEmpty(recipient.getFullName())}">[[${recipient.getFullName()}]]<br /></span>
        <span th:if="${!#strings.isEmpty(recipient.getPostalCase())}">[[${recipient.getPostalCase()}]]<br /></span>
        <span th:if="${!#strings.isEmpty(recipient.getStreetLine())}">[[${recipient.getStreetLine()}]]<br /></span>
        <span th:if="${!#strings.isEmpty(recipient.getCountry()) or !#strings.isEmpty(recipient.getCityLine())}">
          <span th:if="${!#strings.isEmpty(recipient.getCountry())}">[[${recipient.getCountry()}]]</span><span th:if="${!#strings.isEmpty(recipient.getCountry()) and !#strings.isEmpty(recipient.getCityLine())}"> - </span><span th:if="${!#strings.isEmpty(recipient.getCityLine())}">[[${recipient.getCityLine()}]]</span><br />
        </span>
        <span th:if="${!#strings.isEmpty(recipient.getExtraLine())}">[[${recipient.getExtraLine()}]]<br /></span>
      </td>
    </tr>
  </table>
  <hr class="separator" />
</div>
