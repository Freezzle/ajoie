<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <link href="styles.css" media="all" rel="stylesheet" type="text/css" />
  <!-- Document interne sans en-tête : grille en paysage, marges réduites -->
  <style>
    @page {
      size: A4 landscape;
      margin: 10mm 12mm;
    }
  </style>
</head>

<body>
<div th:each="page, pageStat : ${pages}" th:classappend="${!pageStat.last} ? 'page-break'">
  <div class="page-header">
    <table>
      <tr>
        <td>
          <h1 th:text="${page.dayLabel}">Samedi</h1>
          <p class="page-subtitle">
            [[${page.timeRange}]] &#183; [[${page.volunteerCount}]] bénévole(s)
          </p>
        </td>
        <td class="text-right">
              <span class="legend-item" th:each="cat : ${page.categories}">
                <span class="legend-swatch" th:style="'background-color: ' + ${cat.color} + ';'">&#160;</span>
                <span th:text="${cat.label}">Catégorie</span>
              </span>
          <span class="legend-item">
                <span class="legend-swatch unavailable">&#160;</span>
                <span>Non disponible</span>
              </span>
        </td>
      </tr>
    </table>
    <hr class="separator" />
  </div>

  <table class="grid">
    <thead>
    <tr>
      <th class="grid-label">&#160;</th>
      <th class="grid-slot" th:each="slot : ${page.slotLabels}" th:text="${slot}">08:00</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${page.rows}">
      <td class="grid-label" th:text="${row.label}">Bénévole</td>
      <td class="grid-cell" th:each="cell : ${row.cells}">
        <span class="cell-unavailable" th:if="${cell.unavailable}">&#160;</span>
        <span class="cell-fill" th:if="${!cell.unavailable and cell.color != null}"
              th:style="'background-color: ' + ${cell.color} + ';'">&#160;</span>
        <span th:if="${!cell.unavailable and cell.color == null}">&#160;</span>
      </td>
    </tr>
    </tbody>
    <tfoot th:if="${!page.totals.isEmpty()}">
    <tr th:each="total, totalStat : ${page.totals}" th:classappend="${totalStat.first} ? 'grid-total-first'">
      <td class="grid-label" th:style="'background-color: ' + ${total.category.color} + ';'"
          th:text="${total.category.label}">Catégorie</td>
      <td th:each="cell : ${total.counts}" th:class="'grid-total cov-' + ${cell.state}"
          th:text="${cell.label}">0/0</td>
    </tr>
    </tfoot>
  </table>
</div>
</body>
</html>
