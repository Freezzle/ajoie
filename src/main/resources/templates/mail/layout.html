<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <title>Event</title>
</head>

<body style="margin:0; padding:0; width:100%; min-width:100%; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; background-color:#fafafa; font-family:sans-serif, Arial, Helvetica; font-size:16px;">

<table role="presentation"
       style="width:100%; border-spacing:0; mso-table-lspace:0; mso-table-rspace:0; background-color:#fafafa;">
    <tr>
        <td style="padding:30px 0;">

            <table role="presentation"
                   style="width:100%; max-width:600px; margin:0 auto; border-spacing:0; mso-table-lspace:0; mso-table-rspace:0; background-color:#ffffff; border-radius:15px; border:1px solid #e0e0e0; box-shadow:0 8px 16px rgba(0,0,0,0.05);">
                <tr>
                    <td style="padding:30px 20px 20px 20px; background-color:#ffffff; border-top-left-radius:15px; border-top-right-radius:15px; text-align:center;">

                        <table role="presentation"
                               style="width:100%; border-spacing:0; mso-table-lspace:0; mso-table-rspace:0;">
                            <tr>
                                <td style="text-align:center;">
                                    <!-- Note: font-size responsive via <style> n'est plus possible en inline seul -->
                                    <h1 style="margin:0; color:#004d40; font-weight:bold; letter-spacing:1px; font-size:30px;">
                                        L'Ajoie de mieux vivre 2026 </h1>
                                </td>
                            </tr>
                        </table>

                        <div style="height:1px; background-color:#d4ac4a; width:50%; margin:25px auto 0 auto; line-height:1px; font-size:1px;">
                            &nbsp;
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:0 40px 40px 40px;">
                        <div style="overflow-wrap: break-word; word-break: break-word;white-space:pre-line;" th:utext="${bodyHtml}"></div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:25px 40px; font-size:12px; color:#444444; background-color:#f0f0f0; border-bottom-left-radius:15px; border-bottom-right-radius:15px; text-align:center;">
                        <p style="margin:0 0 5px 0;">[[${contactAddress}]]</p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
